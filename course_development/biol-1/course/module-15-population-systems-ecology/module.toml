[module]
number = 15
slug = "module-15-population-systems-ecology"
title = "Population and Systems Ecology"
lab = "lab-15_population-systems-ecology.md"
topics = ["Population growth models", "Limits and carrying capacity", "Community interactions", "Energy flow through trophic levels", "Matter cycling and systems feedback"]
contents = ["Population size changes through births, deaths, immigration, and emigration.", "Exponential growth describes rapid increase; logistic growth includes carrying capacity.", "Density-dependent and density-independent factors limit populations differently.", "Energy flows through producers, consumers, and decomposers with loss at transfers.", "Matter cycles through ecosystems while energy must continually enter."]
learning_objectives = ["Compare exponential and logistic population growth.", "Explain carrying capacity and limiting factors.", "Distinguish density-dependent and density-independent regulation.", "Use trophic levels and the 10 percent rule to explain energy limits.", "Contrast energy flow with nutrient cycling."]
study_tips = ["Start with the module's central claim before memorizing vocabulary.", "Use the same-numbered lab as the evidence check for the module.", "Explain one mechanism in words, then redraw it as a simple diagram.", "Answer retrieval questions without notes, then revise with the terms list."]
learning_questions = ["What changes population size?", "How do exponential and logistic growth differ?", "What does carrying capacity mean?", "How do density-dependent and density-independent factors differ?", "Why do food chains have energy limits?", "What does the 10 percent rule describe?", "How do producers, consumers, and decomposers interact?", "Why does energy flow but matter cycle?", "How can feedback regulate a population?", "What evidence would show a population is near carrying capacity?"]

[[terms]]
name = "Population"
definition = "Members of one species in an area."

[[terms]]
name = "Exponential growth"
definition = "Growth pattern with increasing rate under abundant resources."

[[terms]]
name = "Logistic growth"
definition = "Growth that slows as population approaches carrying capacity."

[[terms]]
name = "Carrying capacity"
definition = "Approximate environment-supported population size."

[[terms]]
name = "Density-dependent factor"
definition = "Limiting factor whose impact changes with crowding."

[[terms]]
name = "Density-independent factor"
definition = "Limiting factor not directly tied to density."

[[terms]]
name = "Trophic level"
definition = "Feeding position in an energy pathway."

[[terms]]
name = "Decomposer"
definition = "Organism that breaks down dead material and recycles nutrients."

[[practice_quiz]]
question = "Logistic growth differs from exponential growth because logistic growth:"
options = ["never slows down", "has no limits of any kind", "levels off as the population nears carrying capacity", "can only ever decrease"]
answer = "C"
explanation = "Logistic growth slows as limited resources bring the population toward carrying capacity. Exponential growth assumes unlimited resources."

[[practice_quiz]]
question = "A contagious disease that spreads faster when a population is crowded is an example of a:"
options = ["density-dependent factor", "density-independent factor", "trophic level", "decomposer"]
answer = "A"
explanation = "Density-dependent factors such as disease and competition grow stronger with crowding. Density-independent factors, like a flood, do not depend on density."

[[practice_quiz]]
question = "About how much of the energy at one trophic level typically passes to the next level up?"
options = ["100 percent", "90 percent", "50 percent", "about 10 percent"]
answer = "D"
explanation = "Roughly 10 percent of energy transfers to the next level. The rest is lost mostly as heat, which limits how long food chains can be."

[[practice_quiz]]
question = "Energy and matter behave differently in an ecosystem because:"
options = ["both are perfectly recycled forever", "matter cycles, but energy flows through and must keep entering", "neither one moves", "energy is recycled but matter is not"]
answer = "B"
explanation = "Nutrients cycle within an ecosystem, but energy is lost at each transfer, so it must be continually supplied, for example by sunlight."

