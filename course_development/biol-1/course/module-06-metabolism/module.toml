[module]
number = 6
slug = "module-06-metabolism"
title = "Metabolism"
lab = "lab-06_metabolism.md"
topics = ["Energy and thermodynamics", "ATP as cellular coupling", "Enzymes and activation energy", "Regulation by conditions and inhibitors", "Photosynthesis and respiration as linked pathways"]
contents = ["Cells transform energy while obeying thermodynamic constraints.", "ATP couples energy-releasing reactions to energy-requiring cellular work.", "Enzymes lower activation energy without being consumed.", "Temperature, pH, substrate concentration, and inhibitors alter enzyme function.", "Photosynthesis builds sugar while respiration breaks fuel down to harvest usable energy."]
learning_objectives = ["Apply thermodynamic ideas to living cells.", "Explain ATP as an energy-coupling molecule.", "Describe how enzymes change reaction rates.", "Predict how environmental conditions affect enzyme activity.", "Connect photosynthesis and cellular respiration in matter and energy flow."]
study_tips = ["Start with the module's central claim before memorizing vocabulary.", "Use the same-numbered lab as the evidence check for the module.", "Explain one mechanism in words, then redraw it as a simple diagram.", "Answer retrieval questions without notes, then revise with the terms list."]
learning_questions = ["How do the laws of thermodynamics constrain cells?", "Why is ATP useful for cellular work?", "How do enzymes lower activation energy?", "Why does enzyme shape matter?", "How can temperature or pH change enzyme function?", "What is the difference between competitive and noncompetitive inhibition?", "How are photosynthesis and respiration related?", "Where does matter move in the photosynthesis-respiration cycle?", "Where does energy enter and leave biological systems?", "What evidence would show that an enzyme is denatured?"]

[[terms]]
name = "Metabolism"
definition = "All chemical reactions in a cell or organism."

[[terms]]
name = "ATP"
definition = "Cellular energy-coupling molecule."

[[terms]]
name = "Activation energy"
definition = "Energy required to start a reaction."

[[terms]]
name = "Enzyme"
definition = "Protein or RNA catalyst that speeds a reaction."

[[terms]]
name = "Substrate"
definition = "Reactant that binds an enzyme active site."

[[terms]]
name = "Denaturation"
definition = "Loss of shape that disrupts function."

[[terms]]
name = "Photosynthesis"
definition = "Process that uses light energy to build sugars."

[[terms]]
name = "Cellular respiration"
definition = "Process that harvests usable energy from fuel molecules."

[[practice_quiz]]
question = "Which statement best defines Metabolism in Module 06?"
options = ["All chemical reactions in a cell or organism.", "Cellular energy-coupling molecule.", "Energy required to start a reaction.", "Protein or RNA catalyst that speeds a reaction."]
answer = "A"
explanation = "Metabolism names the module's starting idea: energy and thermodynamics must be explained with evidence, not memorized alone."

[[practice_quiz]]
question = "Which learning goal best supports the topic \"ATP as cellular coupling\"?"
options = ["Apply thermodynamic ideas to living cells.", "Explain ATP as an energy-coupling molecule.", "Describe how enzymes change reaction rates.", "Predict how environmental conditions affect enzyme activity."]
answer = "B"
explanation = "This objective asks students to reason through atp as cellular coupling as part of the module's mechanism."

[[practice_quiz]]
question = "How should lab-06_metabolism.md support Module 06?"
options = ["By replacing evidence with vocabulary copying.", "By adding unrelated facts that do not test the module claim.", "By giving evidence for metabolism evidence from reaction rate and condition changes.", "By removing the need to compare observations or predictions."]
answer = "C"
explanation = "The lab is the evidence surface for energy transformations with ATP coupling, enzymes, and linked pathways."

[[practice_quiz]]
question = "Which retrieval move best prepares a student for Metabolism?"
options = ["Copy the term list once and stop.", "Skip mechanisms and memorize isolated examples.", "Read the quiz answers before attempting the questions.", "Answer: How do the laws of thermodynamics constrain cells? Then check the answer against terms, evidence, and lab-06_metabolism.md."]
answer = "D"
explanation = "Retrieval is strongest when students answer first, cite evidence, and revise the explanation after checking it."

