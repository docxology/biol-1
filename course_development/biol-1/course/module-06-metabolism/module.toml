options = ["Apply thermodynamic ideas to living cells.", "Explain ATP as an energy-coupling molecule.", "Describe how enzymes change reaction rates.", "Predict how environmental conditions affect enzyme activity."]
answer = "B"
explanation = "The correct option names the specific reasoning target for that partition."

[[practice_quiz]]
question = "How should Metabolism support this module?"
options = ["By replacing vocabulary study with unrelated directions.", "By adding a separate topic with no claim to test.", "By giving evidence for enzymes and activation energy.", "By removing the need to compare observations."]
answer = "C"
explanation = "The lab is the concrete evidence surface for the same-numbered module."

[[practice_quiz]]
