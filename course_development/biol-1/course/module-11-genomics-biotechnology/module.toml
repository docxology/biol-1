[module]
number = 11
slug = "module-11-genomics-biotechnology"
title = "Genomics and Biotechnology"
lab = "lab-11_genomics-biotechnology.md"
topics = ["Genomes as data", "PCR and amplification", "Gel electrophoresis and comparison", "Genetic engineering tools", "Biotechnology decisions and ethics"]
contents = ["A genome is the full DNA information set of an organism or sample.", "PCR amplifies chosen DNA regions so they can be analyzed.", "Gel electrophoresis separates DNA fragments by size.", "Biotechnology tools can copy, edit, compare, or move genetic information.", "Applications require evidence, risk reasoning, and ethical judgment."]
learning_objectives = ["Define genome and genomics.", "Explain why PCR amplification is useful.", "Interpret basic gel electrophoresis fragment patterns.", "Describe what genetic engineering tools can do.", "Evaluate biotechnology claims using evidence and ethical considerations."]
study_tips = ["Start with the module's central claim before memorizing vocabulary.", "Use the same-numbered lab as the evidence check for the module.", "Explain one mechanism in words, then redraw it as a simple diagram.", "Answer retrieval questions without notes, then revise with the terms list."]
learning_questions = ["What is a genome?", "Why does genomics require comparison?", "What does PCR amplify?", "Why are primers necessary?", "How does gel electrophoresis separate DNA fragments?", "Why do smaller fragments move farther in a gel?", "What can CRISPR do in general terms?", "How is a GMO defined in biotechnology?", "What evidence should support a biotechnology claim?", "What ethical questions can biotechnology raise?"]

[[terms]]
name = "Genome"
definition = "Complete DNA information of an organism or sample."

[[terms]]
name = "Genomics"
definition = "Study of whole genomes and their patterns."

[[terms]]
name = "PCR"
definition = "Technique for amplifying selected DNA sequences."

[[terms]]
name = "Primer"
definition = "Short DNA sequence that starts PCR copying."

[[terms]]
name = "Gel electrophoresis"
definition = "Method that separates DNA fragments by size."

[[terms]]
name = "CRISPR"
definition = "Gene-editing system adapted from bacterial defense."

[[terms]]
name = "GMO"
definition = "Organism with genetic material altered by biotechnology."

[[terms]]
name = "Bioethics"
definition = "Reasoning about benefits, harms, rights, and responsibilities in biology."

[[practice_quiz]]
question = "Which statement best defines Genome in Module 11?"
options = ["Complete DNA information of an organism or sample.", "Study of whole genomes and their patterns.", "Technique for amplifying selected DNA sequences.", "Short DNA sequence that starts PCR copying."]
answer = "A"
explanation = "Genome names the module's starting idea: genomes as data must be explained with evidence, not memorized alone."

[[practice_quiz]]
question = "Which learning goal best supports the topic \"PCR and amplification\"?"
options = ["Define genome and genomics.", "Explain why PCR amplification is useful.", "Interpret basic gel electrophoresis fragment patterns.", "Describe what genetic engineering tools can do."]
answer = "B"
explanation = "This objective asks students to reason through pcr and amplification as part of the module's mechanism."

[[practice_quiz]]
question = "How should lab-11_genomics-biotechnology.md support Module 11?"
options = ["By replacing evidence with vocabulary copying.", "By adding unrelated facts that do not test the module claim.", "By giving evidence for genomics and biotechnology evidence from DNA comparison tools.", "By removing the need to compare observations or predictions."]
answer = "C"
explanation = "The lab is the evidence surface for genomes as data interpreted through PCR, gels, tools, and ethical limits."

[[practice_quiz]]
question = "Which retrieval move best prepares a student for Genomics and Biotechnology?"
options = ["Copy the term list once and stop.", "Skip mechanisms and memorize isolated examples.", "Read the quiz answers before attempting the questions.", "Answer: What is a genome? Then check the answer against terms, evidence, and lab-11_genomics-biotechnology.md."]
answer = "D"
explanation = "Retrieval is strongest when students answer first, cite evidence, and revise the explanation after checking it."

