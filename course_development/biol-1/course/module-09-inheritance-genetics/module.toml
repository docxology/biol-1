[module]
number = 9
slug = "module-09-inheritance-genetics"
title = "Inheritance Genetics"
lab = "lab-09_inheritance-genetics.md"
topics = ["Alleles and genotype", "Mendelian patterns", "Punnett-square prediction", "Beyond simple dominance", "Pedigrees and probability"]
contents = ["Alleles are gene variants that contribute to genotype and phenotype.", "Mendelian inheritance predicts patterns when alleles segregate into gametes.", "Punnett squares model probability, not guaranteed outcomes.", "Incomplete dominance, codominance, polygenic traits, and environment complicate simple patterns.", "Pedigrees use family evidence to infer inheritance patterns."]
learning_objectives = ["Distinguish gene, allele, genotype, and phenotype.", "Use segregation to explain monohybrid inheritance.", "Build and interpret Punnett-square probabilities.", "Recognize inheritance patterns beyond complete dominance.", "Use pedigree evidence to reason about traits."]
study_tips = ["Start with the module's central claim before memorizing vocabulary.", "Use the same-numbered lab as the evidence check for the module.", "Explain one mechanism in words, then redraw it as a simple diagram.", "Answer retrieval questions without notes, then revise with the terms list."]
learning_questions = ["How are genes and alleles related?", "How do genotype and phenotype differ?", "What does heterozygous mean?", "How does allele segregation explain a monohybrid cross?", "What does a Punnett square predict?", "Why are probabilities not guarantees?", "How do incomplete dominance and codominance differ?", "Why are many traits polygenic?", "How can environment influence phenotype?", "What evidence in a pedigree suggests recessive inheritance?"]

[[terms]]
name = "Gene"
definition = "DNA sequence contributing to a trait or functional product."

[[terms]]
name = "Allele"
definition = "Variant form of a gene."

[[terms]]
name = "Genotype"
definition = "Allele combination of an organism."

[[terms]]
name = "Phenotype"
definition = "Observable trait or characteristic."

[[terms]]
name = "Dominant"
definition = "Allele effect visible with one copy in simple dominance."

[[terms]]
name = "Recessive"
definition = "Allele effect masked by dominant allele in heterozygotes."

[[terms]]
name = "Punnett square"
definition = "Tool for modeling inheritance probabilities."

[[terms]]
name = "Pedigree"
definition = "Family diagram used to infer inheritance patterns."

[[practice_quiz]]
question = "An organism's genotype is its:"
options = ["set of observable physical traits", "surrounding environment", "combination of alleles", "total number of cells"]
answer = "C"
explanation = "Genotype is the combination of alleles an organism carries. Phenotype is the observable trait that results."

[[practice_quiz]]
question = "Two heterozygotes are crossed (Aa x Aa). What fraction of offspring are expected to show the recessive trait?"
options = ["1/4", "1/2", "3/4", "0"]
answer = "A"
explanation = "Aa x Aa gives a 1 AA : 2 Aa : 1 aa ratio. Only the aa offspring (1/4) show the recessive trait."

[[practice_quiz]]
question = "A heterozygote (Aa) shows the dominant trait because:"
options = ["it carries no recessive allele", "recessive alleles are destroyed", "both alleles are always expressed equally", "one dominant allele is enough to mask the recessive allele"]
answer = "D"
explanation = "In simple dominance, one dominant allele determines the phenotype. The recessive allele is present but masked."

[[practice_quiz]]
question = "What is a pedigree used for?"
options = ["measuring the size of a cell", "tracing how a trait passes through a family to infer its inheritance", "editing genes directly", "counting chromosomes in soil samples"]
answer = "B"
explanation = "A pedigree diagrams family relationships and phenotypes so you can reason about how a trait is inherited."

