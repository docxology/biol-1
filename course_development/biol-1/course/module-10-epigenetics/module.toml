[module]
number = 10
slug = "module-10-epigenetics"
title = "Epigenetics"
lab = "lab-10_epigenetics.md"
topics = ["Gene regulation as control", "DNA methylation", "Histone and chromatin change", "Environment and expression", "Epigenetics versus mutation"]
contents = ["Cells regulate which genes are active rather than using every gene equally.", "DNA methylation can reduce transcription without changing base sequence.", "Histone and chromatin changes alter access to DNA.", "Environmental conditions can influence gene expression patterns.", "Epigenetic change affects gene activity, while mutation changes DNA sequence."]
learning_objectives = ["Explain gene regulation as control of gene activity.", "Describe DNA methylation at an introductory level.", "Connect chromatin structure to gene accessibility.", "Give a careful example of environmental influence on expression.", "Distinguish epigenetic regulation from mutation."]
study_tips = ["Start with the module's central claim before memorizing vocabulary.", "Use the same-numbered lab as the evidence check for the module.", "Explain one mechanism in words, then redraw it as a simple diagram.", "Answer retrieval questions without notes, then revise with the terms list."]
learning_questions = ["Why do cells regulate genes?", "How can two cells with the same DNA act differently?", "What is DNA methylation?", "How can chromatin structure affect transcription?", "How is epigenetics different from mutation?", "What environmental factors can influence expression?", "Why should epigenetic claims be made carefully?", "How can gene regulation affect phenotype?", "What evidence would show expression changed without mutation?", "How does epigenetics connect molecular biology to traits?"]

[[terms]]
name = "Gene regulation"
definition = "Control of when and how strongly genes are used."

[[terms]]
name = "Epigenetics"
definition = "Heritable or persistent expression changes without DNA sequence change."

[[terms]]
name = "DNA methylation"
definition = "Chemical marking of DNA often associated with reduced transcription."

[[terms]]
name = "Histone"
definition = "Protein around which DNA is packaged."

[[terms]]
name = "Chromatin"
definition = "DNA-protein complex that can be open or compact."

[[terms]]
name = "Transcription factor"
definition = "Protein that helps control transcription."

[[terms]]
name = "Mutation"
definition = "Change in DNA sequence."

[[terms]]
name = "Expression"
definition = "Use of gene information to make RNA or protein."

[[practice_quiz]]
question = "Which statement best defines Gene regulation in Module 10?"
options = ["Control of when and how strongly genes are used.", "Heritable or persistent expression changes without DNA sequence change.", "Chemical marking of DNA often associated with reduced transcription.", "Protein around which DNA is packaged."]
answer = "A"
explanation = "Gene regulation names the module's starting idea: gene regulation as control must be explained with evidence, not memorized alone."

[[practice_quiz]]
question = "Which learning goal best supports the topic \"DNA methylation\"?"
options = ["Explain gene regulation as control of gene activity.", "Describe DNA methylation at an introductory level.", "Connect chromatin structure to gene accessibility.", "Give a careful example of environmental influence on expression."]
answer = "B"
explanation = "This objective asks students to reason through dna methylation as part of the module's mechanism."

[[practice_quiz]]
question = "How should lab-10_epigenetics.md support Module 10?"
options = ["By replacing evidence with vocabulary copying.", "By adding unrelated facts that do not test the module claim.", "By giving evidence for epigenetics evidence from expression without sequence change.", "By removing the need to compare observations or predictions."]
answer = "C"
explanation = "The lab is the evidence surface for gene regulation through chromatin, environment, and expression evidence."

[[practice_quiz]]
question = "Which retrieval move best prepares a student for Epigenetics?"
options = ["Copy the term list once and stop.", "Skip mechanisms and memorize isolated examples.", "Read the quiz answers before attempting the questions.", "Answer: Why do cells regulate genes? Then check the answer against terms, evidence, and lab-10_epigenetics.md."]
answer = "D"
explanation = "Retrieval is strongest when students answer first, cite evidence, and revise the explanation after checking it."

