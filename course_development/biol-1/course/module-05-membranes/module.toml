[module]
number = 5
slug = "module-05-membranes"
title = "Membranes"
lab = "lab-05_viewing-life.md"
topics = ["Phospholipid bilayer structure", "Selective permeability", "Passive transport", "Active transport", "Osmosis and cell environments"]
contents = ["The phospholipid bilayer forms a flexible boundary with hydrophilic and hydrophobic regions.", "Selective permeability controls which materials cross easily and which require help.", "Diffusion, osmosis, and facilitated diffusion move substances down gradients.", "Active transport uses energy to move substances against gradients.", "Tonicity predicts water movement and cell volume changes."]
learning_objectives = ["Describe how phospholipid structure creates a bilayer.", "Predict which molecules cross membranes easily.", "Compare passive and active transport.", "Use concentration gradients to explain movement across membranes.", "Predict osmosis outcomes in hypotonic, isotonic, and hypertonic conditions."]
study_tips = ["Start with the module's central claim before memorizing vocabulary.", "Use the same-numbered lab as the evidence check for the module.", "Explain one mechanism in words, then redraw it as a simple diagram.", "Answer retrieval questions without notes, then revise with the terms list."]
learning_questions = ["Why do phospholipids form bilayers in water?", "What does selective permeability mean?", "How does diffusion depend on concentration gradients?", "How is osmosis different from general diffusion?", "When does transport require a protein channel?", "Why does active transport require energy?", "What happens to an animal cell in a hypertonic solution?", "How do hypotonic and isotonic conditions differ?", "How can membrane structure affect cell survival?", "What evidence would show water moved across a membrane?"]

[[terms]]
name = "Phospholipid"
definition = "Molecule with a hydrophilic head and hydrophobic tails."

[[terms]]
name = "Bilayer"
definition = "Double layer of phospholipids forming a membrane."

[[terms]]
name = "Selective permeability"
definition = "Property of allowing some substances through more easily than others."

[[terms]]
name = "Diffusion"
definition = "Net movement from high to low concentration."

[[terms]]
name = "Osmosis"
definition = "Diffusion of water across a selectively permeable membrane."

[[terms]]
name = "Facilitated diffusion"
definition = "Passive transport through membrane proteins."

[[terms]]
name = "Active transport"
definition = "Energy-requiring movement against a gradient."

[[terms]]
name = "Tonicity"
definition = "Relative solute condition that predicts water movement."

[[practice_quiz]]
question = "Which statement best defines Phospholipid in Module 05?"
options = ["Molecule with a hydrophilic head and hydrophobic tails.", "Double layer of phospholipids forming a membrane.", "Property of allowing some substances through more easily than others.", "Net movement from high to low concentration."]
answer = "A"
explanation = "Phospholipid names the module's starting idea: phospholipid bilayer structure must be explained with evidence, not memorized alone."

[[practice_quiz]]
question = "Which learning goal best supports the topic \"Selective permeability\"?"
options = ["Describe how phospholipid structure creates a bilayer.", "Predict which molecules cross membranes easily.", "Compare passive and active transport.", "Use concentration gradients to explain movement across membranes."]
answer = "B"
explanation = "This objective asks students to reason through selective permeability as part of the module's mechanism."

[[practice_quiz]]
question = "How should lab-05_viewing-life.md support Module 05?"
options = ["By replacing evidence with vocabulary copying.", "By adding unrelated facts that do not test the module claim.", "By giving evidence for viewing life through structure, boundary, and environment evidence.", "By removing the need to compare observations or predictions."]
answer = "C"
explanation = "The lab is the evidence surface for membrane structure with gradients, transport, and cell survival predictions."

[[practice_quiz]]
question = "Which retrieval move best prepares a student for Membranes?"
options = ["Copy the term list once and stop.", "Skip mechanisms and memorize isolated examples.", "Read the quiz answers before attempting the questions.", "Answer: Why do phospholipids form bilayers in water? Then check the answer against terms, evidence, and lab-05_viewing-life.md."]
answer = "D"
explanation = "Retrieval is strongest when students answer first, cite evidence, and revise the explanation after checking it."

