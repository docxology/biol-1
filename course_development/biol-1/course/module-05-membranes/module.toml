options = ["Describe how phospholipid structure creates a bilayer.", "Predict which molecules cross membranes easily.", "Compare passive and active transport.", "Use concentration gradients to explain movement across membranes."]
answer = "B"
explanation = "The correct option names the specific reasoning target for that partition."

[[practice_quiz]]
question = "How should Viewing Life support this module?"
options = ["By replacing vocabulary study with unrelated directions.", "By adding a separate topic with no claim to test.", "By giving evidence for passive transport.", "By removing the need to compare observations."]
answer = "C"
explanation = "The lab is the concrete evidence surface for the same-numbered module."

[[practice_quiz]]
question = "Which retrieval move best prepares a student for Membranes?"
options = ["Copy the term list once and stop.", "Skip mechanisms and memorize isolated examples.", "Read the quiz answers before attempting the questions.", "Answer: Why do phospholipids form bilayers in water? Then justify the answer with evidence."]
