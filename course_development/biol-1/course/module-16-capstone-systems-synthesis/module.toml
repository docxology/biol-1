[module]
number = 16
slug = "module-16-capstone-systems-synthesis"
title = "Capstone Systems Synthesis"
lab = "lab-16_capstone-systems-synthesis.md"
topics = ["Biology across scales", "Mechanism chains", "Feedback and constraint", "Evidence from multiple modules", "Capstone explanation and revision"]
contents = ["Biological explanations become stronger when they connect molecules, cells, organisms, populations, and ecosystems.", "Mechanism chains show how one change can produce effects across scales.", "Feedback loops and constraints explain why biological systems do not change without limits.", "Evidence from labs, models, and observations must match the scale of the claim.", "Capstone reasoning combines concepts into a clear claim that can be tested and revised."]
learning_objectives = ["Connect concepts from at least three modules in one explanation.", "Trace a mechanism across biological scales.", "Identify feedback loops, constraints, and tradeoffs.", "Match evidence types to claims at different scales.", "Revise a systems explanation using new evidence."]
study_tips = ["Start with the module's central claim before memorizing vocabulary.", "Use the same-numbered lab as the evidence check for the module.", "Explain one mechanism in words, then redraw it as a simple diagram.", "Answer retrieval questions without notes, then revise with the terms list."]
learning_questions = ["How can a molecular change affect an ecosystem?", "Why does scale matter in biological explanation?", "What is a mechanism chain?", "How can feedback limit or amplify change?", "Why are tradeoffs common in biology?", "How do constraints shape biological systems?", "What evidence belongs at molecular, organismal, or ecosystem scale?", "How can a lab result support a capstone explanation?", "How should an explanation change when evidence conflicts?", "What makes a synthesis stronger than a list of facts?"]

[[terms]]
name = "System"
definition = "Interacting parts whose relationships shape outcomes."

[[terms]]
name = "Scale"
definition = "Level of biological organization."

[[terms]]
name = "Mechanism"
definition = "Causal process that explains how something happens."

[[terms]]
name = "Feedback loop"
definition = "Circular causal relationship that amplifies or reduces change."

[[terms]]
name = "Constraint"
definition = "Limit that shapes what a system can do."

[[terms]]
name = "Tradeoff"
definition = "Benefit in one function paired with cost elsewhere."

[[terms]]
name = "Synthesis"
definition = "Combining ideas into a coherent explanation."

[[terms]]
name = "Evidence chain"
definition = "Linked evidence supporting each step of a claim."

[[practice_quiz]]
question = "Which statement best defines System in Module 16?"
options = ["Interacting parts whose relationships shape outcomes.", "Level of biological organization.", "Causal process that explains how something happens.", "Circular causal relationship that amplifies or reduces change."]
answer = "A"
explanation = "System names the module's starting idea: biology across scales must be explained with evidence, not memorized alone."

[[practice_quiz]]
question = "Which learning goal best supports the topic \"Mechanism chains\"?"
options = ["Connect concepts from at least three modules in one explanation.", "Trace a mechanism across biological scales.", "Identify feedback loops, constraints, and tradeoffs.", "Match evidence types to claims at different scales."]
answer = "B"
explanation = "This objective asks students to reason through mechanism chains as part of the module's mechanism."

[[practice_quiz]]
question = "How should lab-16_capstone-systems-synthesis.md support Module 16?"
options = ["By replacing evidence with vocabulary copying.", "By adding unrelated facts that do not test the module claim.", "By giving evidence for capstone synthesis evidence from lab-to-course integration.", "By removing the need to compare observations or predictions."]
answer = "C"
explanation = "The lab is the evidence surface for cross-scale biological explanation through mechanisms, evidence chains, and revision."

[[practice_quiz]]
question = "Which retrieval move best prepares a student for Capstone Systems Synthesis?"
options = ["Copy the term list once and stop.", "Skip mechanisms and memorize isolated examples.", "Read the quiz answers before attempting the questions.", "Answer: How can a molecular change affect an ecosystem? Then check the answer against terms, evidence, and lab-16_capstone-systems-synthesis.md."]
answer = "D"
explanation = "Retrieval is strongest when students answer first, cite evidence, and revise the explanation after checking it."

