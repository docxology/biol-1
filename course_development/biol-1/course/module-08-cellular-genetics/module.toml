[module]
number = 8
slug = "module-08-cellular-genetics"
title = "Cellular Genetics"
lab = "lab-08_cellular-genetics.md"
topics = ["Chromosomes and cell cycle", "Mitosis for growth and repair", "Meiosis for gametes", "Variation from recombination and assortment", "Errors and genetic consequences"]
contents = ["Chromosomes organize DNA so cells can divide accurately.", "Mitosis produces genetically identical daughter cells for growth and repair.", "Meiosis produces haploid gametes for sexual reproduction.", "Crossing over and independent assortment create genetic variation.", "Nondisjunction and other errors can change chromosome number."]
learning_objectives = ["Relate chromosomes to DNA organization.", "Compare the purpose and products of mitosis and meiosis.", "Explain how meiosis reduces chromosome number.", "Describe how crossing over and independent assortment increase variation.", "Interpret chromosome number errors at an introductory level."]
study_tips = ["Start with the module's central claim before memorizing vocabulary.", "Use the same-numbered lab as the evidence check for the module.", "Explain one mechanism in words, then redraw it as a simple diagram.", "Answer retrieval questions without notes, then revise with the terms list."]
learning_questions = ["Why do cells package DNA into chromosomes?", "What is the purpose of mitosis?", "What is the purpose of meiosis?", "How do the products of mitosis and meiosis differ?", "Why must gametes be haploid?", "How does crossing over create variation?", "How does independent assortment create variation?", "What can happen if chromosomes fail to separate?", "How does cell division connect to inheritance?", "What evidence would distinguish mitosis from meiosis?"]

[[terms]]
name = "Chromosome"
definition = "DNA-protein structure carrying genes."

[[terms]]
name = "Cell cycle"
definition = "Ordered sequence of cell growth, DNA replication, and division."

[[terms]]
name = "Mitosis"
definition = "Nuclear division producing identical daughter nuclei."

[[terms]]
name = "Meiosis"
definition = "Division process producing haploid gametes."

[[terms]]
name = "Gamete"
definition = "Haploid reproductive cell."

[[terms]]
name = "Crossing over"
definition = "Exchange of DNA between homologous chromosomes."

[[terms]]
name = "Independent assortment"
definition = "Random orientation of chromosome pairs in meiosis."

[[terms]]
name = "Nondisjunction"
definition = "Failure of chromosomes to separate correctly."

[[practice_quiz]]
question = "Which statement best defines Chromosome in Module 08?"
options = ["DNA-protein structure carrying genes.", "Ordered sequence of cell growth, DNA replication, and division.", "Nuclear division producing identical daughter nuclei.", "Division process producing haploid gametes."]
answer = "A"
explanation = "Chromosome names the module's starting idea: chromosomes and cell cycle must be explained with evidence, not memorized alone."

[[practice_quiz]]
question = "Which learning goal best supports the topic \"Mitosis for growth and repair\"?"
options = ["Relate chromosomes to DNA organization.", "Compare the purpose and products of mitosis and meiosis.", "Explain how meiosis reduces chromosome number.", "Describe how crossing over and independent assortment increase variation."]
answer = "B"
explanation = "This objective asks students to reason through mitosis for growth and repair as part of the module's mechanism."

[[practice_quiz]]
question = "How should lab-08_cellular-genetics.md support Module 08?"
options = ["By replacing evidence with vocabulary copying.", "By adding unrelated facts that do not test the module claim.", "By giving evidence for cellular genetics evidence from chromosome models.", "By removing the need to compare observations or predictions."]
answer = "C"
explanation = "The lab is the evidence surface for chromosome behavior across mitosis, meiosis, variation, and errors."

[[practice_quiz]]
question = "Which retrieval move best prepares a student for Cellular Genetics?"
options = ["Copy the term list once and stop.", "Skip mechanisms and memorize isolated examples.", "Read the quiz answers before attempting the questions.", "Answer: Why do cells package DNA into chromosomes? Then check the answer against terms, evidence, and lab-08_cellular-genetics.md."]
answer = "D"
explanation = "Retrieval is strongest when students answer first, cite evidence, and revise the explanation after checking it."

