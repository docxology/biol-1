[module]
number = 2
slug = "module-02-basic-chemistry"
title = "Basic Chemistry"
lab = "lab-02_probability-statistics.md"
topics = ["Atoms and elements", "Bonding and molecular shape", "Water as a biological solvent", "pH and chemical balance", "Chemical reactions in cells"]
contents = ["Atoms form elements, and their electrons shape bonding behavior.", "Covalent, ionic, and hydrogen bonds create different molecular properties.", "Water polarity explains cohesion, temperature buffering, and dissolving ions or polar molecules.", "pH tracks hydrogen ion concentration and affects biological molecules.", "Cells depend on chemical reactions that rearrange matter without destroying atoms."]
learning_objectives = ["Use atomic structure to explain basic bonding patterns.", "Distinguish covalent, ionic, and hydrogen bonding in biological examples.", "Explain why water properties matter for cells and organisms.", "Interpret pH as a chemical condition that affects biology.", "Track atoms through a simple chemical reaction."]
study_tips = ["Start with the module's central claim before memorizing vocabulary.", "Use the same-numbered lab as the evidence check for the module.", "Explain one mechanism in words, then redraw it as a simple diagram.", "Answer retrieval questions without notes, then revise with the terms list."]
learning_questions = ["How do protons, neutrons, and electrons differ?", "Why do electrons matter for chemical bonding?", "What distinguishes covalent, ionic, and hydrogen bonds?", "Why does water dissolve salt but not all nonpolar molecules?", "How does polarity explain water cohesion?", "What does a low pH mean about hydrogen ions?", "Why are buffers important in living systems?", "How are atoms conserved during chemical reactions?", "How can chemical shape affect biological function?", "What evidence would show that a substance is acidic or basic?"]

[[terms]]
name = "Atom"
definition = "Smallest unit of an element that keeps that element identity."

[[terms]]
name = "Element"
definition = "Pure substance defined by proton number."

[[terms]]
name = "Covalent bond"
definition = "Bond formed when atoms share electrons."

[[terms]]
name = "Ionic bond"
definition = "Attraction between oppositely charged ions."

[[terms]]
name = "Hydrogen bond"
definition = "Weak attraction involving polar hydrogen and electronegative atoms."

[[terms]]
name = "Polarity"
definition = "Uneven charge distribution across a molecule."

[[terms]]
name = "pH"
definition = "Measure of hydrogen ion concentration."

[[terms]]
name = "Buffer"
definition = "Chemical system that resists pH change."

[[practice_quiz]]
question = "Which statement best defines Atom in Module 02?"
options = ["Smallest unit of an element that keeps that element identity.", "Pure substance defined by proton number.", "Bond formed when atoms share electrons.", "Attraction between oppositely charged ions."]
answer = "A"
explanation = "Atom names the module's starting idea: atoms and elements must be explained with evidence, not memorized alone."

[[practice_quiz]]
question = "Which learning goal best supports the topic \"Bonding and molecular shape\"?"
options = ["Use atomic structure to explain basic bonding patterns.", "Distinguish covalent, ionic, and hydrogen bonding in biological examples.", "Explain why water properties matter for cells and organisms.", "Interpret pH as a chemical condition that affects biology."]
answer = "B"
explanation = "This objective asks students to reason through bonding and molecular shape as part of the module's mechanism."

[[practice_quiz]]
question = "How should lab-02_probability-statistics.md support Module 02?"
options = ["By replacing evidence with vocabulary copying.", "By adding unrelated facts that do not test the module claim.", "By giving evidence for probability and statistics for chemical evidence claims.", "By removing the need to compare observations or predictions."]
answer = "C"
explanation = "The lab is the evidence surface for atomic structure with water, pH, and biological molecule behavior."

[[practice_quiz]]
question = "Which retrieval move best prepares a student for Basic Chemistry?"
options = ["Copy the term list once and stop.", "Skip mechanisms and memorize isolated examples.", "Read the quiz answers before attempting the questions.", "Answer: How do protons, neutrons, and electrons differ? Then check the answer against terms, evidence, and lab-02_probability-statistics.md."]
answer = "D"
explanation = "Retrieval is strongest when students answer first, cite evidence, and revise the explanation after checking it."

