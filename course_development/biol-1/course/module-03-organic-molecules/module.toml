[module]
number = 3
slug = "module-03-organic-molecules"
title = "Organic Molecules"
lab = "lab-03_microscopy.md"
topics = ["Carbon skeletons", "Building and breaking polymers", "Carbohydrates and lipids", "Proteins and shape", "Nucleic acids and information"]
contents = ["Carbon forms diverse skeletons that make biological molecules possible.", "Dehydration synthesis builds polymers, and hydrolysis breaks them down.", "Carbohydrates and lipids store energy and provide structure in different ways.", "Protein function depends on amino acid sequence and three-dimensional shape.", "DNA and RNA store and move information using nucleotide sequences."]
learning_objectives = ["Explain why carbon is central to biological molecule diversity.", "Distinguish monomers, polymers, dehydration synthesis, and hydrolysis.", "Compare the functions of carbohydrates and lipids.", "Connect protein shape to protein function and denaturation.", "Describe how nucleic acids encode biological information."]
study_tips = ["Start with the module's central claim before memorizing vocabulary.", "Use the same-numbered lab as the evidence check for the module.", "Explain one mechanism in words, then redraw it as a simple diagram.", "Answer retrieval questions without notes, then revise with the terms list."]
learning_questions = ["Why can carbon make many different biological molecules?", "How are dehydration synthesis and hydrolysis opposite processes?", "What distinguishes a monomer from a polymer?", "How do carbohydrates and lipids differ in structure and function?", "Why are phospholipids useful in membranes?", "How does amino acid order influence protein shape?", "What can denature a protein?", "How do DNA and RNA store information?", "How can a molecule be both structural and informational?", "Which evidence would show that a protein lost its function?"]

[[terms]]
name = "Organic molecule"
definition = "Carbon-based molecule associated with living systems."

[[terms]]
name = "Monomer"
definition = "Small building block that can join into a polymer."

[[terms]]
name = "Polymer"
definition = "Large molecule built from repeating subunits."

[[terms]]
name = "Carbohydrate"
definition = "Sugar or sugar polymer used for energy or structure."

[[terms]]
name = "Lipid"
definition = "Hydrophobic molecule including fats, phospholipids, and steroids."

[[terms]]
name = "Protein"
definition = "Polymer of amino acids that performs cellular work."

[[terms]]
name = "Nucleic acid"
definition = "DNA or RNA polymer made of nucleotides."

[[terms]]
name = "Denaturation"
definition = "Loss of protein shape that often destroys function."

[[practice_quiz]]
question = "Which statement best defines Organic molecule in Module 03?"
options = ["Carbon-based molecule associated with living systems.", "Small building block that can join into a polymer.", "Large molecule built from repeating subunits.", "Sugar or sugar polymer used for energy or structure."]
answer = "A"
explanation = "Organic molecule names the module's starting idea: carbon skeletons must be explained with evidence, not memorized alone."

[[practice_quiz]]
question = "Which learning goal best supports the topic \"Building and breaking polymers\"?"
options = ["Explain why carbon is central to biological molecule diversity.", "Distinguish monomers, polymers, dehydration synthesis, and hydrolysis.", "Compare the functions of carbohydrates and lipids.", "Connect protein shape to protein function and denaturation."]
answer = "B"
explanation = "This objective asks students to reason through building and breaking polymers as part of the module's mechanism."

[[practice_quiz]]
question = "How should lab-03_microscopy.md support Module 03?"
options = ["By replacing evidence with vocabulary copying.", "By adding unrelated facts that do not test the module claim.", "By giving evidence for microscopy evidence for biological structure.", "By removing the need to compare observations or predictions."]
answer = "C"
explanation = "The lab is the evidence surface for carbon chemistry with polymer assembly and biological molecule evidence."

[[practice_quiz]]
question = "Which retrieval move best prepares a student for Organic Molecules?"
options = ["Copy the term list once and stop.", "Skip mechanisms and memorize isolated examples.", "Read the quiz answers before attempting the questions.", "Answer: Why can carbon make many different biological molecules? Then check the answer against terms, evidence, and lab-03_microscopy.md."]
answer = "D"
explanation = "Retrieval is strongest when students answer first, cite evidence, and revise the explanation after checking it."

