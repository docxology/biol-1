<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Module 03: Organic Molecules Retrieval Card</title>
  <desc id="desc">Retrieval card for Module 3: Organic Molecules.</desc>
  <style>
