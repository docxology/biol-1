  <text x="82" y="92" class="eyebrow">Module 03 / Retrieval Card</text>
  <text x="82" y="142" class="title-text">Module 03: Organic Molecules Retrieval Card</text>
  <rect x="92" y="190" width="462" height="132" rx="26" class="prompt-card" /><text x="120" y="228" class="stage-num">Q1</text><text x="120.0" y="256.0" class="prompt-text"><tspan x="120.0" dy="0">Why can carbon make many different biological</tspan><tspan x="120.0" dy="17">molecules?</tspan></text><text x="120.0" y="302.0" class="check-text"><tspan x="120.0" dy="0">Check: Explain why carbon is central to biological...</tspan></text><rect x="604" y="190" width="462" height="132" rx="26" class="prompt-card" /><text x="632" y="228" class="stage-num">Q2</text><text x="632.0" y="256.0" class="prompt-text"><tspan x="632.0" dy="0">How are dehydration synthesis and hydrolysis</tspan><tspan x="632.0" dy="17">opposite processes?</tspan></text><text x="632.0" y="302.0" class="check-text"><tspan x="632.0" dy="0">Check: Distinguish monomers, polymers, dehydration...</tspan></text><rect x="92" y="360" width="462" height="132" rx="26" class="prompt-card" /><text x="120" y="398" class="stage-num">Q3</text><text x="120.0" y="426.0" class="prompt-text"><tspan x="120.0" dy="0">What distinguishes a monomer from a polymer?</tspan></text><text x="120.0" y="472.0" class="check-text"><tspan x="120.0" dy="0">Check: Compare the functions of carbohydrates and...</tspan></text><rect x="604" y="360" width="462" height="132" rx="26" class="prompt-card" /><text x="632" y="398" class="stage-num">Q4</text><text x="632.0" y="426.0" class="prompt-text"><tspan x="632.0" dy="0">How do carbohydrates and lipids differ in</tspan><tspan x="632.0" dy="17">structure and function?</tspan></text><text x="632.0" y="472.0" class="check-text"><tspan x="632.0" dy="0">Check: Connect protein shape to protein function and...</tspan></text>
  <rect x="92" y="548" width="462" height="86" rx="24" class="side-card" />
  <text x="120" y="582" class="card-kicker">Terms to use</text>
  <text x="120.0" y="612.0" class="mini-text"><tspan x="120.0" dy="0">Organic molecule, Monomer, Polymer, Carbohydrate,</tspan><tspan x="120.0" dy="17">Lipid</tspan></text>
  <rect x="604" y="548" width="504" height="86" rx="24" class="side-card" />
  <text x="632" y="582" class="card-kicker">Lab connection</text>
  <text x="632.0" y="612.0" class="mini-text"><tspan x="632.0" dy="0">Microscopy gives concrete evidence for Module 03: Organic</tspan><tspan x="632.0" dy="17">Molecules.</tspan></text>
  <text x="82" y="672" class="footer">Cover notes, answer aloud, check evidence, then revise.</text>
</svg>
