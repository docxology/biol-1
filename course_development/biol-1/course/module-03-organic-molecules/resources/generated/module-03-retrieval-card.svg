    .edge { stroke: #7b4f9d; stroke-width: 4; stroke-linecap: round; opacity: 0.72; }
    .edge-label { fill: #7b4f9d; font: 700 13px Georgia, serif; text-anchor: middle; paint-order: stroke; stroke: #f2edf7; stroke-width: 4; }
    .stage { fill: #fffafd; stroke: #7b4f9d; stroke-width: 5; filter: url(#shadow); }
    .stage-num { fill: #b36b2c; font: 900 18px Georgia, serif; }
    .stage-label { fill: #281d34; font: 800 18px Georgia, serif; }
    .stage-detail, .mini-text, .check-text { fill: #685d72; font: 15px Georgia, serif; }
    .arrow { fill: none; stroke: #b36b2c; stroke-width: 5; stroke-linecap: round; marker-end: url(#arrowhead); }
    .prompt-text { fill: #281d34; font: 700 17px Georgia, serif; }
    .palette-high-design { fill: #7b4f9d; }
    @media print { .claim-card, .side-card, .feedback-card, .prompt-card, .node, .stage { filter: none; } }
    </style>
