  <text x="82" y="92" class="eyebrow">Module 01 / Retrieval Card</text>
  <text x="82" y="142" class="title-text">Module 01: Biology - The Study of Life Retrieval and Lab Check</text>
  <rect x="92" y="190" width="462" height="132" rx="26" class="prompt-card" /><text x="120" y="228" class="stage-num">Q1</text><text x="120.0" y="256.0" class="prompt-text"><tspan x="120.0" dy="0">Which characteristics together make something</tspan><tspan x="120.0" dy="17">count as alive?</tspan></text><text x="120.0" y="302.0" class="check-text"><tspan x="120.0" dy="0">Check: Distinguish living systems from nonliving...</tspan></text><rect x="604" y="190" width="462" height="132" rx="26" class="prompt-card" /><text x="632" y="228" class="stage-num">Q2</text><text x="632.0" y="256.0" class="prompt-text"><tspan x="632.0" dy="0">How is a hypothesis different from a</tspan><tspan x="632.0" dy="17">prediction?</tspan></text><text x="632.0" y="302.0" class="check-text"><tspan x="632.0" dy="0">Check: Separate hypotheses, predictions...</tspan></text><rect x="92" y="360" width="462" height="132" rx="26" class="prompt-card" /><text x="120" y="398" class="stage-num">Q3</text><text x="120.0" y="426.0" class="prompt-text"><tspan x="120.0" dy="0">What variable is changed, measured, or</tspan><tspan x="120.0" dy="17">controlled in a simple test?</tspan></text><text x="120.0" y="472.0" class="check-text"><tspan x="120.0" dy="0">Check: Place biological examples at the correct...</tspan></text><rect x="604" y="360" width="462" height="132" rx="26" class="prompt-card" /><text x="632" y="398" class="stage-num">Q4</text><text x="632.0" y="426.0" class="prompt-text"><tspan x="632.0" dy="0">Why does biology need both observation and</tspan><tspan x="632.0" dy="17">experiment?</tspan></text><text x="632.0" y="472.0" class="check-text"><tspan x="632.0" dy="0">Check: Identify variables and evidence in a simple...</tspan></text>
  <rect x="92" y="548" width="462" height="86" rx="24" class="side-card" />
  <text x="120" y="582" class="card-kicker">Terms to use</text>
  <text x="120.0" y="612.0" class="mini-text"><tspan x="120.0" dy="0">Cell, Homeostasis, Metabolism, Hypothesis, Variable</tspan></text>
  <rect x="604" y="548" width="504" height="86" rx="24" class="side-card" />
  <text x="632" y="582" class="card-kicker">Lab connection</text>
  <text x="632.0" y="612.0" class="mini-text"><tspan x="632.0" dy="0">lab-01_measurement-methods.md supplies evidence for</tspan><tspan x="632.0" dy="17">measurement choices and sources of error.</tspan></text>
  <text x="82" y="672" class="footer">Cover notes, answer aloud, check evidence, then revise.</text>
</svg>
