<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Module 01: Biology - The Study of Life Retrieval and Lab Check">
  <title>Module 01: Biology - The Study of Life Retrieval and Lab Check</title>
  <desc>Retrieval card for Module 1: Biology - The Study of Life.</desc>
  <style>
