    .title-text { fill: #1f2a24; font: 800 38px Georgia, serif; }
    .footer { fill: #59685f; font: 16px Georgia, serif; }
    .claim-card, .side-card, .feedback-card, .prompt-card { fill: #fffaf0; stroke: #1f2a24; stroke-width: 2.5; filter: url(#shadow); }
    .claim-kicker, .card-kicker { fill: #c45f35; font: 800 17px Georgia, serif; letter-spacing: 0.8px; text-transform: uppercase; }
    .claim-text { fill: #1f2a24; font: 700 25px Georgia, serif; }
    .node { fill: #fffaf0; stroke: #245f73; stroke-width: 3; filter: url(#shadow); }
    .node-label { fill: #1f2a24; font: 800 20px Georgia, serif; }
    .node-detail { fill: #59685f; font: 14px Georgia, serif; }
    .edge { stroke: #c45f35; stroke-width: 4; stroke-linecap: round; opacity: 0.72; }
    .edge-label { fill: #c45f35; font: 700 13px Georgia, serif; text-anchor: middle; paint-order: stroke; stroke: #f7efe2; stroke-width: 4; }
    .stage { fill: #fffaf0; stroke: #c45f35; stroke-width: 5; filter: url(#shadow); }
    .stage-num { fill: #245f73; font: 900 18px Georgia, serif; }
    .stage-label { fill: #1f2a24; font: 800 18px Georgia, serif; }
    .stage-detail, .mini-text, .check-text { fill: #59685f; font: 15px Georgia, serif; }
    .arrow { fill: none; stroke: #245f73; stroke-width: 5; stroke-linecap: round; marker-end: url(#arrowhead); }
    .prompt-text { fill: #1f2a24; font: 700 17px Georgia, serif; }
    .palette-high-design { fill: #c45f35; }
    @media print { .claim-card, .side-card, .feedback-card, .prompt-card, .node, .stage { filter: none; } }
    </style>
