[module]
number = 1
slug = "module-01-study-of-life"
title = "Biology - The Study of Life"
lab = "lab-01_measurement-methods.md"
topics = ["What counts as life", "Science as a way of testing", "Organization from cells to ecosystems", "Evidence, variables, and measurement", "How biological explanations improve"]
contents = ["Life is recognized by shared properties: cells, energy use, response, reproduction, regulation, and evolution.", "Scientific claims are tested with observations, comparisons, variables, and repeatable reasoning.", "Biological systems are organized across scales from molecules to biosphere.", "Data become useful when measurements are tied to a clear question and source of error.", "Strong explanations connect evidence to a claim and stay open to revision."]
learning_objectives = ["Distinguish living systems from nonliving examples using multiple characteristics.", "Separate hypotheses, predictions, observations, and conclusions in a scientific test.", "Place biological examples at the correct scale of organization.", "Identify variables and evidence in a simple investigation.", "Revise a biological explanation when new evidence appears."]
study_tips = ["Start with the module's central claim before memorizing vocabulary.", "Use the same-numbered lab as the evidence check for the module.", "Explain one mechanism in words, then redraw it as a simple diagram.", "Answer retrieval questions without notes, then revise with the terms list."]
learning_questions = ["Which characteristics together make something count as alive?", "How is a hypothesis different from a prediction?", "What variable is changed, measured, or controlled in a simple test?", "Why does biology need both observation and experiment?", "How do cells, organisms, populations, and ecosystems differ as scales?", "What kind of evidence would challenge a claim about life?", "Why is a scientific theory stronger than a guess?", "How can measurement error change an interpretation?", "What makes an explanation biological rather than just descriptive?", "How should a claim change when new evidence appears?"]

[[terms]]
name = "Cell"
definition = "Basic unit of life bounded by a membrane."

[[terms]]
name = "Homeostasis"
definition = "Regulation that keeps internal conditions within a workable range."

[[terms]]
name = "Metabolism"
definition = "All chemical reactions that move matter and energy through life."

[[terms]]
name = "Hypothesis"
definition = "Testable explanation for an observed pattern."

[[terms]]
name = "Variable"
definition = "Factor that can change in an investigation."

[[terms]]
name = "Evidence"
definition = "Observation or measurement used to support or challenge a claim."

[[terms]]
name = "Theory"
definition = "Broad explanation supported by many lines of evidence."

[[terms]]
name = "Evolution"
definition = "Change in heritable traits of populations across generations."

[[practice_quiz]]
question = "Which statement best defines Cell in Module 01?"
options = ["Basic unit of life bounded by a membrane.", "Regulation that keeps internal conditions within a workable range.", "All chemical reactions that move matter and energy through life.", "Testable explanation for an observed pattern."]
answer = "A"
explanation = "Cell names the module's starting idea: what counts as life must be explained with evidence, not memorized alone."

[[practice_quiz]]
question = "Which learning goal best supports the topic \"Science as a way of testing\"?"
options = ["Distinguish living systems from nonliving examples using multiple characteristics.", "Separate hypotheses, predictions, observations, and conclusions in a scientific test.", "Place biological examples at the correct scale of organization.", "Identify variables and evidence in a simple investigation."]
answer = "B"
explanation = "This objective asks students to reason through science as a way of testing as part of the module's mechanism."

[[practice_quiz]]
question = "How should lab-01_measurement-methods.md support Module 01?"
options = ["By replacing evidence with vocabulary copying.", "By adding unrelated facts that do not test the module claim.", "By giving evidence for measurement choices and sources of error.", "By removing the need to compare observations or predictions."]
answer = "C"
explanation = "The lab is the evidence surface for life criteria with measurement-based scientific explanation."

[[practice_quiz]]
question = "Which retrieval move best prepares a student for Biology - The Study of Life?"
options = ["Copy the term list once and stop.", "Skip mechanisms and memorize isolated examples.", "Read the quiz answers before attempting the questions.", "Answer: Which characteristics together make something count as alive? Then check the answer against terms, evidence, and lab-01_measurement-methods.md."]
answer = "D"
explanation = "Retrieval is strongest when students answer first, cite evidence, and revise the explanation after checking it."

