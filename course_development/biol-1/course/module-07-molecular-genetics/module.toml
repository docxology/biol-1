[module]
number = 7
slug = "module-07-molecular-genetics"
title = "Molecular Genetics"
lab = "lab-07_molecular-genetics.md"
topics = ["DNA structure", "Replication", "Transcription", "Translation", "Mutation and gene expression evidence"]
contents = ["DNA stores information in nucleotide sequences and complementary base pairing.", "Replication copies DNA using each strand as a template.", "Transcription produces RNA from a DNA gene.", "Translation uses mRNA codons and ribosomes to build proteins.", "Mutations and expression patterns connect molecular changes to traits."]
learning_objectives = ["Describe DNA structure and base-pairing rules.", "Explain why DNA replication is semiconservative.", "Compare transcription and translation.", "Use codons to connect mRNA sequence to amino acid sequence.", "Explain how mutation can alter protein and trait outcomes."]
study_tips = ["Start with the module's central claim before memorizing vocabulary.", "Use the same-numbered lab as the evidence check for the module.", "Explain one mechanism in words, then redraw it as a simple diagram.", "Answer retrieval questions without notes, then revise with the terms list."]
learning_questions = ["How does DNA structure store information?", "Why does complementary base pairing matter?", "What does semiconservative replication mean?", "How is transcription different from translation?", "What does a codon specify?", "How do ribosomes participate in protein synthesis?", "How can a mutation change a protein?", "Why do some mutations have no visible effect?", "How does gene expression connect genotype to phenotype?", "What evidence would show that a gene is being expressed?"]

[[terms]]
name = "DNA"
definition = "Nucleic acid that stores hereditary information."

[[terms]]
name = "Nucleotide"
definition = "DNA or RNA subunit with sugar, phosphate, and base."

[[terms]]
name = "Replication"
definition = "Process that copies DNA."

[[terms]]
name = "Transcription"
definition = "Synthesis of RNA from a DNA template."

[[terms]]
name = "Translation"
definition = "Synthesis of protein from mRNA codons."

[[terms]]
name = "Codon"
definition = "Three-base mRNA sequence read during translation."

[[terms]]
name = "Mutation"
definition = "Change in DNA sequence."

[[terms]]
name = "Gene expression"
definition = "Use of genetic information to make RNA or protein."

[[practice_quiz]]
question = "In DNA, the base adenine always pairs with:"
options = ["cytosine", "guanine", "thymine", "another adenine"]
answer = "C"
explanation = "The base-pairing rules are A with T and C with G. This complementarity lets DNA be copied accurately."

[[practice_quiz]]
question = "DNA replication is described as \"semiconservative\" because each new double helix contains:"
options = ["one original strand and one new strand", "two brand-new strands", "two original strands", "no strands at all"]
answer = "A"
explanation = "Each daughter molecule keeps one parental strand as a template, so half of the original is conserved."

[[practice_quiz]]
question = "Which sequence shows the normal flow of genetic information?"
options = ["protein, then RNA, then DNA", "RNA, then DNA, then protein", "protein, then DNA, then RNA", "DNA, then RNA, then protein"]
answer = "D"
explanation = "Transcription copies DNA into RNA, and translation reads codons to build protein: DNA to RNA to protein."

[[practice_quiz]]
question = "A mutation changes a single DNA base. Why might this matter?"
options = ["DNA cannot change, so nothing happens.", "It can change a codon, which may change an amino acid and the protein.", "It always improves the organism.", "It affects only RNA and never proteins."]
answer = "B"
explanation = "A base change can alter a codon and therefore the protein. Effects range from none to significant."

