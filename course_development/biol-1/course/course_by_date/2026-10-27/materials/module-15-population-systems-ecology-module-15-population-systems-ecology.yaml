  - id: "module-15-population-systems-ecology_title"
    narration: "Welcome to BIOL-1 General Biology at College of the Redwoods, Pelican Bay. Module 15: Population and Systems Ecology. The connected lab is Lab 15 Population Systems Ecology. Here is the central idea: Population and Systems Ecology explains population systems governed by growth, limits, interactions, energy, and feedback. Let us begin."
    visual:
      kind: title
      title: "Module 15: Population and Systems Ecology"
      subtitle: "BIOL-1 General Biology  |  Lab: Lab 15 Population Systems Ecology"

  - id: "module-15-population-systems-ecology_objectives"
    narration: "By the end of this module you should be able to: Compare exponential and logistic population growth; Explain carrying capacity and limiting factors; Distinguish density-dependent and density-independent regulation; Use trophic levels and the 10 percent rule to explain energy limits; Contrast energy flow with nutrient cycling. Keep these objectives in mind as you work through the material."
    visual:
      kind: objectives
      title: "Learning Objectives"
      bullets:
        - "Compare exponential and logistic population growth."
        - "Explain carrying capacity and limiting factors."
        - "Distinguish density-dependent and density-independent regulation."
        - "Use trophic levels and the 10 percent rule to explain energy limits."
        - "Contrast energy flow with nutrient cycling."

  - id: "module-15-population-systems-ecology_topics"
    narration: "This module covers 5 topics. Population growth models — Population size changes through births, deaths, immigration, and emigration. Limits and carrying capacity — Exponential growth describes rapid increase; logistic growth includes carrying capacity. Community interactions — Density-dependent and density-independent factors limit populations differently. Energy flow through trophic levels — Energy flows through producers, consumers, and decomposers with loss at transfers. Matter cycling and systems feedback — Matter cycles through ecosystems while energy must continually enter. Each topic builds on the one before it, forming a coherent explanation."
    visual:
      kind: bullets
      title: "Topic Sequence"
      bullets:
        - "Population growth models"
        - "Limits and carrying capacity"
        - "Community interactions"
        - "Energy flow through trophic levels"
        - "Matter cycling and systems feedback"

  - id: "module-15-population-systems-ecology_concept_map"
    narration: "Here is the concept map for module 15. The central claim is: Population and Systems Ecology explains population systems governed by growth, limits, interactions, energy, and feedback. Notice how each node connects to the others. This is the structure of biological reasoning — not a list to memorize, but a map of how ideas support each other."
    visual:
      kind: image
      title: "Concept Map"
      subtitle: "How the ideas connect"
      image_path: "png/module-15-concept-map.png"

  - id: "module-15-population-systems-ecology_process_model"
    narration: "This process model shows the reasoning sequence for population and systems ecology. Follow the stages from inputs to outputs. The Lab 15 Population Systems Ecology lab gives you evidence to test each stage. At each transition, ask: what would change my mind about this step?"
    visual:
      kind: image
      title: "Process Model"
      subtitle: "Reasoning sequence"
      image_path: "png/module-15-process-model.png"

  - id: "module-15-population-systems-ecology_application"
    narration: "Now apply the module instead of only repeating its vocabulary. Start with a question: What changes population size? Treat that question as an observation that needs an explanation. A useful first claim is: Population size changes through births, deaths, immigration, and emigration. Then ask what evidence could support or challenge it. The first practice check reminds us that Logistic growth slows as limited resources bring the population toward carrying capacity. Exponential growth assumes unlimited resources. This claim, evidence, and revision cycle is the transferable skill for the module."
    visual:
      kind: bullets
      title: "Apply the Idea"
      bullets:
        - "Observation: What changes population size?"
        - "Claim: Population size changes through births, deaths, immigration, and emigration."
        - "Evidence check: Logistic growth slows as limited resources bring the population toward carrying capacity. Exponential growth assumes unlimited resources."
        - "Revision: if the evidence contradicts the claim, name the biological mechanism that must change."

  - id: "module-15-population-systems-ecology_terms_01"
    narration: "Key terms for this module (page 1 of 3) include Population, Exponential growth, Logistic growth. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (1/3)"
      bullets:
        - "Population: Members of one species in an area."
        - "Exponential growth: Growth pattern with increasing rate under abundant resources."
        - "Logistic growth: Growth that slows as population approaches carrying capacity."

  - id: "module-15-population-systems-ecology_terms_02"
    narration: "Key terms for this module (page 2 of 3) include Carrying capacity, Density-dependent factor, Density-independent factor. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (2/3)"
      bullets:
        - "Carrying capacity: Approximate environment-supported population size."
        - "Density-dependent factor: Limiting factor whose impact changes with crowding."
        - "Density-independent factor: Limiting factor not directly tied to density."

  - id: "module-15-population-systems-ecology_terms_03"
    narration: "Key terms for this module (page 3 of 3) include Trophic level, Decomposer. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (3/3)"
      bullets:
        - "Trophic level: Feeding position in an energy pathway."
        - "Decomposer: Organism that breaks down dead material and recycles nutrients."

