  - id: "module-01-study-of-life_title"
    narration: "Welcome to BIOL-1 General Biology at College of the Redwoods, Pelican Bay. Module 01: Biology - The Study of Life. The connected lab is Lab 01 Measurement Methods. Here is the central idea: Biology - The Study of Life explains life criteria with measurement-based scientific explanation. Let us begin."
    visual:
      kind: title
      title: "Module 01: Biology - The Study of Life"
      subtitle: "BIOL-1 General Biology  |  Lab: Lab 01 Measurement Methods"

  - id: "module-01-study-of-life_objectives"
    narration: "By the end of this module you should be able to: Distinguish living systems from nonliving examples using multiple characteristics; Separate hypotheses, predictions, observations, and conclusions in a scientific test; Place biological examples at the correct scale of organization; Identify variables and evidence in a simple investigation; Revise a biological explanation when new evidence appears. Keep these objectives in mind as you work through the material."
    visual:
      kind: objectives
      title: "Learning Objectives"
      bullets:
        - "Distinguish living systems from nonliving examples using multiple characteristics."
        - "Separate hypotheses, predictions, observations, and conclusions in a scientific test."
        - "Place biological examples at the correct scale of organization."
        - "Identify variables and evidence in a simple investigation."
        - "Revise a biological explanation when new evidence appears."

  - id: "module-01-study-of-life_topics"
    narration: "This module covers 5 topics. What counts as life — Life is recognized by shared properties: cells, energy use, response, reproduction, regulation, and evolution. Science as a way of testing — Scientific claims are tested with observations, comparisons, variables, and repeatable reasoning. Organization from cells to ecosystems — Biological systems are organized across scales from molecules to biosphere. Evidence, variables, and measurement — Data become useful when measurements are tied to a clear question and source of error. How biological explanations improve — Strong explanations connect evidence to a claim and stay open to revision. Each topic builds on the one before it, forming a coherent explanation."
    visual:
      kind: bullets
      title: "Topic Sequence"
      bullets:
        - "What counts as life"
        - "Science as a way of testing"
        - "Organization from cells to ecosystems"
        - "Evidence, variables, and measurement"
        - "How biological explanations improve"

  - id: "module-01-study-of-life_concept_map"
    narration: "Here is the concept map for module 01. The central claim is: Biology - The Study of Life explains life criteria with measurement-based scientific explanation. Notice how each node connects to the others. This is the structure of biological reasoning — not a list to memorize, but a map of how ideas support each other."
    visual:
      kind: image
      title: "Concept Map"
      subtitle: "How the ideas connect"
      image_path: "png/module-01-concept-map.png"

  - id: "module-01-study-of-life_process_model"
    narration: "This process model shows the reasoning sequence for biology - the study of life. Follow the stages from inputs to outputs. The Lab 01 Measurement Methods lab gives you evidence to test each stage. At each transition, ask: what would change my mind about this step?"
    visual:
      kind: image
      title: "Process Model"
      subtitle: "Reasoning sequence"
      image_path: "png/module-01-process-model.png"

  - id: "module-01-study-of-life_application"
    narration: "Now apply the module instead of only repeating its vocabulary. Start with a question: Which characteristics together make something count as alive? Treat that question as an observation that needs an explanation. A useful first claim is: Life is recognized by shared properties: cells, energy use, response, reproduction, regulation, and evolution. Then ask what evidence could support or challenge it. The first practice check reminds us that No single trait defines life. Living things share a set of properties together: cells, metabolism, homeostasis, response, reproduction, and evolution. This claim, evidence, and revision cycle is the transferable skill for the module."
    visual:
      kind: bullets
      title: "Apply the Idea"
      bullets:
        - "Observation: Which characteristics together make something count as alive?"
        - "Claim: Life is recognized by shared properties: cells, energy use, response, reproduction, regulation, and evolution."
        - "Evidence check: No single trait defines life. Living things share a set of properties together: cells, metabolism, homeostasis, response, reproduction, and evolution."
        - "Revision: if the evidence contradicts the claim, name the biological mechanism that must change."

  - id: "module-01-study-of-life_terms_01"
    narration: "Key terms for this module (page 1 of 3) include Cell, Homeostasis, Metabolism. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (1/3)"
      bullets:
        - "Cell: Basic unit of life bounded by a membrane."
        - "Homeostasis: Regulation that keeps internal conditions within a workable range."
        - "Metabolism: All chemical reactions that move matter and energy through life."

  - id: "module-01-study-of-life_terms_02"
    narration: "Key terms for this module (page 2 of 3) include Hypothesis, Variable, Evidence. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (2/3)"
      bullets:
        - "Hypothesis: Testable explanation for an observed pattern."
        - "Variable: Factor that can change in an investigation."
        - "Evidence: Observation or measurement used to support or challenge a claim."

  - id: "module-01-study-of-life_terms_03"
    narration: "Key terms for this module (page 3 of 3) include Theory, Evolution. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (3/3)"
      bullets:
        - "Theory: Broad explanation supported by many lines of evidence."
        - "Evolution: Change in heritable traits of populations across generations."

  - id: "module-01-study-of-life_lab"
    narration: "The lab connected to this module is Lab 01 Measurement Methods. The evidence you collect should test or illustrate what counts as life. You should leave the lab with a concrete observation, comparison, or model tied directly to the module claim."
    visual:
      kind: bullets
      title: "Lab Connection"
      bullets:
        - "Lab: Lab 01 Measurement Methods"
        - "Evidence surface for: What counts as life"
        - "Connect module ideas to hands-on evidence"

  - id: "module-01-study-of-life_lab_evidence"
    narration: "The Lab 01 Measurement Methods lab produces concrete evidence for this module. Focus on the measurable outcome: what changed, by how much, and why it matters. Connect the lab result back to the central claim. A strong answer names the variable, the observation, and the biological mechanism."
    visual:
      kind: image
      title: "Lab Evidence"
      subtitle: "What the lab shows"
      image_path: "png/module-01-lab-evidence.png"

  - id: "module-01-study-of-life_retrieval"
    narration: "Pause here for retrieval practice. Answer the prompts without looking at your notes first, then compare to the checks. Retrieval practice is one of the most effective study strategies — it strengthens memory more than re-reading."
    visual:
      kind: image
      title: "Retrieval Practice"
      subtitle: "Answer without notes first"
      image_path: "png/module-01-retrieval-card.png"

  - id: "module-01-study-of-life_quiz"
    narration: "Use these practice quiz questions as formative feedback. Answer key: 1=A, 2=B, 3=C, 4=D. If you miss a question, return to the module keys and find the evidence that supports the correct answer."
    visual:
      kind: checkpoint
      title: "Practice Quiz Bridge"
      bullets:
        - "Q1: A student sees frost crystals slowly \"grow\" on a cold window overnight. Why don't biologists count this as life?"
        - "Q2: To test whether fertilizer speeds plant growth, a student changes the amount of fertilizer given to each plant. The amount of fertilizer is the:"
        - "Q3: Which list places levels of biological organization from smallest to largest?"
        - "Q4: A hypothesis survives many careful tests over many years. What should happen to it?"

  - id: "module-01-study-of-life_study_move"
    narration: "Before you leave this module, make the study work active. Start with the module's central claim before memorizing vocabulary; Use the same-numbered lab as the evidence check for the module; Explain one mechanism in words, then redraw it as a simple diagram. Then answer this exit question without notes: How should a claim change when new evidence appears? A strong response names a mechanism, points to evidence, and states what would change the explanation. If your answer is only a definition list, connect the terms into a cause-and-evidence chain and try again."
    visual:
      kind: bullets
      title: "Active Study Protocol"
      bullets:
        - "Start with the module's central claim before memorizing vocabulary."
        - "Use the same-numbered lab as the evidence check for the module."
        - "Explain one mechanism in words, then redraw it as a simple diagram."
        - "Close the notes. Answer the exit question from memory."
        - "Exit question: How should a claim change when new evidence appears?"
        - "Check your answer against the module keys; revise until the chain of evidence is clear."

  - id: "module-01-study-of-life_synthesis"
    narration: "To synthesize this module: explain what counts as life using evidence from the Lab 01 Measurement Methods lab. Your explanation must include Cell, Homeostasis, Metabolism, Hypothesis, Variable, Evidence, Theory, Evolution. Revision prompt: what evidence would change your explanation? Your final explanation should connect the central claim to a mechanism, an observation, and a revision rule."
    visual:
      kind: bullets
      title: "Synthesis and Revision"
      bullets:
        - "Explain what counts as life using evidence from the Lab 01 Measurement Methods lab"
        - "Must include: Cell, Homeostasis, Metabolism, Hypothesis, Variable, Evidence, Theory, Evolution"
        - "Revision rule: if the lab evidence contradicts your explanation, name the mechanism that must change."
        - "What evidence would change your explanation?"
