  - id: "module-09-inheritance-genetics_lab_evidence"
    narration: "The Lab 09 Inheritance Genetics lab produces concrete evidence for this module. Focus on the measurable outcome: what changed, by how much, and why it matters. Connect the lab result back to the central claim. A strong answer names the variable, the observation, and the biological mechanism."
