  - id: "module-09-inheritance-genetics_title"
    narration: "Welcome to BIOL-1 General Biology at College of the Redwoods, Pelican Bay. Module 09: Inheritance Genetics. The connected lab is Lab 09 Inheritance Genetics. Here is the central idea: Inheritance Genetics explains allele segregation with probability, phenotype prediction, and pedigree evidence. Let us begin."
    visual:
      kind: title
      title: "Module 09: Inheritance Genetics"
      subtitle: "BIOL-1 General Biology  |  Lab: Lab 09 Inheritance Genetics"

  - id: "module-09-inheritance-genetics_objectives"
    narration: "By the end of this module you should be able to: Distinguish gene, allele, genotype, and phenotype; Use segregation to explain monohybrid inheritance; Build and interpret Punnett-square probabilities; Recognize inheritance patterns beyond complete dominance; Use pedigree evidence to reason about traits. Keep these objectives in mind as you work through the material."
    visual:
      kind: objectives
      title: "Learning Objectives"
      bullets:
        - "Distinguish gene, allele, genotype, and phenotype."
        - "Use segregation to explain monohybrid inheritance."
        - "Build and interpret Punnett-square probabilities."
        - "Recognize inheritance patterns beyond complete dominance."
        - "Use pedigree evidence to reason about traits."

  - id: "module-09-inheritance-genetics_topics"
    narration: "This module covers 5 topics. Alleles and genotype — Alleles are gene variants that contribute to genotype and phenotype. Mendelian patterns — Mendelian inheritance predicts patterns when alleles segregate into gametes. Punnett-square prediction — Punnett squares model probability, not guaranteed outcomes. Beyond simple dominance — Incomplete dominance, codominance, polygenic traits, and environment complicate simple patterns. Pedigrees and probability — Pedigrees use family evidence to infer inheritance patterns. Each topic builds on the one before it, forming a coherent explanation."
    visual:
      kind: bullets
      title: "Topic Sequence"
      bullets:
        - "Alleles and genotype"
        - "Mendelian patterns"
        - "Punnett-square prediction"
        - "Beyond simple dominance"
        - "Pedigrees and probability"

  - id: "module-09-inheritance-genetics_concept_map"
    narration: "Here is the concept map for module 09. The central claim is: Inheritance Genetics explains allele segregation with probability, phenotype prediction, and pedigree evidence. Notice how each node connects to the others. This is the structure of biological reasoning — not a list to memorize, but a map of how ideas support each other."
    visual:
      kind: image
      title: "Concept Map"
      subtitle: "How the ideas connect"
      image_path: "png/module-09-concept-map.png"

  - id: "module-09-inheritance-genetics_process_model"
    narration: "This process model shows the reasoning sequence for inheritance genetics. Follow the stages from inputs to outputs. The Lab 09 Inheritance Genetics lab gives you evidence to test each stage. At each transition, ask: what would change my mind about this step?"
    visual:
      kind: image
      title: "Process Model"
      subtitle: "Reasoning sequence"
      image_path: "png/module-09-process-model.png"

  - id: "module-09-inheritance-genetics_application"
    narration: "Now apply the module instead of only repeating its vocabulary. Start with a question: How are genes and alleles related? Treat that question as an observation that needs an explanation. A useful first claim is: Alleles are gene variants that contribute to genotype and phenotype. Then ask what evidence could support or challenge it. The first practice check reminds us that Genotype is the combination of alleles an organism carries. Phenotype is the observable trait that results. This claim, evidence, and revision cycle is the transferable skill for the module."
    visual:
      kind: bullets
      title: "Apply the Idea"
      bullets:
        - "Observation: How are genes and alleles related?"
        - "Claim: Alleles are gene variants that contribute to genotype and phenotype."
        - "Evidence check: Genotype is the combination of alleles an organism carries. Phenotype is the observable trait that results."
        - "Revision: if the evidence contradicts the claim, name the biological mechanism that must change."

  - id: "module-09-inheritance-genetics_terms_01"
    narration: "Key terms for this module (page 1 of 3) include Gene, Allele, Genotype. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (1/3)"
      bullets:
        - "Gene: DNA sequence contributing to a trait or functional product."
        - "Allele: Variant form of a gene."
        - "Genotype: Allele combination of an organism."

  - id: "module-09-inheritance-genetics_terms_02"
    narration: "Key terms for this module (page 2 of 3) include Phenotype, Dominant, Recessive. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (2/3)"
      bullets:
        - "Phenotype: Observable trait or characteristic."
        - "Dominant: Allele effect visible with one copy in simple dominance."
        - "Recessive: Allele effect masked by dominant allele in heterozygotes."

  - id: "module-09-inheritance-genetics_terms_03"
    narration: "Key terms for this module (page 3 of 3) include Punnett square, Pedigree. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (3/3)"
      bullets:
        - "Punnett square: Tool for modeling inheritance probabilities."
        - "Pedigree: Family diagram used to infer inheritance patterns."

