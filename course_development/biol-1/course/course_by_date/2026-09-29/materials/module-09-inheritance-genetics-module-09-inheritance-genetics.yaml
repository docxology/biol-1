        - "Close the notes. Answer the exit question from memory."
        - "Exit question: What evidence in a pedigree suggests recessive inheritance?"
        - "Check your answer against the module keys; revise until the chain of evidence is clear."

  - id: "module-09-inheritance-genetics_synthesis"
    narration: "To synthesize this module: explain alleles and genotype using evidence from the Lab 09 Inheritance Genetics lab. Your explanation must include Gene, Allele, Genotype, Phenotype, Dominant, Recessive, Punnett square, Pedigree. Revision prompt: what evidence would change your explanation? Your final explanation should connect the central claim to a mechanism, an observation, and a revision rule."
