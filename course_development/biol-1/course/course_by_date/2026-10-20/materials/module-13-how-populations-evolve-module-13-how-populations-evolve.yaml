        - "Interpret directional, stabilizing, and disruptive selection."
        - "Use Hardy-Weinberg as a non-evolving baseline."

  - id: "module-13-how-populations-evolve_topics"
    narration: "This module covers 5 topics. Allele frequencies as the unit of change — Microevolution is change in allele frequencies across generations. Sources of variation — Mutation creates new variation, while recombination reshuffles existing variation. Five mechanisms of microevolution — Mutation, gene flow, genetic drift, nonrandom mating, and natural selection can change populations. Genetic drift and selection — Genetic drift is random and strongest in small populations; selection is nonrandom and tied to fitness. Hardy-Weinberg as a baseline — Hardy-Weinberg equilibrium is a null model for detecting evolutionary change. Each topic builds on the one before it, forming a coherent explanation."
    visual:
      kind: bullets
      title: "Topic Sequence"
      bullets:
        - "Allele frequencies as the unit of change"
        - "Sources of variation"
        - "Five mechanisms of microevolution"
        - "Genetic drift and selection"
        - "Hardy-Weinberg as a baseline"

  - id: "module-13-how-populations-evolve_concept_map"
    narration: "Here is the concept map for module 13. The central claim is: How Populations Evolve explains allele-frequency change through drift, gene flow, selection, and baseline models. Notice how each node connects to the others. This is the structure of biological reasoning — not a list to memorize, but a map of how ideas support each other."
    visual:
