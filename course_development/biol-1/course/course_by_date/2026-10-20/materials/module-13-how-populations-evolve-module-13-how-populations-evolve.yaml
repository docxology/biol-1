      title: "Concept Map"
      subtitle: "How the ideas connect"
      image_path: "png/module-13-concept-map.png"

  - id: "module-13-how-populations-evolve_process_model"
    narration: "This process model shows the reasoning sequence for how populations evolve. Follow the stages from inputs to outputs. The Lab 13 How Populations Evolve lab gives you evidence to test each stage. At each transition, ask: what would change my mind about this step?"
