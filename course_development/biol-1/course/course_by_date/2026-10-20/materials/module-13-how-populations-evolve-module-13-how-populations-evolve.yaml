  - id: "module-13-how-populations-evolve_application"
    narration: "Now apply the module instead of only repeating its vocabulary. Start with a question: What is an allele frequency? Treat that question as an observation that needs an explanation. A useful first claim is: Microevolution is change in allele frequencies across generations. Then ask what evidence could support or challenge it. The first practice check reminds us that Microevolution is a shift in allele frequencies within a population over time. This claim, evidence, and revision cycle is the transferable skill for the module."
    visual:
      kind: bullets
      title: "Apply the Idea"
      bullets:
        - "Start with an observation: What is an allele frequency?"
        - "Build a claim: Microevolution is change in allele frequencies across generations."
        - "Check the claim: Microevolution is a shift in allele frequencies within a population over time."
        - "Revise the explanation when the evidence does not fit"

  - id: "module-13-how-populations-evolve_terms_01"
    narration: "Key terms for this module (page 1 of 3) include Allele frequency, Microevolution, Mutation. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (1/3)"
      bullets:
        - "Allele frequency: Proportion of a particular allele in a population."
        - "Microevolution: Allele-frequency change across generations."
        - "Mutation: DNA sequence change that can create new alleles."

  - id: "module-13-how-populations-evolve_terms_02"
    narration: "Key terms for this module (page 2 of 3) include Gene flow, Genetic drift, Bottleneck effect. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (2/3)"
      bullets:
        - "Gene flow: Movement of alleles between populations."
        - "Genetic drift: Random allele-frequency change, strongest in small populations."
        - "Bottleneck effect: Drift after a sharp population reduction."

  - id: "module-13-how-populations-evolve_terms_03"
    narration: "Key terms for this module (page 3 of 3) include Founder effect, Hardy-Weinberg equilibrium. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (3/3)"
      bullets:
        - "Founder effect: Drift when a new population starts from few individuals."
        - "Hardy-Weinberg equilibrium: Null model for allele frequencies when no evolution occurs."

