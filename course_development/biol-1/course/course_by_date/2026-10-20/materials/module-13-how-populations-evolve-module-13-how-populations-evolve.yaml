  - id: "module-13-how-populations-evolve_title"
    narration: "Welcome to BIOL-1 General Biology at College of the Redwoods, Pelican Bay. Module 13: How Populations Evolve. The connected lab is Lab 13 How Populations Evolve. Here is the central idea: How Populations Evolve explains allele-frequency change through drift, gene flow, selection, and baseline models. Let us begin."
    visual:
      kind: title
      title: "Module 13: How Populations Evolve"
      subtitle: "BIOL-1 General Biology  |  Lab: Lab 13 How Populations Evolve"

  - id: "module-13-how-populations-evolve_objectives"
    narration: "By the end of this module you should be able to: Define microevolution using allele frequencies; Compare the five mechanisms that change allele frequencies; Distinguish bottleneck and founder effects; Interpret directional, stabilizing, and disruptive selection; Use Hardy-Weinberg as a non-evolving baseline. Keep these objectives in mind as you work through the material."
    visual:
      kind: objectives
      title: "Learning Objectives"
      bullets:
        - "Define microevolution using allele frequencies."
        - "Compare the five mechanisms that change allele frequencies."
