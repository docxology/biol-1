  - id: "module-10-epigenetics_process_model"
    narration: "This process model shows the reasoning sequence for epigenetics. Follow the stages from inputs to outputs. The Lab 10 Epigenetics lab gives you evidence to test each stage. At each transition, ask: what would change my mind about this step?"
