  - id: "module-10-epigenetics_application"
    narration: "Now apply the module instead of only repeating its vocabulary. Start with a question: Why do cells regulate genes? Treat that question as an observation that needs an explanation. A useful first claim is: Cells regulate which genes are active rather than using every gene equally. Then ask what evidence could support or challenge it. The first practice check reminds us that Epigenetic marks such as methylation change how genes are expressed, not the underlying sequence. A mutation changes the sequence itself. This claim, evidence, and revision cycle is the transferable skill for the module."
    visual:
      kind: bullets
      title: "Apply the Idea"
      bullets:
        - "Start with an observation: Why do cells regulate genes?"
        - "Build a claim: Cells regulate which genes are active rather than using every gene equally."
        - "Check the claim: Epigenetic marks such as methylation change how genes are expressed, not the underlying sequence. A mutation changes the sequence itself."
        - "Revise the explanation when the evidence does not fit"

  - id: "module-10-epigenetics_terms_01"
    narration: "Key terms for this module (page 1 of 3) include Gene regulation, Epigenetics, DNA methylation. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (1/3)"
      bullets:
        - "Gene regulation: Control of when and how strongly genes are used."
        - "Epigenetics: Heritable or persistent expression changes without DNA sequence change."
        - "DNA methylation: Chemical marking of DNA often associated with reduced transcription."

  - id: "module-10-epigenetics_terms_02"
    narration: "Key terms for this module (page 2 of 3) include Histone, Chromatin, Transcription factor. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (2/3)"
      bullets:
        - "Histone: Protein around which DNA is packaged."
        - "Chromatin: DNA-protein complex that can be open or compact."
        - "Transcription factor: Protein that helps control transcription."

  - id: "module-10-epigenetics_terms_03"
    narration: "Key terms for this module (page 3 of 3) include Mutation, Expression. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (3/3)"
      bullets:
        - "Mutation: Change in DNA sequence."
        - "Expression: Use of gene information to make RNA or protein."

