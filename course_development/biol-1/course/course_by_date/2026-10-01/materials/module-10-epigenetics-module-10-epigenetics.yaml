  - id: "module-10-epigenetics_topics"
    narration: "This module covers 5 topics. Gene regulation as control — Cells regulate which genes are active rather than using every gene equally. DNA methylation — DNA methylation can reduce transcription without changing base sequence. Histone and chromatin change — Histone and chromatin changes alter access to DNA. Environment and expression — Environmental conditions can influence gene expression patterns. Epigenetics versus mutation — Epigenetic change affects gene activity, while mutation changes DNA sequence. Each topic builds on the one before it, forming a coherent explanation."
    visual:
      kind: bullets
      title: "Topic Sequence"
      bullets:
        - "Gene regulation as control"
        - "DNA methylation"
        - "Histone and chromatin change"
        - "Environment and expression"
        - "Epigenetics versus mutation"

  - id: "module-10-epigenetics_concept_map"
    narration: "Here is the concept map for module 10. The central claim is: Epigenetics explains gene regulation through chromatin, environment, and expression evidence. Notice how each node connects to the others. This is the structure of biological reasoning — not a list to memorize, but a map of how ideas support each other."
