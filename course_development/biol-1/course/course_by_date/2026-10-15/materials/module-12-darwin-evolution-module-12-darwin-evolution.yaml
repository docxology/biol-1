  - id: "module-12-darwin-evolution_title"
    narration: "Welcome to BIOL-1 General Biology at College of the Redwoods, Pelican Bay. Module 12: Darwin and Evolution. The connected lab is Lab 12 Darwin Evolution. Here is the central idea: Darwin and Evolution explains natural selection from variation, heritability, fitness, and ancestry evidence. Let us begin."
    visual:
      kind: title
      title: "Module 12: Darwin and Evolution"
      subtitle: "BIOL-1 General Biology  |  Lab: Lab 12 Darwin Evolution"

  - id: "module-12-darwin-evolution_objectives"
    narration: "By the end of this module you should be able to: Explain natural selection using variation, heritability, and reproductive success; Define fitness in evolutionary terms; Distinguish individual change from population evolution; Use multiple evidence types to support common ancestry; Apply natural selection to a concrete trait example. Keep these objectives in mind as you work through the material."
    visual:
      kind: objectives
      title: "Learning Objectives"
      bullets:
        - "Explain natural selection using variation, heritability, and reproductive success."
        - "Define fitness in evolutionary terms."
        - "Distinguish individual change from population evolution."
        - "Use multiple evidence types to support common ancestry."
        - "Apply natural selection to a concrete trait example."

  - id: "module-12-darwin-evolution_topics"
    narration: "This module covers 5 topics. Historical explanation for adaptation — Darwinian evolution explains adaptation through descent with modification. Variation and heritability — Natural selection requires variation, heritability, and unequal reproductive success. Natural selection mechanism — Fitness means relative reproductive success in a particular environment. Evidence for common ancestry — Fossils, homology, biogeography, and molecular evidence support common ancestry. Fitness as reproductive success — Evolution changes populations over generations, not individual organisms during life. Each topic builds on the one before it, forming a coherent explanation."
    visual:
      kind: bullets
      title: "Topic Sequence"
      bullets:
        - "Historical explanation for adaptation"
        - "Variation and heritability"
        - "Natural selection mechanism"
        - "Evidence for common ancestry"
        - "Fitness as reproductive success"

  - id: "module-12-darwin-evolution_concept_map"
    narration: "Here is the concept map for module 12. The central claim is: Darwin and Evolution explains natural selection from variation, heritability, fitness, and ancestry evidence. Notice how each node connects to the others. This is the structure of biological reasoning — not a list to memorize, but a map of how ideas support each other."
    visual:
      kind: image
      title: "Concept Map"
      subtitle: "How the ideas connect"
      image_path: "png/module-12-concept-map.png"

  - id: "module-12-darwin-evolution_process_model"
    narration: "This process model shows the reasoning sequence for darwin and evolution. Follow the stages from inputs to outputs. The Lab 12 Darwin Evolution lab gives you evidence to test each stage. At each transition, ask: what would change my mind about this step?"
    visual:
      kind: image
      title: "Process Model"
      subtitle: "Reasoning sequence"
      image_path: "png/module-12-process-model.png"

  - id: "module-12-darwin-evolution_application"
    narration: "Now apply the module instead of only repeating its vocabulary. Start with a question: What are the required ingredients for natural selection? Treat that question as an observation that needs an explanation. A useful first claim is: Darwinian evolution explains adaptation through descent with modification. Then ask what evidence could support or challenge it. The first practice check reminds us that Selection needs variation, heritability, and differences in reproductive success. Equal reproduction by all individuals is exactly what selection is not. This claim, evidence, and revision cycle is the transferable skill for the module."
    visual:
      kind: bullets
      title: "Apply the Idea"
      bullets:
        - "Observation: What are the required ingredients for natural selection?"
        - "Claim: Darwinian evolution explains adaptation through descent with modification."
        - "Evidence check: Selection needs variation, heritability, and differences in reproductive success. Equal reproduction by all individuals is exactly what selection is not."
        - "Revision: if the evidence contradicts the claim, name the biological mechanism that must change."

  - id: "module-12-darwin-evolution_terms_01"
    narration: "Key terms for this module (page 1 of 3) include Evolution, Natural selection, Adaptation. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (1/3)"
      bullets:
        - "Evolution: Change in heritable traits of populations across generations."
        - "Natural selection: Nonrandom differences in survival or reproduction tied to heritable traits."
        - "Adaptation: Heritable trait shaped by selection in a context."

  - id: "module-12-darwin-evolution_terms_02"
    narration: "Key terms for this module (page 2 of 3) include Fitness, Common ancestry, Homology. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (2/3)"
      bullets:
        - "Fitness: Relative reproductive success."
        - "Common ancestry: Shared origin of lineages through descent."
        - "Homology: Similarity due to shared ancestry."

  - id: "module-12-darwin-evolution_terms_03"
    narration: "Key terms for this module (page 3 of 3) include Fossil, Biogeography. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (3/3)"
      bullets:
        - "Fossil: Preserved evidence of past life."
        - "Biogeography: Study of geographic patterns in life."

