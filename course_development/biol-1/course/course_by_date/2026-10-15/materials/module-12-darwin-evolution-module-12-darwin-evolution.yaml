        - "Use the same-numbered lab as the evidence check for the module."
        - "Explain one mechanism in words, then redraw it as a simple diagram."
        - "Close the notes. Answer the exit question from memory."
        - "Exit question: How should an evolutionary explanation connect variation, heritability, and reproduction?"
        - "Check your answer against the module keys; revise until the chain of evidence is clear."

  - id: "module-12-darwin-evolution_synthesis"
    narration: "To synthesize this module: explain historical explanation for adaptation using evidence from the Lab 12 Darwin Evolution lab. Your explanation must include Evolution, Natural selection, Adaptation, Fitness, Common ancestry, Homology, Fossil, Biogeography. Revision prompt: what evidence would change your explanation? Your final explanation should connect the central claim to a mechanism, an observation, and a revision rule."
