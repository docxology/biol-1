  - id: "module-02-basic-chemistry_quiz"
    narration: "Use these practice quiz questions as formative feedback. Answer key: 1=B, 2=A, 3=D, 4=C. If you miss a question, return to the module keys and find the evidence that supports the correct answer."
    visual:
      kind: checkpoint
      title: "Practice Quiz Bridge"
      bullets:
        - "Q1: Table salt (NaCl) forms when a sodium atom gives up an electron to a chlorine atom. What kind of bond holds the result together?"
        - "Q2: Why can water dissolve so many substances important to cells?"
        - "Q3: A solution changes from pH 7 to pH 4. This means it became:"
        - "Q4: Blood keeps a nearly steady pH even when acids enter it. What best explains this stability?"

  - id: "module-02-basic-chemistry_study_move"
    narration: "Before you leave this module, make the study work active. Start with the module's central claim before memorizing vocabulary; Use the same-numbered lab as the evidence check for the module; Explain one mechanism in words, then redraw it as a simple diagram. Then answer this exit question without notes: What evidence would show that a substance is acidic or basic? A strong response names a mechanism, points to evidence, and states what would change the explanation. If your answer is only a definition list, connect the terms into a cause-and-evidence chain and try again."
