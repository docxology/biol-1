  - id: "module-02-basic-chemistry_title"
    narration: "Welcome to BIOL-1 General Biology at College of the Redwoods, Pelican Bay. Module 02: Basic Chemistry. The connected lab is Lab 02 Probability Statistics. Here is the central idea: Basic Chemistry explains atomic structure with water, pH, and biological molecule behavior. Let us begin."
    visual:
      kind: title
      title: "Module 02: Basic Chemistry"
      subtitle: "BIOL-1 General Biology  |  Lab: Lab 02 Probability Statistics"

  - id: "module-02-basic-chemistry_objectives"
    narration: "By the end of this module you should be able to: Use atomic structure to explain basic bonding patterns; Distinguish covalent, ionic, and hydrogen bonding in biological examples; Explain why water properties matter for cells and organisms; Interpret pH as a chemical condition that affects biology; Track atoms through a simple chemical reaction. Keep these objectives in mind as you work through the material."
