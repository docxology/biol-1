        - "Explain one mechanism in words, then redraw it as a simple diagram."
        - "Exit question: What evidence would show that a substance is acidic or basic?"

  - id: "module-02-basic-chemistry_synthesis"
    narration: "To synthesize this module: explain atoms and elements using evidence from the Lab 02 Probability Statistics lab. Your explanation must include Atom, Element, Covalent bond, Ionic bond, Hydrogen bond, Polarity, pH, Buffer. Revision prompt: what evidence would change your explanation? Your final explanation should connect the central claim to a mechanism, an observation, and a revision rule."
