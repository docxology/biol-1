        - "Interpret pH as a chemical condition that affects biology."
        - "Track atoms through a simple chemical reaction."

  - id: "module-02-basic-chemistry_topics"
    narration: "This module covers 5 topics. Atoms and elements — Atoms form elements, and their electrons shape bonding behavior. Bonding and molecular shape — Covalent, ionic, and hydrogen bonds create different molecular properties. Water as a biological solvent — Water polarity explains cohesion, temperature buffering, and dissolving ions or polar molecules. pH and chemical balance — pH tracks hydrogen ion concentration and affects biological molecules. Chemical reactions in cells — Cells depend on chemical reactions that rearrange matter without destroying atoms. Each topic builds on the one before it, forming a coherent explanation."
    visual:
      kind: bullets
      title: "Topic Sequence"
      bullets:
        - "Atoms and elements"
        - "Bonding and molecular shape"
        - "Water as a biological solvent"
        - "pH and chemical balance"
        - "Chemical reactions in cells"

  - id: "module-02-basic-chemistry_concept_map"
    narration: "Here is the concept map for module 02. The central claim is: Basic Chemistry explains atomic structure with water, pH, and biological molecule behavior. Notice how each node connects to the others. This is the structure of biological reasoning — not a list to memorize, but a map of how ideas support each other."
    visual:
      kind: image
      title: "Concept Map"
      subtitle: "How the ideas connect"
      image_path: "png/module-02-concept-map.png"

  - id: "module-02-basic-chemistry_process_model"
    narration: "This process model shows the reasoning sequence for basic chemistry. Follow the stages from inputs to outputs. The Lab 02 Probability Statistics lab gives you evidence to test each stage. At each transition, ask: what would change my mind about this step?"
    visual:
      kind: image
      title: "Process Model"
      subtitle: "Reasoning sequence"
      image_path: "png/module-02-process-model.png"

  - id: "module-02-basic-chemistry_application"
    narration: "Now apply the module instead of only repeating its vocabulary. Start with a question: How do protons, neutrons, and electrons differ? Treat that question as an observation that needs an explanation. A useful first claim is: Atoms form elements, and their electrons shape bonding behavior. Then ask what evidence could support or challenge it. The first practice check reminds us that Transferring electrons creates charged ions that attract each other, which is an ionic bond. Sharing electrons instead would make a covalent bond. This claim, evidence, and revision cycle is the transferable skill for the module."
    visual:
      kind: bullets
      title: "Apply the Idea"
      bullets:
        - "Start with an observation: How do protons, neutrons, and electrons differ?"
        - "Build a claim: Atoms form elements, and their electrons shape bonding behavior."
        - "Check the claim: Transferring electrons creates charged ions that attract each other, which is an ionic bond. Sharing electrons instead would make a covalent bond."
        - "Revise the explanation when the evidence does not fit"

  - id: "module-02-basic-chemistry_terms_01"
    narration: "Key terms for this module (page 1 of 3) include Atom, Element, Covalent bond. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (1/3)"
      bullets:
        - "Atom: Smallest unit of an element that keeps that element identity."
        - "Element: Pure substance defined by proton number."
        - "Covalent bond: Bond formed when atoms share electrons."

  - id: "module-02-basic-chemistry_terms_02"
    narration: "Key terms for this module (page 2 of 3) include Ionic bond, Hydrogen bond, Polarity. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (2/3)"
      bullets:
        - "Ionic bond: Attraction between oppositely charged ions."
        - "Hydrogen bond: Weak attraction involving polar hydrogen and electronegative atoms."
        - "Polarity: Uneven charge distribution across a molecule."

  - id: "module-02-basic-chemistry_terms_03"
    narration: "Key terms for this module (page 3 of 3) include pH, Buffer. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (3/3)"
      bullets:
        - "pH: Measure of hydrogen ion concentration."
        - "Buffer: Chemical system that resists pH change."

