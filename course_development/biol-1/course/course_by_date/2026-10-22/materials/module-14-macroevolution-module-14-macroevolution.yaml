  - id: "module-14-macroevolution_application"
    narration: "Now apply the module instead of only repeating its vocabulary. Start with a question: What does the biological species concept emphasize? Treat that question as an observation that needs an explanation. A useful first claim is: Species concepts define lineages using reproductive, morphological, or evolutionary criteria. Then ask what evidence could support or challenge it. The first practice check reminds us that The biological species concept centers on reproductive isolation: no successful gene flow between the groups. This claim, evidence, and revision cycle is the transferable skill for the module."
    visual:
      kind: bullets
      title: "Apply the Idea"
      bullets:
        - "Start with an observation: What does the biological species concept emphasize?"
        - "Build a claim: Species concepts define lineages using reproductive, morphological, or evolutionary criteria."
        - "Check the claim: The biological species concept centers on reproductive isolation: no successful gene flow between the groups."
        - "Revise the explanation when the evidence does not fit"

  - id: "module-14-macroevolution_terms_01"
    narration: "Key terms for this module (page 1 of 3) include Species, Biological species concept, Reproductive isolation. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (1/3)"
      bullets:
        - "Species: Lineage or group identified by a species concept."
        - "Biological species concept: Species defined by interbreeding and reproductive isolation."
        - "Reproductive isolation: Barriers that reduce gene flow between groups."

  - id: "module-14-macroevolution_terms_02"
    narration: "Key terms for this module (page 2 of 3) include Prezygotic barrier, Postzygotic barrier, Allopatric speciation. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (2/3)"
      bullets:
        - "Prezygotic barrier: Barrier before fertilization."
        - "Postzygotic barrier: Barrier after fertilization."
        - "Allopatric speciation: Speciation with geographic separation."

  - id: "module-14-macroevolution_terms_03"
    narration: "Key terms for this module (page 3 of 3) include Sympatric speciation, Phylogeny. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (3/3)"
      bullets:
        - "Sympatric speciation: Speciation without geographic separation."
        - "Phylogeny: Evolutionary relationship history among lineages."

