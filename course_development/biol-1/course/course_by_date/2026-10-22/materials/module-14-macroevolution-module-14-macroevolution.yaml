  - id: "module-14-macroevolution_topics"
    narration: "This module covers 5 topics. Species concepts — Species concepts define lineages using reproductive, morphological, or evolutionary criteria. Reproductive isolation — Reproductive isolation reduces gene flow between populations. Prezygotic barriers — Prezygotic barriers prevent mating or fertilization before a zygote forms. Postzygotic barriers — Postzygotic barriers reduce hybrid survival or fertility after a zygote forms. Speciation patterns and phylogeny — Speciation can occur allopatrically or sympatrically and is represented in phylogenies. Each topic builds on the one before it, forming a coherent explanation."
    visual:
      kind: bullets
      title: "Topic Sequence"
      bullets:
        - "Species concepts"
        - "Reproductive isolation"
        - "Prezygotic barriers"
        - "Postzygotic barriers"
        - "Speciation patterns and phylogeny"

  - id: "module-14-macroevolution_concept_map"
    narration: "Here is the concept map for module 14. The central claim is: Macroevolution explains speciation as reduced gene flow, reproductive isolation, and phylogenetic divergence. Notice how each node connects to the others. This is the structure of biological reasoning — not a list to memorize, but a map of how ideas support each other."
    visual:
      kind: image
      title: "Concept Map"
      subtitle: "How the ideas connect"
      image_path: "png/module-14-concept-map.png"

  - id: "module-14-macroevolution_process_model"
    narration: "This process model shows the reasoning sequence for macroevolution. Follow the stages from inputs to outputs. The Lab 14 Macroevolution lab gives you evidence to test each stage. At each transition, ask: what would change my mind about this step?"
    visual:
