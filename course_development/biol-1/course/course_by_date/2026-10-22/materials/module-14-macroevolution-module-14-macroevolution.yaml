  - id: "module-14-macroevolution_title"
    narration: "Welcome to BIOL-1 General Biology at College of the Redwoods, Pelican Bay. Module 14: Macroevolution. The connected lab is Lab 14 Macroevolution. Here is the central idea: Macroevolution explains speciation as reduced gene flow, reproductive isolation, and phylogenetic divergence. Let us begin."
    visual:
      kind: title
      title: "Module 14: Macroevolution"
      subtitle: "BIOL-1 General Biology  |  Lab: Lab 14 Macroevolution"

  - id: "module-14-macroevolution_objectives"
    narration: "By the end of this module you should be able to: State the biological species concept and its limits; Explain reproductive isolation as reduced gene flow; Classify examples as prezygotic or postzygotic barriers; Compare allopatric and sympatric speciation; Interpret speciation as population-level divergence over time. Keep these objectives in mind as you work through the material."
    visual:
      kind: objectives
      title: "Learning Objectives"
      bullets:
        - "State the biological species concept and its limits."
        - "Explain reproductive isolation as reduced gene flow."
