  - id: "module-03-organic-molecules_topics"
    narration: "This module covers 5 topics. Carbon skeletons — Carbon forms diverse skeletons that make biological molecules possible. Building and breaking polymers — Dehydration synthesis builds polymers, and hydrolysis breaks them down. Carbohydrates and lipids — Carbohydrates and lipids store energy and provide structure in different ways. Proteins and shape — Protein function depends on amino acid sequence and three-dimensional shape. Nucleic acids and information — DNA and RNA store and move information using nucleotide sequences. Each topic builds on the one before it, forming a coherent explanation."
    visual:
      kind: bullets
      title: "Topic Sequence"
      bullets:
        - "Carbon skeletons"
        - "Building and breaking polymers"
        - "Carbohydrates and lipids"
        - "Proteins and shape"
        - "Nucleic acids and information"

