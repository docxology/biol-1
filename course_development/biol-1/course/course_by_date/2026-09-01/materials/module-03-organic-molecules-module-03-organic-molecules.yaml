  - id: "module-03-organic-molecules_application"
    narration: "Now apply the module instead of only repeating its vocabulary. Start with a question: Why can carbon make many different biological molecules? Treat that question as an observation that needs an explanation. A useful first claim is: Carbon forms diverse skeletons that make biological molecules possible. Then ask what evidence could support or challenge it. The first practice check reminds us that Carbon's ability to form four stable bonds allows large, varied molecules, which is the basis of life's chemical diversity. This claim, evidence, and revision cycle is the transferable skill for the module."
    visual:
      kind: bullets
      title: "Apply the Idea"
      bullets:
        - "Start with an observation: Why can carbon make many different biological molecules?"
        - "Build a claim: Carbon forms diverse skeletons that make biological molecules possible."
        - "Check the claim: Carbon's ability to form four stable bonds allows large, varied molecules, which is the basis of life's chemical diversity."
        - "Revise the explanation when the evidence does not fit"

  - id: "module-03-organic-molecules_terms_01"
    narration: "Key terms for this module (page 1 of 3) include Organic molecule, Monomer, Polymer. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (1/3)"
      bullets:
        - "Organic molecule: Carbon-based molecule associated with living systems."
        - "Monomer: Small building block that can join into a polymer."
        - "Polymer: Large molecule built from repeating subunits."

  - id: "module-03-organic-molecules_terms_02"
    narration: "Key terms for this module (page 2 of 3) include Carbohydrate, Lipid, Protein. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (2/3)"
      bullets:
        - "Carbohydrate: Sugar or sugar polymer used for energy or structure."
        - "Lipid: Hydrophobic molecule including fats, phospholipids, and steroids."
        - "Protein: Polymer of amino acids that performs cellular work."

  - id: "module-03-organic-molecules_terms_03"
    narration: "Key terms for this module (page 3 of 3) include Nucleic acid, Denaturation. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (3/3)"
      bullets:
        - "Nucleic acid: DNA or RNA polymer made of nucleotides."
        - "Denaturation: Loss of protein shape that often destroys function."

