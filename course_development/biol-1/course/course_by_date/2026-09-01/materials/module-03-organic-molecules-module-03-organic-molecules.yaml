    narration: "Welcome to BIOL-1 General Biology at College of the Redwoods, Pelican Bay. Module 03: Organic Molecules. The connected lab is Lab 03 Microscopy. Here is the central idea: Organic Molecules explains carbon chemistry with polymer assembly and biological molecule evidence. Let us begin."
