  - id: "module-06-metabolism_topics"
    narration: "This module covers 5 topics. Energy and thermodynamics — Cells transform energy while obeying thermodynamic constraints. ATP as cellular coupling — ATP couples energy-releasing reactions to energy-requiring cellular work. Enzymes and activation energy — Enzymes lower activation energy without being consumed. Regulation by conditions and inhibitors — Temperature, pH, substrate concentration, and inhibitors alter enzyme function. Photosynthesis and respiration as linked pathways — Photosynthesis builds sugar while respiration breaks fuel down to harvest usable energy. Each topic builds on the one before it, forming a coherent explanation."
    visual:
      kind: bullets
      title: "Topic Sequence"
      bullets:
        - "Energy and thermodynamics"
        - "ATP as cellular coupling"
        - "Enzymes and activation energy"
        - "Regulation by conditions and inhibitors"
        - "Photosynthesis and respiration as linked pathways"

