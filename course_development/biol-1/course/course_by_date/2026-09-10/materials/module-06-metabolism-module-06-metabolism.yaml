  - id: "module-06-metabolism_application"
    narration: "Now apply the module instead of only repeating its vocabulary. Start with a question: How do the laws of thermodynamics constrain cells? Treat that question as an observation that needs an explanation. A useful first claim is: Cells transform energy while obeying thermodynamic constraints. Then ask what evidence could support or challenge it. The first practice check reminds us that ATP is the cell's energy currency: it couples energy-releasing reactions to energy-requiring ones. This claim, evidence, and revision cycle is the transferable skill for the module."
    visual:
      kind: bullets
      title: "Apply the Idea"
      bullets:
        - "Observation: How do the laws of thermodynamics constrain cells?"
        - "Claim: Cells transform energy while obeying thermodynamic constraints."
        - "Evidence check: ATP is the cell's energy currency: it couples energy-releasing reactions to energy-requiring ones."
        - "Revision: if the evidence contradicts the claim, name the biological mechanism that must change."

  - id: "module-06-metabolism_terms_01"
    narration: "Key terms for this module (page 1 of 3) include Metabolism, ATP, Activation energy. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (1/3)"
      bullets:
        - "Metabolism: All chemical reactions in a cell or organism."
        - "ATP: Cellular energy-coupling molecule."
        - "Activation energy: Energy required to start a reaction."

  - id: "module-06-metabolism_terms_02"
    narration: "Key terms for this module (page 2 of 3) include Enzyme, Substrate, Denaturation. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (2/3)"
      bullets:
        - "Enzyme: Protein or RNA catalyst that speeds a reaction."
        - "Substrate: Reactant that binds an enzyme active site."
        - "Denaturation: Loss of shape that disrupts function."

  - id: "module-06-metabolism_terms_03"
    narration: "Key terms for this module (page 3 of 3) include Photosynthesis, Cellular respiration. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (3/3)"
      bullets:
        - "Photosynthesis: Process that uses light energy to build sugars."
        - "Cellular respiration: Process that harvests usable energy from fuel molecules."

