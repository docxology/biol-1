    narration: "Welcome to BIOL-1 General Biology at College of the Redwoods, Pelican Bay. Module 06: Metabolism. The connected lab is Lab 06 Metabolism. Here is the central idea: Metabolism explains energy transformations with ATP coupling, enzymes, and linked pathways. Let us begin."
