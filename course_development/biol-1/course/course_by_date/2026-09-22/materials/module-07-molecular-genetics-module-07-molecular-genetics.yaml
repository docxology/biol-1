  - id: "module-07-molecular-genetics_application"
    narration: "Now apply the module instead of only repeating its vocabulary. Start with a question: How does DNA structure store information? Treat that question as an observation that needs an explanation. A useful first claim is: DNA stores information in nucleotide sequences and complementary base pairing. Then ask what evidence could support or challenge it. The first practice check reminds us that The base-pairing rules are A with T and C with G. This complementarity lets DNA be copied accurately. This claim, evidence, and revision cycle is the transferable skill for the module."
    visual:
      kind: bullets
      title: "Apply the Idea"
      bullets:
        - "Observation: How does DNA structure store information?"
        - "Claim: DNA stores information in nucleotide sequences and complementary base pairing."
        - "Evidence check: The base-pairing rules are A with T and C with G. This complementarity lets DNA be copied accurately."
        - "Revision: if the evidence contradicts the claim, name the biological mechanism that must change."

  - id: "module-07-molecular-genetics_terms_01"
    narration: "Key terms for this module (page 1 of 3) include DNA, Nucleotide, Replication. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (1/3)"
      bullets:
        - "DNA: Nucleic acid that stores hereditary information."
        - "Nucleotide: DNA or RNA subunit with sugar, phosphate, and base."
        - "Replication: Process that copies DNA."

  - id: "module-07-molecular-genetics_terms_02"
    narration: "Key terms for this module (page 2 of 3) include Transcription, Translation, Codon. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (2/3)"
      bullets:
        - "Transcription: Synthesis of RNA from a DNA template."
        - "Translation: Synthesis of protein from mRNA codons."
        - "Codon: Three-base mRNA sequence read during translation."

  - id: "module-07-molecular-genetics_terms_03"
    narration: "Key terms for this module (page 3 of 3) include Mutation, Gene expression. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (3/3)"
      bullets:
        - "Mutation: Change in DNA sequence."
        - "Gene expression: Use of genetic information to make RNA or protein."

