  - id: "module-07-molecular-genetics_topics"
    narration: "This module covers 5 topics. DNA structure — DNA stores information in nucleotide sequences and complementary base pairing. Replication — Replication copies DNA using each strand as a template. Transcription — Transcription produces RNA from a DNA gene. Translation — Translation uses mRNA codons and ribosomes to build proteins. Mutation and gene expression evidence — Mutations and expression patterns connect molecular changes to traits. Each topic builds on the one before it, forming a coherent explanation."
    visual:
      kind: bullets
      title: "Topic Sequence"
      bullets:
        - "DNA structure"
        - "Replication"
        - "Transcription"
        - "Translation"
        - "Mutation and gene expression evidence"

  - id: "module-07-molecular-genetics_concept_map"
    narration: "Here is the concept map for module 07. The central claim is: Molecular Genetics explains DNA information flow from sequence to RNA, protein, and trait evidence. Notice how each node connects to the others. This is the structure of biological reasoning — not a list to memorize, but a map of how ideas support each other."
    visual:
      kind: image
      title: "Concept Map"
      subtitle: "How the ideas connect"
      image_path: "png/module-07-concept-map.png"

  - id: "module-07-molecular-genetics_process_model"
    narration: "This process model shows the reasoning sequence for molecular genetics. Follow the stages from inputs to outputs. The Lab 07 Molecular Genetics lab gives you evidence to test each stage. At each transition, ask: what would change my mind about this step?"
    visual:
      kind: image
      title: "Process Model"
