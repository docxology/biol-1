      kind: title
      title: "Module 07: Molecular Genetics"
      subtitle: "BIOL-1 General Biology  |  Lab: Lab 07 Molecular Genetics"

  - id: "module-07-molecular-genetics_objectives"
    narration: "By the end of this module you should be able to: Describe DNA structure and base-pairing rules; Explain why DNA replication is semiconservative; Compare transcription and translation; Use codons to connect mRNA sequence to amino acid sequence; Explain how mutation can alter protein and trait outcomes. Keep these objectives in mind as you work through the material."
    visual:
      kind: objectives
