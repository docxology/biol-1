  - id: "module-07-molecular-genetics_title"
    narration: "Welcome to BIOL-1 General Biology at College of the Redwoods, Pelican Bay. Module 07: Molecular Genetics. The connected lab is Lab 07 Molecular Genetics. Here is the central idea: Molecular Genetics explains DNA information flow from sequence to RNA, protein, and trait evidence. Let us begin."
