  - id: "module-05-membranes_topics"
    narration: "This module covers 5 topics. Phospholipid bilayer structure — The phospholipid bilayer forms a flexible boundary with hydrophilic and hydrophobic regions. Selective permeability — Selective permeability controls which materials cross easily and which require help. Passive transport — Diffusion, osmosis, and facilitated diffusion move substances down gradients. Active transport — Active transport uses energy to move substances against gradients. Osmosis and cell environments — Tonicity predicts water movement and cell volume changes. Each topic builds on the one before it, forming a coherent explanation."
    visual:
      kind: bullets
      title: "Topic Sequence"
      bullets:
        - "Phospholipid bilayer structure"
        - "Selective permeability"
        - "Passive transport"
        - "Active transport"
        - "Osmosis and cell environments"

