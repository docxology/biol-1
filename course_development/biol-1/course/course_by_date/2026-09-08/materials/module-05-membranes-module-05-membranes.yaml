    narration: "Welcome to BIOL-1 General Biology at College of the Redwoods, Pelican Bay. Module 05: Membranes. The connected lab is Lab 05 Viewing Life. Here is the central idea: Membranes explains membrane structure with gradients, transport, and cell survival predictions. Let us begin."
