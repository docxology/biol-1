  - id: "module-05-membranes_application"
    narration: "Now apply the module instead of only repeating its vocabulary. Start with a question: Why do phospholipids form bilayers in water? Treat that question as an observation that needs an explanation. A useful first claim is: The phospholipid bilayer forms a flexible boundary with hydrophilic and hydrophobic regions. Then ask what evidence could support or challenge it. The first practice check reminds us that The hydrophilic heads face the water and the hydrophobic tails hide inside, forming a stable two-layer membrane. This claim, evidence, and revision cycle is the transferable skill for the module."
    visual:
      kind: bullets
      title: "Apply the Idea"
      bullets:
        - "Observation: Why do phospholipids form bilayers in water?"
        - "Claim: The phospholipid bilayer forms a flexible boundary with hydrophilic and hydrophobic regions."
        - "Evidence check: The hydrophilic heads face the water and the hydrophobic tails hide inside, forming a stable two-layer membrane."
        - "Revision: if the evidence contradicts the claim, name the biological mechanism that must change."

  - id: "module-05-membranes_terms_01"
    narration: "Key terms for this module (page 1 of 3) include Phospholipid, Bilayer, Selective permeability. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (1/3)"
      bullets:
        - "Phospholipid: Molecule with a hydrophilic head and hydrophobic tails."
        - "Bilayer: Double layer of phospholipids forming a membrane."
        - "Selective permeability: Property of allowing some substances through more easily than others."

  - id: "module-05-membranes_terms_02"
    narration: "Key terms for this module (page 2 of 3) include Diffusion, Osmosis, Facilitated diffusion. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (2/3)"
      bullets:
        - "Diffusion: Net movement from high to low concentration."
        - "Osmosis: Diffusion of water across a selectively permeable membrane."
        - "Facilitated diffusion: Passive transport through membrane proteins."

  - id: "module-05-membranes_terms_03"
    narration: "Key terms for this module (page 3 of 3) include Active transport, Tonicity. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (3/3)"
      bullets:
        - "Active transport: Energy-requiring movement against a gradient."
        - "Tonicity: Relative solute condition that predicts water movement."

