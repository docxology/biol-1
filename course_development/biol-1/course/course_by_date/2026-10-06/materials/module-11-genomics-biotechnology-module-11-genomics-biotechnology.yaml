  - id: "module-11-genomics-biotechnology_study_move"
    narration: "Before you leave this module, make the study work active. Start with the module's central claim before memorizing vocabulary; Use the same-numbered lab as the evidence check for the module; Explain one mechanism in words, then redraw it as a simple diagram. Then answer this exit question without notes: What ethical questions can biotechnology raise? A strong response names a mechanism, points to evidence, and states what would change the explanation. If your answer is only a definition list, connect the terms into a cause-and-evidence chain and try again."
    visual:
      kind: bullets
      title: "Active Study Protocol"
      bullets:
        - "Start with the module's central claim before memorizing vocabulary."
        - "Use the same-numbered lab as the evidence check for the module."
        - "Explain one mechanism in words, then redraw it as a simple diagram."
        - "Close the notes. Answer the exit question from memory."
        - "Exit question: What ethical questions can biotechnology raise?"
        - "Check your answer against the module keys; revise until the chain of evidence is clear."

  - id: "module-11-genomics-biotechnology_synthesis"
    narration: "To synthesize this module: explain genomes as data using evidence from the Lab 11 Genomics Biotechnology lab. Your explanation must include Genome, Genomics, PCR, Primer, Gel electrophoresis, CRISPR, GMO, Bioethics. Revision prompt: what evidence would change your explanation? Your final explanation should connect the central claim to a mechanism, an observation, and a revision rule."
