  - id: "module-11-genomics-biotechnology_title"
    narration: "Welcome to BIOL-1 General Biology at College of the Redwoods, Pelican Bay. Module 11: Genomics and Biotechnology. The connected lab is Lab 11 Genomics Biotechnology. Here is the central idea: Genomics and Biotechnology explains genomes as data interpreted through PCR, gels, tools, and ethical limits. Let us begin."
    visual:
      kind: title
      title: "Module 11: Genomics and Biotechnology"
      subtitle: "BIOL-1 General Biology  |  Lab: Lab 11 Genomics Biotechnology"

  - id: "module-11-genomics-biotechnology_objectives"
    narration: "By the end of this module you should be able to: Define genome and genomics; Explain why PCR amplification is useful; Interpret basic gel electrophoresis fragment patterns; Describe what genetic engineering tools can do; Evaluate biotechnology claims using evidence and ethical considerations. Keep these objectives in mind as you work through the material."
    visual:
      kind: objectives
      title: "Learning Objectives"
      bullets:
        - "Define genome and genomics."
        - "Explain why PCR amplification is useful."
        - "Interpret basic gel electrophoresis fragment patterns."
        - "Describe what genetic engineering tools can do."
        - "Evaluate biotechnology claims using evidence and ethical considerations."

  - id: "module-11-genomics-biotechnology_topics"
    narration: "This module covers 5 topics. Genomes as data — A genome is the full DNA information set of an organism or sample. PCR and amplification — PCR amplifies chosen DNA regions so they can be analyzed. Gel electrophoresis and comparison — Gel electrophoresis separates DNA fragments by size. Genetic engineering tools — Biotechnology tools can copy, edit, compare, or move genetic information. Biotechnology decisions and ethics — Applications require evidence, risk reasoning, and ethical judgment. Each topic builds on the one before it, forming a coherent explanation."
    visual:
      kind: bullets
      title: "Topic Sequence"
      bullets:
        - "Genomes as data"
        - "PCR and amplification"
        - "Gel electrophoresis and comparison"
        - "Genetic engineering tools"
        - "Biotechnology decisions and ethics"

  - id: "module-11-genomics-biotechnology_concept_map"
    narration: "Here is the concept map for module 11. The central claim is: Genomics and Biotechnology explains genomes as data interpreted through PCR, gels, tools, and ethical limits. Notice how each node connects to the others. This is the structure of biological reasoning — not a list to memorize, but a map of how ideas support each other."
    visual:
      kind: image
      title: "Concept Map"
      subtitle: "How the ideas connect"
      image_path: "png/module-11-concept-map.png"

  - id: "module-11-genomics-biotechnology_process_model"
    narration: "This process model shows the reasoning sequence for genomics and biotechnology. Follow the stages from inputs to outputs. The Lab 11 Genomics Biotechnology lab gives you evidence to test each stage. At each transition, ask: what would change my mind about this step?"
    visual:
      kind: image
      title: "Process Model"
      subtitle: "Reasoning sequence"
      image_path: "png/module-11-process-model.png"

  - id: "module-11-genomics-biotechnology_application"
    narration: "Now apply the module instead of only repeating its vocabulary. Start with a question: What is a genome? Treat that question as an observation that needs an explanation. A useful first claim is: A genome is the full DNA information set of an organism or sample. Then ask what evidence could support or challenge it. The first practice check reminds us that PCR amplifies a chosen DNA region so there is enough material to analyze. This claim, evidence, and revision cycle is the transferable skill for the module."
    visual:
      kind: bullets
      title: "Apply the Idea"
      bullets:
        - "Observation: What is a genome?"
        - "Claim: A genome is the full DNA information set of an organism or sample."
        - "Evidence check: PCR amplifies a chosen DNA region so there is enough material to analyze."
        - "Revision: if the evidence contradicts the claim, name the biological mechanism that must change."

  - id: "module-11-genomics-biotechnology_terms_01"
    narration: "Key terms for this module (page 1 of 3) include Genome, Genomics, PCR. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (1/3)"
      bullets:
        - "Genome: Complete DNA information of an organism or sample."
        - "Genomics: Study of whole genomes and their patterns."
        - "PCR: Technique for amplifying selected DNA sequences."

  - id: "module-11-genomics-biotechnology_terms_02"
    narration: "Key terms for this module (page 2 of 3) include Primer, Gel electrophoresis, CRISPR. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (2/3)"
      bullets:
        - "Primer: Short DNA sequence that starts PCR copying."
        - "Gel electrophoresis: Method that separates DNA fragments by size."
        - "CRISPR: Gene-editing system adapted from bacterial defense."

  - id: "module-11-genomics-biotechnology_terms_03"
    narration: "Key terms for this module (page 3 of 3) include GMO, Bioethics. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (3/3)"
      bullets:
        - "GMO: Organism with genetic material altered by biotechnology."
        - "Bioethics: Reasoning about benefits, harms, rights, and responsibilities in biology."

  - id: "module-11-genomics-biotechnology_lab"
    narration: "The lab connected to this module is Lab 11 Genomics Biotechnology. The evidence you collect should test or illustrate genomes as data. You should leave the lab with a concrete observation, comparison, or model tied directly to the module claim."
    visual:
