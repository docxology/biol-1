  - id: "module-11-genomics-biotechnology_lab_evidence"
    narration: "The Lab 11 Genomics Biotechnology lab produces concrete evidence for this module. Focus on the measurable outcome: what changed, by how much, and why it matters. Connect the lab result back to the central claim. A strong answer names the variable, the observation, and the biological mechanism."
