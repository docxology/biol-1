  - id: "module-08-cellular-genetics_topics"
    narration: "This module covers 5 topics. Chromosomes and cell cycle — Chromosomes organize DNA so cells can divide accurately. Mitosis for growth and repair — Mitosis produces genetically identical daughter cells for growth and repair. Meiosis for gametes — Meiosis produces haploid gametes for sexual reproduction. Variation from recombination and assortment — Crossing over and independent assortment create genetic variation. Errors and genetic consequences — Nondisjunction and other errors can change chromosome number. Each topic builds on the one before it, forming a coherent explanation."
    visual:
      kind: bullets
      title: "Topic Sequence"
      bullets:
        - "Chromosomes and cell cycle"
        - "Mitosis for growth and repair"
        - "Meiosis for gametes"
        - "Variation from recombination and assortment"
        - "Errors and genetic consequences"

  - id: "module-08-cellular-genetics_concept_map"
    narration: "Here is the concept map for module 08. The central claim is: Cellular Genetics explains chromosome behavior across mitosis, meiosis, variation, and errors. Notice how each node connects to the others. This is the structure of biological reasoning — not a list to memorize, but a map of how ideas support each other."
    visual:
      kind: image
      title: "Concept Map"
