  - id: "module-08-cellular-genetics_application"
    narration: "Now apply the module instead of only repeating its vocabulary. Start with a question: Why do cells package DNA into chromosomes? Treat that question as an observation that needs an explanation. A useful first claim is: Chromosomes organize DNA so cells can divide accurately. Then ask what evidence could support or challenge it. The first practice check reminds us that Mitosis produces two genetically identical daughter cells for growth and repair. Meiosis makes four haploid gametes. This claim, evidence, and revision cycle is the transferable skill for the module."
    visual:
      kind: bullets
      title: "Apply the Idea"
      bullets:
        - "Observation: Why do cells package DNA into chromosomes?"
        - "Claim: Chromosomes organize DNA so cells can divide accurately."
        - "Evidence check: Mitosis produces two genetically identical daughter cells for growth and repair. Meiosis makes four haploid gametes."
        - "Revision: if the evidence contradicts the claim, name the biological mechanism that must change."

  - id: "module-08-cellular-genetics_terms_01"
    narration: "Key terms for this module (page 1 of 3) include Chromosome, Cell cycle, Mitosis. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (1/3)"
      bullets:
        - "Chromosome: DNA-protein structure carrying genes."
        - "Cell cycle: Ordered sequence of cell growth, DNA replication, and division."
        - "Mitosis: Nuclear division producing identical daughter nuclei."

  - id: "module-08-cellular-genetics_terms_02"
    narration: "Key terms for this module (page 2 of 3) include Meiosis, Gamete, Crossing over. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (2/3)"
      bullets:
        - "Meiosis: Division process producing haploid gametes."
        - "Gamete: Haploid reproductive cell."
        - "Crossing over: Exchange of DNA between homologous chromosomes."

  - id: "module-08-cellular-genetics_terms_03"
    narration: "Key terms for this module (page 3 of 3) include Independent assortment, Nondisjunction. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (3/3)"
      bullets:
        - "Independent assortment: Random orientation of chromosome pairs in meiosis."
        - "Nondisjunction: Failure of chromosomes to separate correctly."

