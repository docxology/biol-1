  - id: "module-08-cellular-genetics_process_model"
    narration: "This process model shows the reasoning sequence for cellular genetics. Follow the stages from inputs to outputs. The Lab 08 Cellular Genetics lab gives you evidence to test each stage. At each transition, ask: what would change my mind about this step?"
