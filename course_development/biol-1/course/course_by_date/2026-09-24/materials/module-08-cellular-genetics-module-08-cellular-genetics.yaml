  - id: "module-08-cellular-genetics_title"
    narration: "Welcome to BIOL-1 General Biology at College of the Redwoods, Pelican Bay. Module 08: Cellular Genetics. The connected lab is Lab 08 Cellular Genetics. Here is the central idea: Cellular Genetics explains chromosome behavior across mitosis, meiosis, variation, and errors. Let us begin."
    visual:
      kind: title
      title: "Module 08: Cellular Genetics"
      subtitle: "BIOL-1 General Biology  |  Lab: Lab 08 Cellular Genetics"

  - id: "module-08-cellular-genetics_objectives"
    narration: "By the end of this module you should be able to: Relate chromosomes to DNA organization; Compare the purpose and products of mitosis and meiosis; Explain how meiosis reduces chromosome number; Describe how crossing over and independent assortment increase variation; Interpret chromosome number errors at an introductory level. Keep these objectives in mind as you work through the material."
    visual:
