  - id: "module-04-cells_topics"
    narration: "This module covers 5 topics. Cell theory — Cell theory explains cells as the basic units of life and as descendants of existing cells. Prokaryotic and eukaryotic organization — Prokaryotic and eukaryotic cells differ in compartmentalization and internal organization. Membranes and compartments — Membranes separate internal conditions from the environment and define organelles. Organelles and division of labor — Organelles divide cellular work such as energy capture, protein processing, and storage. Microscopy and evidence — Microscopy turns cell structure into observable evidence. Each topic builds on the one before it, forming a coherent explanation."
    visual:
      kind: bullets
      title: "Topic Sequence"
      bullets:
        - "Cell theory"
        - "Prokaryotic and eukaryotic organization"
        - "Membranes and compartments"
        - "Organelles and division of labor"
        - "Microscopy and evidence"

  - id: "module-04-cells_concept_map"
    narration: "Here is the concept map for module 04. The central claim is: Cells explains cell theory with compartmental structure and microscopy evidence. Notice how each node connects to the others. This is the structure of biological reasoning — not a list to memorize, but a map of how ideas support each other."
    visual:
      kind: image
      title: "Concept Map"
      subtitle: "How the ideas connect"
