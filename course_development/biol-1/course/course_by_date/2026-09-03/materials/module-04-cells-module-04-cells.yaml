  - id: "module-04-cells_application"
    narration: "Now apply the module instead of only repeating its vocabulary. Start with a question: What does cell theory claim? Treat that question as an observation that needs an explanation. A useful first claim is: Cell theory explains cells as the basic units of life and as descendants of existing cells. Then ask what evidence could support or challenge it. The first practice check reminds us that Cell theory states that organisms are made of cells and that cells arise from pre-existing cells. This claim, evidence, and revision cycle is the transferable skill for the module."
    visual:
      kind: bullets
      title: "Apply the Idea"
      bullets:
        - "Observation: What does cell theory claim?"
        - "Claim: Cell theory explains cells as the basic units of life and as descendants of existing cells."
        - "Evidence check: Cell theory states that organisms are made of cells and that cells arise from pre-existing cells."
        - "Revision: if the evidence contradicts the claim, name the biological mechanism that must change."

  - id: "module-04-cells_terms_01"
    narration: "Key terms for this module (page 1 of 3) include Cell theory, Prokaryote, Eukaryote. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (1/3)"
      bullets:
        - "Cell theory: Principle that organisms are made of cells and cells come from cells."
        - "Prokaryote: Cell without a membrane-bound nucleus."
        - "Eukaryote: Cell with a membrane-bound nucleus and organelles."

  - id: "module-04-cells_terms_02"
    narration: "Key terms for this module (page 2 of 3) include Organelle, Nucleus, Mitochondrion. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (2/3)"
      bullets:
        - "Organelle: Specialized cell structure with a particular job."
        - "Nucleus: Eukaryotic compartment that stores DNA."
        - "Mitochondrion: Organelle central to aerobic energy harvesting."

  - id: "module-04-cells_terms_03"
    narration: "Key terms for this module (page 3 of 3) include Chloroplast, Microscopy. Treat each term as a handle for reasoning — a term should help you explain a claim or observation, not just label it."
    visual:
      kind: recap
      title: "Key Terms (3/3)"
      bullets:
        - "Chloroplast: Plant and algal organelle that performs photosynthesis."
        - "Microscopy: Use of lenses or imaging tools to observe small structures."

