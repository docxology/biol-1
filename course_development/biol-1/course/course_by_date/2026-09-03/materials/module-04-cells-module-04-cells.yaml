  - id: "module-04-cells_process_model"
    narration: "This process model shows the reasoning sequence for cells. Follow the stages from inputs to outputs. The Lab 04 Liquid Chemistry lab gives you evidence to test each stage. At each transition, ask: what would change my mind about this step?"
