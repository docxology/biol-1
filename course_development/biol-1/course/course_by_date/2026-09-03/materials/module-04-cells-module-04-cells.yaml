  - id: "module-04-cells_objectives"
    narration: "By the end of this module you should be able to: State the core claims of cell theory; Compare prokaryotic and eukaryotic cells using structure and scale; Explain how membranes and compartments support cell function; Match major organelles to their roles; Use microscope evidence to support claims about cells. Keep these objectives in mind as you work through the material."
