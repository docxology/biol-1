  - id: "module-04-cells_title"
    narration: "Welcome to BIOL-1 General Biology at College of the Redwoods, Pelican Bay. Module 04: Cells. The connected lab is Lab 04 Liquid Chemistry. Here is the central idea: Cells explains cell theory with compartmental structure and microscopy evidence. Let us begin."
