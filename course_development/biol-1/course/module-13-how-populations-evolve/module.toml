[module]
number = 13
slug = "module-13-how-populations-evolve"
title = "How Populations Evolve"
lab = "lab-13_how-populations-evolve.md"
topics = ["Allele frequencies as the unit of change", "Sources of variation", "Five mechanisms of microevolution", "Genetic drift and selection", "Hardy-Weinberg as a baseline"]
contents = ["Microevolution is change in allele frequencies across generations.", "Mutation creates new variation, while recombination reshuffles existing variation.", "Mutation, gene flow, genetic drift, nonrandom mating, and natural selection can change populations.", "Genetic drift is random and strongest in small populations; selection is nonrandom and tied to fitness.", "Hardy-Weinberg equilibrium is a null model for detecting evolutionary change."]
learning_objectives = ["Define microevolution using allele frequencies.", "Compare the five mechanisms that change allele frequencies.", "Distinguish bottleneck and founder effects.", "Interpret directional, stabilizing, and disruptive selection.", "Use Hardy-Weinberg as a non-evolving baseline."]
study_tips = ["Start with the module's central claim before memorizing vocabulary.", "Use the same-numbered lab as the evidence check for the module.", "Explain one mechanism in words, then redraw it as a simple diagram.", "Answer retrieval questions without notes, then revise with the terms list."]
learning_questions = ["What is an allele frequency?", "How is microevolution measured?", "Which mechanisms can change allele frequencies?", "How does mutation differ from gene flow?", "Why is genetic drift stronger in small populations?", "How do bottleneck and founder effects differ?", "Why is natural selection not random?", "How do directional, stabilizing, and disruptive selection differ?", "What does Hardy-Weinberg equilibrium represent?", "How can a null model help detect evolution?"]

[[terms]]
name = "Allele frequency"
definition = "Proportion of a particular allele in a population."

[[terms]]
name = "Microevolution"
definition = "Allele-frequency change across generations."

[[terms]]
name = "Mutation"
definition = "DNA sequence change that can create new alleles."

[[terms]]
name = "Gene flow"
definition = "Movement of alleles between populations."

[[terms]]
name = "Genetic drift"
definition = "Random allele-frequency change, strongest in small populations."

[[terms]]
name = "Bottleneck effect"
definition = "Drift after a sharp population reduction."

[[terms]]
name = "Founder effect"
definition = "Drift when a new population starts from few individuals."

[[terms]]
name = "Hardy-Weinberg equilibrium"
definition = "Null model for allele frequencies when no evolution occurs."

[[practice_quiz]]
question = "Microevolution is defined as:"
options = ["the origin of entirely new kingdoms of life", "a change in allele frequencies in a population over generations", "a change in a single individual's body", "the extinction of every species"]
answer = "B"
explanation = "Microevolution is a shift in allele frequencies within a population over time."

[[practice_quiz]]
question = "Genetic drift has its strongest effect in:"
options = ["small populations", "very large populations", "populations with no variation", "populations that never reproduce"]
answer = "A"
explanation = "Random sampling changes allele frequencies most strongly when the population is small."

[[practice_quiz]]
question = "A few birds colonize a new island and start a population with limited variation. This reduced variation is due to:"
options = ["natural selection alone", "gene flow between islands", "mutation pressure", "the founder effect"]
answer = "D"
explanation = "The founder effect is genetic drift that occurs when a new population begins from only a few individuals."

[[practice_quiz]]
question = "The Hardy-Weinberg principle is useful mainly because it:"
options = ["proves evolution never happens", "measures average body size", "provides a non-evolving baseline to compare real populations against", "edits alleles directly"]
answer = "C"
explanation = "Hardy-Weinberg describes allele frequencies with no evolution. Deviations from it signal that evolutionary forces are at work."

