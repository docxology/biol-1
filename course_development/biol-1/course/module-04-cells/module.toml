[module]
number = 4
slug = "module-04-cells"
title = "Cells"
lab = "lab-04_liquid-chemistry.md"
topics = ["Cell theory", "Prokaryotic and eukaryotic organization", "Membranes and compartments", "Organelles and division of labor", "Microscopy and evidence"]
contents = ["Cell theory explains cells as the basic units of life and as descendants of existing cells.", "Prokaryotic and eukaryotic cells differ in compartmentalization and internal organization.", "Membranes separate internal conditions from the environment and define organelles.", "Organelles divide cellular work such as energy capture, protein processing, and storage.", "Microscopy turns cell structure into observable evidence."]
learning_objectives = ["State the core claims of cell theory.", "Compare prokaryotic and eukaryotic cells using structure and scale.", "Explain how membranes and compartments support cell function.", "Match major organelles to their roles.", "Use microscope evidence to support claims about cells."]
study_tips = ["Start with the module's central claim before memorizing vocabulary.", "Use the same-numbered lab as the evidence check for the module.", "Explain one mechanism in words, then redraw it as a simple diagram.", "Answer retrieval questions without notes, then revise with the terms list."]
learning_questions = ["What does cell theory claim?", "How does a prokaryotic cell differ from a eukaryotic cell?", "Why does cell size matter for exchange with the environment?", "How do membranes create useful boundaries?", "What roles do nucleus, mitochondria, and chloroplasts play?", "How do ribosomes connect to protein production?", "What evidence can microscopy provide?", "Why are organelles a division of labor?", "How are structure and function connected inside cells?", "What observation would support a claim that a specimen is cellular?"]

[[terms]]
name = "Cell theory"
definition = "Principle that organisms are made of cells and cells come from cells."

[[terms]]
name = "Prokaryote"
definition = "Cell without a membrane-bound nucleus."

[[terms]]
name = "Eukaryote"
definition = "Cell with a membrane-bound nucleus and organelles."

[[terms]]
name = "Organelle"
definition = "Specialized cell structure with a particular job."

[[terms]]
name = "Nucleus"
definition = "Eukaryotic compartment that stores DNA."

[[terms]]
name = "Mitochondrion"
definition = "Organelle central to aerobic energy harvesting."

[[terms]]
name = "Chloroplast"
definition = "Plant and algal organelle that performs photosynthesis."

[[terms]]
name = "Microscopy"
definition = "Use of lenses or imaging tools to observe small structures."

[[practice_quiz]]
question = "Which statement is part of cell theory?"
options = ["Cells arise only from nonliving matter.", "All organisms are made of cells, and cells come from existing cells.", "Cells are larger than the organisms they build.", "Only animals are made of cells."]
answer = "B"
explanation = "Cell theory states that organisms are made of cells and that cells arise from pre-existing cells."

[[practice_quiz]]
question = "What is the clearest structural difference between a prokaryotic and a eukaryotic cell?"
options = ["Only prokaryotes contain DNA.", "Only eukaryotes are alive.", "Prokaryotes are always larger.", "Eukaryotes have a membrane-bound nucleus; prokaryotes do not."]
answer = "D"
explanation = "The defining feature is the membrane-bound nucleus (and other organelles) found in eukaryotes but not prokaryotes."

[[practice_quiz]]
question = "A cell is packed with mitochondria. This most likely means the cell:"
options = ["has a high demand for usable energy", "does not use any energy", "performs only photosynthesis", "contains no DNA"]
answer = "A"
explanation = "Mitochondria harvest usable energy, so energy-hungry cells such as muscle cells contain many of them."

[[practice_quiz]]
question = "Which structure would you find in a plant cell but not an animal cell?"
options = ["Nucleus", "Mitochondrion", "Chloroplast", "Cell membrane"]
answer = "C"
explanation = "Chloroplasts carry out photosynthesis and are found in plants and algae, not in animal cells."

