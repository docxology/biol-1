  <text x="802.0" y="228.0" class="mini-text"><tspan x="802.0" dy="0">• Use atomic structure to explain</tspan><tspan x="802.0" dy="13">basic bonding patterns.</tspan></text><text x="802.0" y="254.0" class="mini-text"><tspan x="802.0" dy="0">• Distinguish covalent, ionic, and</tspan><tspan x="802.0" dy="13">hydrogen bonding in biological...</tspan></text><text x="802.0" y="280.0" class="mini-text"><tspan x="802.0" dy="0">• Track atoms through a simple</tspan><tspan x="802.0" dy="13">chemical reaction.</tspan></text>
