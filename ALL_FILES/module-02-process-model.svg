<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Module 02: Basic Chemistry Reasoning Sequence">
  <title>Module 02: Basic Chemistry Reasoning Sequence</title>
