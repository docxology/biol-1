  <g class="stage-card"><rect x="84.0" y="324.0" width="188" height="174" rx="24" class="stage-card-bg" /><circle cx="112.0" cy="354.0" r="18" class="stage-dot" /><text x="112.0" y="360.0" class="stage-num" text-anchor="middle">1</text><text x="100.0" y="390.0" class="stage-label"><tspan x="100.0" dy="0">Atoms and elements</tspan></text><text x="100.0" y="432.0" class="stage-detail"><tspan x="100.0" dy="0">Atoms form elements, and their</tspan><tspan x="100.0" dy="13">electrons shape bonding behavior.</tspan></text></g><g class="stage-card"><rect x="294.0" y="324.0" width="188" height="174" rx="24" class="stage-card-bg" /><circle cx="322.0" cy="354.0" r="18" class="stage-dot" /><text x="322.0" y="360.0" class="stage-num" text-anchor="middle">2</text><text x="310.0" y="390.0" class="stage-label"><tspan x="310.0" dy="0">Bonding and molecular</tspan><tspan x="310.0" dy="17">shape</tspan></text><text x="310.0" y="432.0" class="stage-detail"><tspan x="310.0" dy="0">Covalent, ionic, and hydrogen</tspan><tspan x="310.0" dy="13">bonds create different molecular</tspan><tspan x="310.0" dy="13">properties.</tspan></text></g><g class="stage-card"><rect x="504.0" y="324.0" width="188" height="174" rx="24" class="stage-card-bg" /><circle cx="532.0" cy="354.0" r="18" class="stage-dot" /><text x="532.0" y="360.0" class="stage-num" text-anchor="middle">3</text><text x="520.0" y="390.0" class="stage-label"><tspan x="520.0" dy="0">Water as a biological</tspan><tspan x="520.0" dy="17">solvent</tspan></text><text x="520.0" y="432.0" class="stage-detail"><tspan x="520.0" dy="0">Water polarity explains cohesion,</tspan><tspan x="520.0" dy="13">temperature buffering, and</tspan><tspan x="520.0" dy="13">dissolving ions or polar...</tspan></text></g><g class="stage-card"><rect x="714.0" y="324.0" width="188" height="174" rx="24" class="stage-card-bg" /><circle cx="742.0" cy="354.0" r="18" class="stage-dot" /><text x="742.0" y="360.0" class="stage-num" text-anchor="middle">4</text><text x="730.0" y="390.0" class="stage-label"><tspan x="730.0" dy="0">pH and chemical balance</tspan></text><text x="730.0" y="432.0" class="stage-detail"><tspan x="730.0" dy="0">pH tracks hydrogen ion</tspan><tspan x="730.0" dy="13">concentration and affects</tspan><tspan x="730.0" dy="13">biological molecules.</tspan></text></g><g class="stage-card"><rect x="924.0" y="324.0" width="188" height="174" rx="24" class="stage-card-bg" /><circle cx="952.0" cy="354.0" r="18" class="stage-dot" /><text x="952.0" y="360.0" class="stage-num" text-anchor="middle">5</text><text x="940.0" y="390.0" class="stage-label"><tspan x="940.0" dy="0">Chemical reactions in</tspan><tspan x="940.0" dy="17">cells</tspan></text><text x="940.0" y="432.0" class="stage-detail"><tspan x="940.0" dy="0">Cells depend on chemical reactions</tspan><tspan x="940.0" dy="13">that rearrange matter without</tspan><tspan x="940.0" dy="13">destroying atoms.</tspan></text></g>
