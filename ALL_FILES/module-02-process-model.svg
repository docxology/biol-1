  <text x="112.0" y="600.0" class="mini-text"><tspan x="112.0" dy="0">lab-02_probability-statistics.md evidence checks</tspan><tspan x="112.0" dy="14">whether students can explain water as a biological</tspan><tspan x="112.0" dy="14">solvent.; Retrieval questions reveal whether terms...</tspan></text>
