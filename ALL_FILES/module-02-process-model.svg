  <text x="644" y="570" class="card-kicker">Constraint</text>
  <text x="644.0" y="600.0" class="mini-text"><tspan x="644.0" dy="0">Chemical formulas alone do not explain biological</tspan><tspan x="644.0" dy="14">function.; Cells depend on chemical reactions that</tspan><tspan x="644.0" dy="14">rearrange matter without destroying atoms.</tspan></text>
