<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Module 02: Basic Chemistry Retrieval and Lab Check">
  <title>Module 02: Basic Chemistry Retrieval and Lab Check</title>
  <desc>Retrieval card for Module 2: Basic Chemistry.</desc>
  <style>
    .bg { fill: #ecf4f2; }
    .halo { fill: url(#wash); opacity: 0.92; }
    .frame { fill: #fbfffd; stroke: #172d35; stroke-width: 3; }
    .eyebrow { fill: #1f7a6d; font: 800 18px Georgia, serif; letter-spacing: 1.5px; text-transform: uppercase; }
    .title-text { fill: #172d35; font: 800 38px Georgia, serif; }
    .footer { fill: #4f6670; font: 16px Georgia, serif; }
    .claim-card, .side-card, .feedback-card, .prompt-card, .routine-card, .stage-card-bg { fill: #fbfffd; stroke: #172d35; stroke-width: 2.5; filter: url(#shadow); }
    .claim-kicker, .card-kicker { fill: #1f7a6d; font: 800 17px Georgia, serif; letter-spacing: 0.8px; text-transform: uppercase; }
    .claim-text { fill: #172d35; font: 700 25px Georgia, serif; }
    .node { fill: #fbfffd; stroke: #b55f24; stroke-width: 3; filter: url(#shadow); }
    .node-claim { stroke: #1f7a6d; }
    .node-mechanism { stroke: #b55f24; }
    .node-evidence { stroke: #567d46; }
    .node-vocabulary { stroke: #8067a9; }
    .node-application { stroke: #b26b2f; }
    .node-revision { stroke: #8a4351; }
    .cluster-pill { stroke: none; opacity: 0.92; }
    .cluster-claim { fill: #1f7a6d; }
    .cluster-mechanism { fill: #b55f24; }
    .cluster-evidence { fill: #6d9c57; }
    .cluster-vocabulary { fill: #9b83c6; }
    .cluster-application { fill: #d28942; }
    .cluster-revision { fill: #b85d70; }
    .cluster-label, .legend-text { fill: white; font: 800 11px Georgia, serif; letter-spacing: 1px; text-transform: uppercase; }
    .node-label { fill: #172d35; font: 800 20px Georgia, serif; }
    .node-detail { fill: #4f6670; font: 14px Georgia, serif; }
    .edge { stroke: #1f7a6d; stroke-width: 4; stroke-linecap: round; opacity: 0.72; marker-end: url(#arrowhead); }
    .edge-label { fill: #1f7a6d; font: 700 12px Georgia, serif; text-anchor: middle; paint-order: stroke; stroke: #ecf4f2; stroke-width: 5; }
    .stage-dot { fill: #b55f24; }
    .stage-num { fill: white; font: 900 18px Georgia, serif; }
    .stage-label { fill: #172d35; font: 800 18px Georgia, serif; }
    .stage-detail, .mini-text, .check-text { fill: #4f6670; font: 15px Georgia, serif; }
    .arrow { fill: none; stroke: #b55f24; stroke-width: 5; stroke-linecap: round; marker-end: url(#arrowhead); }
    .prompt-text { fill: #172d35; font: 700 17px Georgia, serif; }
    .routine-text { fill: #172d35; font: 700 16px Georgia, serif; }
    .retrieval-step-strip { fill: #fbfffd; stroke: #b55f24; stroke-width: 2; opacity: 0.96; }
    .palette-high-design { fill: #1f7a6d; }
    @media print { .claim-card, .side-card, .feedback-card, .prompt-card, .routine-card, .node, .stage-card-bg { filter: none; } }
    </style>
  <defs>
    <linearGradient id="wash" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbfffd" />
      <stop offset="1" stop-color="#b55f24" stop-opacity="0.18" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#172d35" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#b55f24" />
    </marker>
    </defs>
  <rect class="bg" width="1200" height="720" />
  <path class="halo" d="M44 72 H1156 V648 H44 Z" />
  <text x="82" y="92" class="eyebrow">Module 02 / Retrieval Card</text>
  <text x="82.0" y="132.0" class="title-text"><tspan x="82.0" dy="0">Module 02: Basic Chemistry Retrieval and</tspan><tspan x="82.0" dy="32">Lab Check</tspan></text>
  <rect x="82" y="172" width="1026" height="36" rx="18" class="retrieval-step-strip" />
  <text x="120" y="196" class="routine-text">1 Cover notes</text>
  <text x="354" y="196" class="routine-text">2 Answer aloud</text>
  <text x="604" y="196" class="routine-text">3 Cite evidence</text>
  <text x="844" y="196" class="routine-text">4 Revise</text>
  <rect x="860" y="78" width="284" height="82" rx="22" class="routine-card" />
  <text x="884" y="106" class="card-kicker">Routine</text>
  <text x="884.0" y="128.0" class="routine-text"><tspan x="884.0" dy="0">Cover notes -&gt; answer aloud</tspan><tspan x="884.0" dy="14">-&gt; cite evidence -&gt; revise</tspan></text>
  <rect x="92" y="222" width="462" height="124" rx="26" class="prompt-card" /><text x="120" y="260" class="stage-num">Q1</text><text x="120.0" y="288.0" class="prompt-text"><tspan x="120.0" dy="0">How do protons, neutrons, and electrons differ?</tspan></text><text x="120.0" y="334.0" class="check-text"><tspan x="120.0" dy="0">Check: Use atomic structure to explain basic bonding</tspan><tspan x="120.0" dy="13">patterns.</tspan></text><rect x="604" y="222" width="462" height="124" rx="26" class="prompt-card" /><text x="632" y="260" class="stage-num">Q2</text><text x="632.0" y="288.0" class="prompt-text"><tspan x="632.0" dy="0">Why do electrons matter for chemical bonding?</tspan></text><text x="632.0" y="334.0" class="check-text"><tspan x="632.0" dy="0">Check: Distinguish covalent, ionic, and hydrogen bonding in</tspan><tspan x="632.0" dy="13">biological examples.</tspan></text><rect x="92" y="374" width="462" height="124" rx="26" class="prompt-card" /><text x="120" y="412" class="stage-num">Q3</text><text x="120.0" y="440.0" class="prompt-text"><tspan x="120.0" dy="0">What distinguishes covalent, ionic, and hydrogen</tspan><tspan x="120.0" dy="17">bonds?</tspan></text><text x="120.0" y="486.0" class="check-text"><tspan x="120.0" dy="0">Check: Explain why water properties matter for cells and</tspan><tspan x="120.0" dy="13">organisms.</tspan></text><rect x="604" y="374" width="462" height="124" rx="26" class="prompt-card" /><text x="632" y="412" class="stage-num">Q4</text><text x="632.0" y="440.0" class="prompt-text"><tspan x="632.0" dy="0">Why does water dissolve salt but not all nonpolar</tspan><tspan x="632.0" dy="17">molecules?</tspan></text><text x="632.0" y="486.0" class="check-text"><tspan x="632.0" dy="0">Check: Interpret pH as a chemical condition that affects</tspan><tspan x="632.0" dy="13">biology.</tspan></text>
  <rect x="92" y="548" width="462" height="86" rx="24" class="side-card" />
  <text x="120" y="582" class="card-kicker">Terms to use</text>
  <text x="120.0" y="612.0" class="mini-text"><tspan x="120.0" dy="0">Atom, Element, Covalent bond, Ionic bond, Hydrogen</tspan><tspan x="120.0" dy="17">bond</tspan></text>
  <rect x="604" y="548" width="504" height="86" rx="24" class="side-card" />
  <text x="632" y="582" class="card-kicker">Lab connection</text>
  <text x="632.0" y="612.0" class="mini-text"><tspan x="632.0" dy="0">lab-02_probability-statistics.md supplies evidence for</tspan><tspan x="632.0" dy="17">probability, graph reading, and chemical evidence claims.</tspan></text>
  <text x="82" y="672" class="footer">Intro biology routine: claim, evidence, reasoning, revision.</text>
</svg>
