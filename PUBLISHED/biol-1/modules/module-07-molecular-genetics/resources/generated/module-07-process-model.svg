<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Module 07: Molecular Genetics Reasoning Sequence">
  <title>Module 07: Molecular Genetics Reasoning Sequence</title>
  <desc>Process model for Module 7: Molecular Genetics.</desc>
  <style>
    .bg { fill: #f2edf7; }
    .halo { fill: url(#wash); opacity: 0.92; }
    .frame { fill: #fffafd; stroke: #281d34; stroke-width: 3; }
    .eyebrow { fill: #7b4f9d; font: 800 18px Georgia, serif; letter-spacing: 1.5px; text-transform: uppercase; }
    .title-text { fill: #281d34; font: 800 38px Georgia, serif; }
    .footer { fill: #685d72; font: 16px Georgia, serif; }
    .claim-card, .side-card, .feedback-card, .prompt-card, .routine-card, .stage-card-bg { fill: #fffafd; stroke: #281d34; stroke-width: 2.5; filter: url(#shadow); }
    .claim-kicker, .card-kicker { fill: #7b4f9d; font: 800 17px Georgia, serif; letter-spacing: 0.8px; text-transform: uppercase; }
    .claim-text { fill: #281d34; font: 700 25px Georgia, serif; }
    .node { fill: #fffafd; stroke: #b36b2c; stroke-width: 3; filter: url(#shadow); }
    .node-claim { stroke: #7b4f9d; }
    .node-mechanism { stroke: #b36b2c; }
    .node-evidence { stroke: #567d46; }
    .node-vocabulary { stroke: #8067a9; }
    .node-application { stroke: #b26b2f; }
    .node-revision { stroke: #8a4351; }
    .cluster-pill { stroke: none; opacity: 0.92; }
    .cluster-claim { fill: #7b4f9d; }
    .cluster-mechanism { fill: #b36b2c; }
    .cluster-evidence { fill: #6d9c57; }
    .cluster-vocabulary { fill: #9b83c6; }
    .cluster-application { fill: #d28942; }
    .cluster-revision { fill: #b85d70; }
    .cluster-label, .legend-text { fill: white; font: 800 11px Georgia, serif; letter-spacing: 1px; text-transform: uppercase; }
    .node-label { fill: #281d34; font: 800 20px Georgia, serif; }
    .node-detail { fill: #685d72; font: 14px Georgia, serif; }
    .edge { stroke: #7b4f9d; stroke-width: 4; stroke-linecap: round; opacity: 0.72; marker-end: url(#arrowhead); }
    .edge-label { fill: #7b4f9d; font: 700 12px Georgia, serif; text-anchor: middle; paint-order: stroke; stroke: #f2edf7; stroke-width: 5; }
    .stage-dot { fill: #b36b2c; }
    .stage-num { fill: white; font: 900 18px Georgia, serif; }
    .stage-label { fill: #281d34; font: 800 18px Georgia, serif; }
    .stage-detail, .mini-text, .check-text { fill: #685d72; font: 15px Georgia, serif; }
    .arrow { fill: none; stroke: #b36b2c; stroke-width: 5; stroke-linecap: round; marker-end: url(#arrowhead); }
    .prompt-text { fill: #281d34; font: 700 17px Georgia, serif; }
    .routine-text { fill: #281d34; font: 700 16px Georgia, serif; }
    .retrieval-step-strip { fill: #fffafd; stroke: #b36b2c; stroke-width: 2; opacity: 0.96; }
    .palette-high-design { fill: #7b4f9d; }
    @media print { .claim-card, .side-card, .feedback-card, .prompt-card, .routine-card, .node, .stage-card-bg { filter: none; } }
    </style>
  <defs>
    <linearGradient id="wash" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffafd" />
      <stop offset="1" stop-color="#b36b2c" stop-opacity="0.18" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#281d34" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#b36b2c" />
    </marker>
    </defs>
  <rect class="bg" width="1200" height="720" />
  <rect x="48" y="48" width="1104" height="624" rx="42" class="frame" />
  <text x="84" y="100" class="eyebrow">Module 07 / Process Model</text>
  <text x="84.0" y="142.0" class="title-text"><tspan x="84.0" dy="0">Module 07: Molecular Genetics Reasoning Sequence</tspan></text>
  <rect x="84" y="178" width="340" height="112" rx="24" class="side-card" />
  <text x="110" y="206" class="card-kicker">Inputs</text>
  <text x="110.0" y="228.0" class="mini-text"><tspan x="110.0" dy="0">• DNA structure</tspan></text><text x="110.0" y="241.0" class="mini-text"><tspan x="110.0" dy="0">• Replication</tspan></text><text x="110.0" y="254.0" class="mini-text"><tspan x="110.0" dy="0">• Evidence from</tspan><tspan x="110.0" dy="13">lab-07_molecular-genetics.md</tspan></text>
  <rect x="776" y="178" width="340" height="112" rx="24" class="side-card" />
  <text x="802" y="206" class="card-kicker">Outputs</text>
  <text x="802.0" y="228.0" class="mini-text"><tspan x="802.0" dy="0">• Describe DNA structure and</tspan><tspan x="802.0" dy="13">base-pairing rules.</tspan></text><text x="802.0" y="254.0" class="mini-text"><tspan x="802.0" dy="0">• Explain why DNA replication is</tspan><tspan x="802.0" dy="13">semiconservative.</tspan></text><text x="802.0" y="280.0" class="mini-text"><tspan x="802.0" dy="0">• Explain how mutation can alter</tspan><tspan x="802.0" dy="13">protein and trait outcomes.</tspan></text>
  <text x="84" y="306" class="card-kicker">Reasoning sequence</text>
  <path d="M 276.0 411.0 L 290.0 411.0" class="arrow" /><path d="M 486.0 411.0 L 500.0 411.0" class="arrow" /><path d="M 696.0 411.0 L 710.0 411.0" class="arrow" /><path d="M 906.0 411.0 L 920.0 411.0" class="arrow" />
  <g class="stage-card"><rect x="84.0" y="324.0" width="188" height="174" rx="24" class="stage-card-bg" /><circle cx="112.0" cy="354.0" r="18" class="stage-dot" /><text x="112.0" y="360.0" class="stage-num" text-anchor="middle">1</text><text x="100.0" y="390.0" class="stage-label"><tspan x="100.0" dy="0">DNA structure</tspan></text><text x="100.0" y="432.0" class="stage-detail"><tspan x="100.0" dy="0">DNA stores information in</tspan><tspan x="100.0" dy="13">nucleotide sequences and</tspan><tspan x="100.0" dy="13">complementary base pairing.</tspan></text></g><g class="stage-card"><rect x="294.0" y="324.0" width="188" height="174" rx="24" class="stage-card-bg" /><circle cx="322.0" cy="354.0" r="18" class="stage-dot" /><text x="322.0" y="360.0" class="stage-num" text-anchor="middle">2</text><text x="310.0" y="390.0" class="stage-label"><tspan x="310.0" dy="0">Replication</tspan></text><text x="310.0" y="432.0" class="stage-detail"><tspan x="310.0" dy="0">Replication copies DNA using each</tspan><tspan x="310.0" dy="13">strand as a template.</tspan></text></g><g class="stage-card"><rect x="504.0" y="324.0" width="188" height="174" rx="24" class="stage-card-bg" /><circle cx="532.0" cy="354.0" r="18" class="stage-dot" /><text x="532.0" y="360.0" class="stage-num" text-anchor="middle">3</text><text x="520.0" y="390.0" class="stage-label"><tspan x="520.0" dy="0">Transcription</tspan></text><text x="520.0" y="432.0" class="stage-detail"><tspan x="520.0" dy="0">Transcription produces RNA from a</tspan><tspan x="520.0" dy="13">DNA gene.</tspan></text></g><g class="stage-card"><rect x="714.0" y="324.0" width="188" height="174" rx="24" class="stage-card-bg" /><circle cx="742.0" cy="354.0" r="18" class="stage-dot" /><text x="742.0" y="360.0" class="stage-num" text-anchor="middle">4</text><text x="730.0" y="390.0" class="stage-label"><tspan x="730.0" dy="0">Translation</tspan></text><text x="730.0" y="432.0" class="stage-detail"><tspan x="730.0" dy="0">Translation uses mRNA codons and</tspan><tspan x="730.0" dy="13">ribosomes to build proteins.</tspan></text></g><g class="stage-card"><rect x="924.0" y="324.0" width="188" height="174" rx="24" class="stage-card-bg" /><circle cx="952.0" cy="354.0" r="18" class="stage-dot" /><text x="952.0" y="360.0" class="stage-num" text-anchor="middle">5</text><text x="940.0" y="390.0" class="stage-label"><tspan x="940.0" dy="0">Mutation and gene</tspan><tspan x="940.0" dy="17">expression evidence</tspan></text><text x="940.0" y="432.0" class="stage-detail"><tspan x="940.0" dy="0">Mutations and expression patterns</tspan><tspan x="940.0" dy="13">connect molecular changes to</tspan><tspan x="940.0" dy="13">traits.</tspan></text></g>
  <rect x="84" y="538" width="500" height="94" rx="22" class="feedback-card" />
  <text x="112" y="570" class="card-kicker">Feedback</text>
  <text x="112.0" y="600.0" class="mini-text"><tspan x="112.0" dy="0">lab-07_molecular-genetics.md evidence checks</tspan><tspan x="112.0" dy="14">whether students can explain transcription.;</tspan><tspan x="112.0" dy="14">Retrieval questions reveal whether terms are...</tspan></text>
  <rect x="616" y="538" width="500" height="94" rx="22" class="feedback-card" />
  <text x="644" y="570" class="card-kicker">Constraint</text>
  <text x="644.0" y="600.0" class="mini-text"><tspan x="644.0" dy="0">A gene does not directly become a trait without</tspan><tspan x="644.0" dy="14">expression steps.; Mutations and expression</tspan><tspan x="644.0" dy="14">patterns connect molecular changes to traits.</tspan></text>
  <text x="84" y="668" class="footer">Linked lab: lab-07_molecular-genetics.md</text>
</svg>
