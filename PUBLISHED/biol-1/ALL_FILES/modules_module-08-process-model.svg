<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Module 08: Cellular Genetics Reasoning Sequence">
  <title>Module 08: Cellular Genetics Reasoning Sequence</title>
  <desc>Process model for Module 8: Cellular Genetics.</desc>
  <style>
    .bg { fill: #f4f1e6; }
    .halo { fill: url(#wash); opacity: 0.92; }
    .frame { fill: #fffdf5; stroke: #2c2517; stroke-width: 3; }
    .eyebrow { fill: #9b3f2f; font: 800 18px Georgia, serif; letter-spacing: 1.5px; text-transform: uppercase; }
    .title-text { fill: #2c2517; font: 800 38px Georgia, serif; }
    .footer { fill: #6a614d; font: 16px Georgia, serif; }
    .claim-card, .side-card, .feedback-card, .prompt-card, .routine-card, .stage-card-bg { fill: #fffdf5; stroke: #2c2517; stroke-width: 2.5; filter: url(#shadow); }
    .claim-kicker, .card-kicker { fill: #9b3f2f; font: 800 17px Georgia, serif; letter-spacing: 0.8px; text-transform: uppercase; }
    .claim-text { fill: #2c2517; font: 700 25px Georgia, serif; }
    .node { fill: #fffdf5; stroke: #2f6f4e; stroke-width: 3; filter: url(#shadow); }
    .node-claim { stroke: #9b3f2f; }
    .node-mechanism { stroke: #2f6f4e; }
    .node-evidence { stroke: #567d46; }
    .node-vocabulary { stroke: #8067a9; }
    .node-application { stroke: #b26b2f; }
    .node-revision { stroke: #8a4351; }
    .cluster-pill { stroke: none; opacity: 0.92; }
    .cluster-claim { fill: #9b3f2f; }
    .cluster-mechanism { fill: #2f6f4e; }
    .cluster-evidence { fill: #6d9c57; }
    .cluster-vocabulary { fill: #9b83c6; }
    .cluster-application { fill: #d28942; }
    .cluster-revision { fill: #b85d70; }
    .cluster-label, .legend-text { fill: white; font: 800 11px Georgia, serif; letter-spacing: 1px; text-transform: uppercase; }
    .node-label { fill: #2c2517; font: 800 20px Georgia, serif; }
    .node-detail { fill: #6a614d; font: 14px Georgia, serif; }
    .edge { stroke: #9b3f2f; stroke-width: 4; stroke-linecap: round; opacity: 0.72; marker-end: url(#arrowhead); }
    .edge-label { fill: #9b3f2f; font: 700 12px Georgia, serif; text-anchor: middle; paint-order: stroke; stroke: #f4f1e6; stroke-width: 5; }
    .stage-dot { fill: #2f6f4e; }
    .stage-num { fill: white; font: 900 18px Georgia, serif; }
    .stage-label { fill: #2c2517; font: 800 18px Georgia, serif; }
    .stage-detail, .mini-text, .check-text { fill: #6a614d; font: 15px Georgia, serif; }
    .arrow { fill: none; stroke: #2f6f4e; stroke-width: 5; stroke-linecap: round; marker-end: url(#arrowhead); }
    .prompt-text { fill: #2c2517; font: 700 17px Georgia, serif; }
    .routine-text { fill: #2c2517; font: 700 16px Georgia, serif; }
    .retrieval-step-strip { fill: #fffdf5; stroke: #2f6f4e; stroke-width: 2; opacity: 0.96; }
    .palette-high-design { fill: #9b3f2f; }
    @media print { .claim-card, .side-card, .feedback-card, .prompt-card, .routine-card, .node, .stage-card-bg { filter: none; } }
    </style>
  <defs>
    <linearGradient id="wash" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf5" />
      <stop offset="1" stop-color="#2f6f4e" stop-opacity="0.18" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#2c2517" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#2f6f4e" />
    </marker>
    </defs>
  <rect class="bg" width="1200" height="720" />
  <rect x="48" y="48" width="1104" height="624" rx="42" class="frame" />
  <text x="84" y="100" class="eyebrow">Module 08 / Process Model</text>
  <text x="84.0" y="142.0" class="title-text"><tspan x="84.0" dy="0">Module 08: Cellular Genetics Reasoning Sequence</tspan></text>
  <rect x="84" y="178" width="340" height="112" rx="24" class="side-card" />
  <text x="110" y="206" class="card-kicker">Inputs</text>
  <text x="110.0" y="228.0" class="mini-text"><tspan x="110.0" dy="0">• Chromosomes and cell cycle</tspan></text><text x="110.0" y="241.0" class="mini-text"><tspan x="110.0" dy="0">• Mitosis for growth and repair</tspan></text><text x="110.0" y="254.0" class="mini-text"><tspan x="110.0" dy="0">• Evidence from</tspan><tspan x="110.0" dy="13">lab-08_cellular-genetics.md</tspan></text>
  <rect x="776" y="178" width="340" height="112" rx="24" class="side-card" />
  <text x="802" y="206" class="card-kicker">Outputs</text>
  <text x="802.0" y="228.0" class="mini-text"><tspan x="802.0" dy="0">• Relate chromosomes to DNA</tspan><tspan x="802.0" dy="13">organization.</tspan></text><text x="802.0" y="254.0" class="mini-text"><tspan x="802.0" dy="0">• Compare the purpose and products</tspan><tspan x="802.0" dy="13">of mitosis and meiosis.</tspan></text><text x="802.0" y="280.0" class="mini-text"><tspan x="802.0" dy="0">• Interpret chromosome number errors</tspan><tspan x="802.0" dy="13">at an introductory level.</tspan></text>
  <text x="84" y="306" class="card-kicker">Reasoning sequence</text>
  <path d="M 276.0 411.0 L 290.0 411.0" class="arrow" /><path d="M 486.0 411.0 L 500.0 411.0" class="arrow" /><path d="M 696.0 411.0 L 710.0 411.0" class="arrow" /><path d="M 906.0 411.0 L 920.0 411.0" class="arrow" />
  <g class="stage-card"><rect x="84.0" y="324.0" width="188" height="174" rx="24" class="stage-card-bg" /><circle cx="112.0" cy="354.0" r="18" class="stage-dot" /><text x="112.0" y="360.0" class="stage-num" text-anchor="middle">1</text><text x="100.0" y="390.0" class="stage-label"><tspan x="100.0" dy="0">Chromosomes and cell cycle</tspan></text><text x="100.0" y="432.0" class="stage-detail"><tspan x="100.0" dy="0">Chromosomes organize DNA so cells</tspan><tspan x="100.0" dy="13">can divide accurately.</tspan></text></g><g class="stage-card"><rect x="294.0" y="324.0" width="188" height="174" rx="24" class="stage-card-bg" /><circle cx="322.0" cy="354.0" r="18" class="stage-dot" /><text x="322.0" y="360.0" class="stage-num" text-anchor="middle">2</text><text x="310.0" y="390.0" class="stage-label"><tspan x="310.0" dy="0">Mitosis for growth and</tspan><tspan x="310.0" dy="17">repair</tspan></text><text x="310.0" y="432.0" class="stage-detail"><tspan x="310.0" dy="0">Mitosis produces genetically</tspan><tspan x="310.0" dy="13">identical daughter cells for</tspan><tspan x="310.0" dy="13">growth and repair.</tspan></text></g><g class="stage-card"><rect x="504.0" y="324.0" width="188" height="174" rx="24" class="stage-card-bg" /><circle cx="532.0" cy="354.0" r="18" class="stage-dot" /><text x="532.0" y="360.0" class="stage-num" text-anchor="middle">3</text><text x="520.0" y="390.0" class="stage-label"><tspan x="520.0" dy="0">Meiosis for gametes</tspan></text><text x="520.0" y="432.0" class="stage-detail"><tspan x="520.0" dy="0">Meiosis produces haploid gametes</tspan><tspan x="520.0" dy="13">for sexual reproduction.</tspan></text></g><g class="stage-card"><rect x="714.0" y="324.0" width="188" height="174" rx="24" class="stage-card-bg" /><circle cx="742.0" cy="354.0" r="18" class="stage-dot" /><text x="742.0" y="360.0" class="stage-num" text-anchor="middle">4</text><text x="730.0" y="390.0" class="stage-label"><tspan x="730.0" dy="0">Variation from</tspan><tspan x="730.0" dy="17">recombination and...</tspan></text><text x="730.0" y="432.0" class="stage-detail"><tspan x="730.0" dy="0">Crossing over and independent</tspan><tspan x="730.0" dy="13">assortment create genetic</tspan><tspan x="730.0" dy="13">variation.</tspan></text></g><g class="stage-card"><rect x="924.0" y="324.0" width="188" height="174" rx="24" class="stage-card-bg" /><circle cx="952.0" cy="354.0" r="18" class="stage-dot" /><text x="952.0" y="360.0" class="stage-num" text-anchor="middle">5</text><text x="940.0" y="390.0" class="stage-label"><tspan x="940.0" dy="0">Errors and genetic</tspan><tspan x="940.0" dy="17">consequences</tspan></text><text x="940.0" y="432.0" class="stage-detail"><tspan x="940.0" dy="0">Nondisjunction and other errors</tspan><tspan x="940.0" dy="13">can change chromosome number.</tspan></text></g>
  <rect x="84" y="538" width="500" height="94" rx="22" class="feedback-card" />
  <text x="112" y="570" class="card-kicker">Feedback</text>
  <text x="112.0" y="600.0" class="mini-text"><tspan x="112.0" dy="0">lab-08_cellular-genetics.md evidence checks</tspan><tspan x="112.0" dy="14">whether students can explain meiosis for gametes.;</tspan><tspan x="112.0" dy="14">Retrieval questions reveal whether terms are...</tspan></text>
  <rect x="616" y="538" width="500" height="94" rx="22" class="feedback-card" />
  <text x="644" y="570" class="card-kicker">Constraint</text>
  <text x="644.0" y="600.0" class="mini-text"><tspan x="644.0" dy="0">Mitosis and meiosis are not interchangeable</tspan><tspan x="644.0" dy="14">cell-division processes.; Nondisjunction and other</tspan><tspan x="644.0" dy="14">errors can change chromosome number.</tspan></text>
  <text x="84" y="668" class="footer">Linked lab: lab-08_cellular-genetics.md</text>
</svg>
