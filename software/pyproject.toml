[project]
name = "cr-bio-software"
version = "0.1.0"
description = "Course management utilities for Biology courses at College of the Redwoods"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Markdown parsing — 3.5+ for toc extension and table parsing fixes
    "markdown>=3.5.0",
    # markdown2 — 2.5+ for fenced code blocks and table support
    "markdown2>=2.5.0",
    # WeasyPrint — 60.0+ for Python 3.11+ and improved CSS Paged Media
    "weasyprint>=60.0",
    # requests — 2.31+ for urllib3 2.x and security patches
    "requests>=2.31.0",
    # SpeechRecognition — 3.10+ for Python 3.11 compatibility
    "speechrecognition>=3.10.0",
    # pydub — audio manipulation for speech-to-text workflows
    "pydub>=0.25.1",
    # pypdf — 4.0+ for Python 3.11 and improved PDF text extraction
    "pypdf>=4.0.0",
    # python-docx — 1.1+ for table cell merging and improved style handling
    "python-docx>=1.1.0",
    # gTTS — 2.5+ for Python 3.11 compatibility (audio fallback)
    "gtts>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
    "ruff>=0.1.6",
    "types-Markdown>=3.5.0",
    "types-requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"src/py.typed" = "py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=90",
    "-v",
    "-W",
    "ignore::DeprecationWarning:speech_recognition",
]
filterwarnings = [
    "ignore::DeprecationWarning:speech_recognition",
]
markers = [
    "requires_internet: marks tests that require internet connection (deselect with '-m \"not requires_internet\"')",
    "requires_api: marks tests that require external API access",
    "audio: marks tests that invoke local audio/TTS tools such as say or ffmpeg",
    "slow: marks tests that are intentionally slower than the default local gate",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
disable_error_code = [
    "arg-type",
    "attr-defined",
    "index",
    "operator",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/test_canvas_integration_main.py" = ["E402"]
