# Canonical BIOL-1 LectureCreate render contract.
# Keep the renderer's palette, typeface, geometry, and motion reproducible across hosts.
theme:
  background: "#0d1b2a"
  surface: "#16263a"
  text: "#eef2f7"
  muted: "#b7c7d8"
  accent: "#ffb703"
  accent2: "#4cc9f0"
  good: "#80ed99"
  font: "DejaVu Sans"
  mono_font: "DejaVu Sans Mono"
video:
  width: 1920
  height: 1080
  crf: 16
  preset: "medium"
  pixel_format: "yuv420p"
animation:
  enabled: true
  fps: 30
  kenburns: false
  waveform: false
  reveal: true
  progress: true
  transition: "crossfade"
  transition_ms: 450
  text_halo: true
  phase_stills: 28
audio:
  lead_silence_ms: 400
  gap_ms: 750
  trail_silence_ms: 400
  fade_ms: 40
  normalize: true
layout: "standard"
