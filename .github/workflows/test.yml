name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (WeasyPrint + audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf2.0-0 libffi-dev shared-mime-info ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        # Excludes tests marked `audio` (require a local TTS/say binary not
        # available on CI runners) and `requires_internet` (hit external
        # services). See software/pyproject.toml [tool.pytest.ini_options]
        # markers and software/docs/architecture/TESTING_STRATEGY.md for the
        # marker contract.
        run: uv run pytest -q -m "not audio and not requires_internet"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy type check
        run: uv run mypy src

      - name: Validate repo contracts
        run: uv run python scripts/validate_repo_contracts.py
