    .edge-label { fill: #1f7a6d; font: 700 13px Georgia, serif; text-anchor: middle; paint-order: stroke; stroke: #ecf4f2; stroke-width: 4; }
    .stage-dot { fill: #b55f24; }
    .stage-num { fill: white; font: 900 18px Georgia, serif; }
    .stage-label { fill: #172d35; font: 800 18px Georgia, serif; }
