  <text x="720" y="134" class="routine-text">Cover notes -> answer aloud -> cite evidence -> revise</text>
  <rect x="92" y="216" width="462" height="124" rx="26" class="prompt-card" /><text x="120" y="254" class="stage-num">Q1</text><text x="120.0" y="282.0" class="prompt-text"><tspan x="120.0" dy="0">How do the laws of thermodynamics constrain</tspan><tspan x="120.0" dy="17">cells?</tspan></text><text x="120.0" y="328.0" class="check-text"><tspan x="120.0" dy="0">Check: Apply thermodynamic ideas to living cells.</tspan></text><rect x="604" y="216" width="462" height="124" rx="26" class="prompt-card" /><text x="632" y="254" class="stage-num">Q2</text><text x="632.0" y="282.0" class="prompt-text"><tspan x="632.0" dy="0">Why is ATP useful for cellular work?</tspan></text><text x="632.0" y="328.0" class="check-text"><tspan x="632.0" dy="0">Check: Explain ATP as an energy-coupling molecule.</tspan></text><rect x="92" y="370" width="462" height="124" rx="26" class="prompt-card" /><text x="120" y="408" class="stage-num">Q3</text><text x="120.0" y="436.0" class="prompt-text"><tspan x="120.0" dy="0">How do enzymes lower activation energy?</tspan></text><text x="120.0" y="482.0" class="check-text"><tspan x="120.0" dy="0">Check: Describe how enzymes change reaction rates.</tspan></text><rect x="604" y="370" width="462" height="124" rx="26" class="prompt-card" /><text x="632" y="408" class="stage-num">Q4</text><text x="632.0" y="436.0" class="prompt-text"><tspan x="632.0" dy="0">Why does enzyme shape matter?</tspan></text><text x="632.0" y="482.0" class="check-text"><tspan x="632.0" dy="0">Check: Predict how environmental conditions affect...</tspan></text>
  <rect x="92" y="548" width="462" height="86" rx="24" class="side-card" />
  <text x="120" y="582" class="card-kicker">Terms to use</text>
  <text x="120.0" y="612.0" class="mini-text"><tspan x="120.0" dy="0">Metabolism, ATP, Activation energy, Enzyme, Substrate</tspan></text>
  <rect x="604" y="548" width="504" height="86" rx="24" class="side-card" />
  <text x="632" y="582" class="card-kicker">Lab connection</text>
  <text x="632.0" y="612.0" class="mini-text"><tspan x="632.0" dy="0">lab-06_metabolism.md supplies evidence for reaction-rate</tspan><tspan x="632.0" dy="17">shifts under temperature, pH, and substrate changes.</tspan></text>
  <text x="82" y="672" class="footer">Intro biology routine: claim, evidence, reasoning, revision.</text>
