    .arrow { fill: none; stroke: #b55f24; stroke-width: 5; stroke-linecap: round; marker-end: url(#arrowhead); }
    .prompt-text { fill: #172d35; font: 700 17px Georgia, serif; }
    .routine-text { fill: #172d35; font: 700 16px Georgia, serif; }
    .retrieval-step-strip { fill: #fbfffd; stroke: #b55f24; stroke-width: 2; opacity: 0.96; }
    .palette-high-design { fill: #1f7a6d; }
    @media print { .claim-card, .side-card, .feedback-card, .prompt-card, .routine-card, .node, .stage-card-bg { filter: none; } }
    </style>
