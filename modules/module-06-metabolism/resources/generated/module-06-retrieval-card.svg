<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Module 06: Metabolism Retrieval and Lab Check">
  <title>Module 06: Metabolism Retrieval and Lab Check</title>
  <desc>Retrieval card for Module 6: Metabolism.</desc>
  <style>
    .bg { fill: #ecf4f2; }
    .halo { fill: url(#wash); opacity: 0.92; }
