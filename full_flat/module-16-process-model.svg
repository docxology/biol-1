  <g class="stage-card"><rect x="84.0" y="324.0" width="188" height="174" rx="24" class="stage-card-bg" /><circle cx="112.0" cy="354.0" r="18" class="stage-dot" /><text x="112.0" y="360.0" class="stage-num" text-anchor="middle">1</text><text x="100.0" y="390.0" class="stage-label"><tspan x="100.0" dy="0">Biology across scales</tspan></text><text x="100.0" y="432.0" class="stage-detail"><tspan x="100.0" dy="0">Biological explanations become</tspan><tspan x="100.0" dy="13">stronger when they connect</tspan><tspan x="100.0" dy="13">molecules, cells, organisms...</tspan></text></g><g class="stage-card"><rect x="294.0" y="324.0" width="188" height="174" rx="24" class="stage-card-bg" /><circle cx="322.0" cy="354.0" r="18" class="stage-dot" /><text x="322.0" y="360.0" class="stage-num" text-anchor="middle">2</text><text x="310.0" y="390.0" class="stage-label"><tspan x="310.0" dy="0">Mechanism chains</tspan></text><text x="310.0" y="432.0" class="stage-detail"><tspan x="310.0" dy="0">Mechanism chains show how one</tspan><tspan x="310.0" dy="13">change can produce effects across</tspan><tspan x="310.0" dy="13">scales.</tspan></text></g><g class="stage-card"><rect x="504.0" y="324.0" width="188" height="174" rx="24" class="stage-card-bg" /><circle cx="532.0" cy="354.0" r="18" class="stage-dot" /><text x="532.0" y="360.0" class="stage-num" text-anchor="middle">3</text><text x="520.0" y="390.0" class="stage-label"><tspan x="520.0" dy="0">Feedback and constraint</tspan></text><text x="520.0" y="432.0" class="stage-detail"><tspan x="520.0" dy="0">Feedback loops and constraints</tspan><tspan x="520.0" dy="13">explain why biological systems do</tspan><tspan x="520.0" dy="13">not change without limits.</tspan></text></g><g class="stage-card"><rect x="714.0" y="324.0" width="188" height="174" rx="24" class="stage-card-bg" /><circle cx="742.0" cy="354.0" r="18" class="stage-dot" /><text x="742.0" y="360.0" class="stage-num" text-anchor="middle">4</text><text x="730.0" y="390.0" class="stage-label"><tspan x="730.0" dy="0">Evidence from multiple</tspan><tspan x="730.0" dy="17">modules</tspan></text><text x="730.0" y="432.0" class="stage-detail"><tspan x="730.0" dy="0">Evidence from labs, models, and</tspan><tspan x="730.0" dy="13">observations must match the scale</tspan><tspan x="730.0" dy="13">of the claim.</tspan></text></g><g class="stage-card"><rect x="924.0" y="324.0" width="188" height="174" rx="24" class="stage-card-bg" /><circle cx="952.0" cy="354.0" r="18" class="stage-dot" /><text x="952.0" y="360.0" class="stage-num" text-anchor="middle">5</text><text x="940.0" y="390.0" class="stage-label"><tspan x="940.0" dy="0">Capstone explanation and</tspan><tspan x="940.0" dy="17">revision</tspan></text><text x="940.0" y="432.0" class="stage-detail"><tspan x="940.0" dy="0">Capstone reasoning combines</tspan><tspan x="940.0" dy="13">concepts into a clear claim that</tspan><tspan x="940.0" dy="13">can be tested and revised.</tspan></text></g>
  <rect x="84" y="538" width="500" height="94" rx="22" class="feedback-card" />
