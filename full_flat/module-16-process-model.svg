  <text x="112.0" y="600.0" class="mini-text"><tspan x="112.0" dy="0">lab-16_capstone-systems-synthesis.md evidence</tspan><tspan x="112.0" dy="14">checks whether students can explain feedback and</tspan><tspan x="112.0" dy="14">constraint.; Retrieval questions reveal whether...</tspan></text>
