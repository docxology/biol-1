  <text x="110" y="206" class="card-kicker">Inputs</text>
  <text x="110.0" y="228.0" class="mini-text"><tspan x="110.0" dy="0">• Biology across scales</tspan></text><text x="110.0" y="241.0" class="mini-text"><tspan x="110.0" dy="0">• Mechanism chains</tspan></text><text x="110.0" y="254.0" class="mini-text"><tspan x="110.0" dy="0">• Evidence from</tspan><tspan x="110.0" dy="13">lab-16_capstone-systems-synthesis.md</tspan></text>
  <rect x="776" y="178" width="340" height="112" rx="24" class="side-card" />
  <text x="802" y="206" class="card-kicker">Outputs</text>
  <text x="802.0" y="228.0" class="mini-text"><tspan x="802.0" dy="0">• Connect concepts from at least</tspan><tspan x="802.0" dy="13">three modules in one explanation.</tspan></text><text x="802.0" y="254.0" class="mini-text"><tspan x="802.0" dy="0">• Trace a mechanism across</tspan><tspan x="802.0" dy="13">biological scales.</tspan></text><text x="802.0" y="280.0" class="mini-text"><tspan x="802.0" dy="0">• Revise a systems explanation using</tspan><tspan x="802.0" dy="13">new evidence.</tspan></text>
  <text x="84" y="306" class="card-kicker">Reasoning sequence</text>
