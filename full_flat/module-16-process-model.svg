  <text x="644" y="570" class="card-kicker">Constraint</text>
  <text x="644.0" y="600.0" class="mini-text"><tspan x="644.0" dy="0">A synthesis is more than a list; it links</tspan><tspan x="644.0" dy="14">mechanisms across scales.; Capstone reasoning</tspan><tspan x="644.0" dy="14">combines concepts into a clear claim that can be...</tspan></text>
  <text x="84" y="668" class="footer">Linked lab: lab-16_capstone-systems-synthesis.md</text>
