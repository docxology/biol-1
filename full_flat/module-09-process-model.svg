  <text x="110" y="206" class="card-kicker">Inputs</text>
  <text x="110.0" y="228.0" class="mini-text"><tspan x="110.0" dy="0">• Alleles and genotype</tspan></text><text x="110.0" y="241.0" class="mini-text"><tspan x="110.0" dy="0">• Mendelian patterns</tspan></text><text x="110.0" y="254.0" class="mini-text"><tspan x="110.0" dy="0">• Evidence from</tspan><tspan x="110.0" dy="13">lab-10_inheritance-genetics.md</tspan></text>
  <rect x="776" y="178" width="340" height="124" rx="24" class="side-card" />
  <text x="802" y="206" class="card-kicker">Outputs</text>
  <text x="802.0" y="228.0" class="mini-text"><tspan x="802.0" dy="0">• Distinguish gene, allele,</tspan><tspan x="802.0" dy="13">genotype, and phenotype.</tspan></text><text x="802.0" y="254.0" class="mini-text"><tspan x="802.0" dy="0">• Use segregation to explain</tspan><tspan x="802.0" dy="13">monohybrid inheritance.</tspan></text><text x="802.0" y="280.0" class="mini-text"><tspan x="802.0" dy="0">• Use pedigree evidence to reason</tspan><tspan x="802.0" dy="13">about traits.</tspan></text>
  <text x="84" y="306" class="card-kicker">Reasoning sequence</text>
