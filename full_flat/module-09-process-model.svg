  <rect x="84" y="538" width="500" height="94" rx="22" class="feedback-card" />
  <text x="112" y="570" class="card-kicker">Feedback</text>
  <text x="112.0" y="600.0" class="mini-text"><tspan x="112.0" dy="0">lab-10_inheritance-genetics.md evidence checks</tspan><tspan x="112.0" dy="14">whether students can explain punnett-square</tspan><tspan x="112.0" dy="14">prediction.; Retrieval questions reveal whether...</tspan></text>
