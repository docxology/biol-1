    .cluster-mechanism { fill: #245f73; }
    .cluster-evidence { fill: #6d9c57; }
    .cluster-vocabulary { fill: #9b83c6; }
    .cluster-application { fill: #d28942; }
    .cluster-revision { fill: #b85d70; }
