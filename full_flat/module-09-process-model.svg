  <text x="644.0" y="600.0" class="mini-text"><tspan x="644.0" dy="0">Punnett squares show probabilities, not guaranteed</tspan><tspan x="644.0" dy="14">offspring.; Pedigrees use family evidence to infer</tspan><tspan x="644.0" dy="14">inheritance patterns.</tspan></text>
  <text x="84" y="668" class="footer">Linked lab: lab-10_inheritance-genetics.md</text>
