<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Module 09: Inheritance Genetics Reasoning Sequence">
  <title>Module 09: Inheritance Genetics Reasoning Sequence</title>
  <desc>Process model for Module 9: Inheritance Genetics.</desc>
  <style>
    .bg { fill: #f7efe2; }
