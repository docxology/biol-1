    .prompt-text { fill: #1f2a24; font-weight: 700; font-size: 17px; font-family: Georgia, serif; }
    .routine-text { fill: #1f2a24; font-weight: 700; font-size: 16px; font-family: Georgia, serif; }
    .retrieval-step-strip { fill: #fffaf0; stroke: #245f73; stroke-width: 2; opacity: 0.96; }
    .palette-high-design { fill: #c45f35; }
    @media print { .claim-card, .side-card, .feedback-card, .prompt-card, .routine-card, .node, .stage-card-bg { filter: none; } }
    </style>
