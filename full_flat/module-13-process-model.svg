  <rect class="bg" width="1200" height="720" />
  <rect x="48" y="48" width="1104" height="624" rx="42" class="frame" />
  <text x="84" y="100" class="eyebrow">Module 13 / Process Model</text>
  <text x="84.0" y="142.0" class="title-text"><tspan x="84.0" dy="0">Module 13: How Populations Evolve Reasoning Sequence</tspan></text>
  <rect x="84" y="178" width="340" height="112" rx="24" class="side-card" />
  <text x="110" y="206" class="card-kicker">Inputs</text>
  <text x="110.0" y="228.0" class="mini-text"><tspan x="110.0" dy="0">• Allele frequencies as the unit of</tspan><tspan x="110.0" dy="13">change</tspan></text><text x="110.0" y="254.0" class="mini-text"><tspan x="110.0" dy="0">• Sources of variation</tspan></text><text x="110.0" y="267.0" class="mini-text"><tspan x="110.0" dy="0">• Evidence from</tspan><tspan x="110.0" dy="13">lab-13_how-populations-evolve.md</tspan></text>
  <rect x="776" y="178" width="340" height="112" rx="24" class="side-card" />
  <text x="802" y="206" class="card-kicker">Outputs</text>
  <text x="802.0" y="228.0" class="mini-text"><tspan x="802.0" dy="0">• Define microevolution using allele</tspan><tspan x="802.0" dy="13">frequencies.</tspan></text><text x="802.0" y="254.0" class="mini-text"><tspan x="802.0" dy="0">• Compare the five mechanisms that</tspan><tspan x="802.0" dy="13">change allele frequencies.</tspan></text><text x="802.0" y="280.0" class="mini-text"><tspan x="802.0" dy="0">• Use Hardy-Weinberg as a</tspan><tspan x="802.0" dy="13">non-evolving baseline.</tspan></text>
  <text x="84" y="306" class="card-kicker">Reasoning sequence</text>
  <path d="M 276.0 411.0 L 290.0 411.0" class="arrow" /><path d="M 486.0 411.0 L 500.0 411.0" class="arrow" /><path d="M 696.0 411.0 L 710.0 411.0" class="arrow" /><path d="M 906.0 411.0 L 920.0 411.0" class="arrow" />
  <g class="stage-card"><rect x="84.0" y="324.0" width="188" height="174" rx="24" class="stage-card-bg" /><circle cx="112.0" cy="354.0" r="18" class="stage-dot" /><text x="112.0" y="360.0" class="stage-num" text-anchor="middle">1</text><text x="100.0" y="390.0" class="stage-label"><tspan x="100.0" dy="0">Allele frequencies as the</tspan><tspan x="100.0" dy="17">unit of change</tspan></text><text x="100.0" y="432.0" class="stage-detail"><tspan x="100.0" dy="0">Microevolution is change in allele</tspan><tspan x="100.0" dy="13">frequencies across generations.</tspan></text></g><g class="stage-card"><rect x="294.0" y="324.0" width="188" height="174" rx="24" class="stage-card-bg" /><circle cx="322.0" cy="354.0" r="18" class="stage-dot" /><text x="322.0" y="360.0" class="stage-num" text-anchor="middle">2</text><text x="310.0" y="390.0" class="stage-label"><tspan x="310.0" dy="0">Sources of variation</tspan></text><text x="310.0" y="432.0" class="stage-detail"><tspan x="310.0" dy="0">Mutation creates new variation,</tspan><tspan x="310.0" dy="13">while recombination reshuffles</tspan><tspan x="310.0" dy="13">existing variation.</tspan></text></g><g class="stage-card"><rect x="504.0" y="324.0" width="188" height="174" rx="24" class="stage-card-bg" /><circle cx="532.0" cy="354.0" r="18" class="stage-dot" /><text x="532.0" y="360.0" class="stage-num" text-anchor="middle">3</text><text x="520.0" y="390.0" class="stage-label"><tspan x="520.0" dy="0">Five mechanisms of</tspan><tspan x="520.0" dy="17">microevolution</tspan></text><text x="520.0" y="432.0" class="stage-detail"><tspan x="520.0" dy="0">Mutation, gene flow, genetic</tspan><tspan x="520.0" dy="13">drift, nonrandom mating, and</tspan><tspan x="520.0" dy="13">natural selection can change...</tspan></text></g><g class="stage-card"><rect x="714.0" y="324.0" width="188" height="174" rx="24" class="stage-card-bg" /><circle cx="742.0" cy="354.0" r="18" class="stage-dot" /><text x="742.0" y="360.0" class="stage-num" text-anchor="middle">4</text><text x="730.0" y="390.0" class="stage-label"><tspan x="730.0" dy="0">Genetic drift and</tspan><tspan x="730.0" dy="17">selection</tspan></text><text x="730.0" y="432.0" class="stage-detail"><tspan x="730.0" dy="0">Genetic drift is random and</tspan><tspan x="730.0" dy="13">strongest in small populations;</tspan><tspan x="730.0" dy="13">selection is nonrandom and tied to...</tspan></text></g><g class="stage-card"><rect x="924.0" y="324.0" width="188" height="174" rx="24" class="stage-card-bg" /><circle cx="952.0" cy="354.0" r="18" class="stage-dot" /><text x="952.0" y="360.0" class="stage-num" text-anchor="middle">5</text><text x="940.0" y="390.0" class="stage-label"><tspan x="940.0" dy="0">Hardy-Weinberg as a</tspan><tspan x="940.0" dy="17">baseline</tspan></text><text x="940.0" y="432.0" class="stage-detail"><tspan x="940.0" dy="0">Hardy-Weinberg equilibrium is a</tspan><tspan x="940.0" dy="13">null model for detecting</tspan><tspan x="940.0" dy="13">evolutionary change.</tspan></text></g>
  <rect x="84" y="538" width="500" height="94" rx="22" class="feedback-card" />
  <text x="112" y="570" class="card-kicker">Feedback</text>
  <text x="112.0" y="600.0" class="mini-text"><tspan x="112.0" dy="0">lab-13_how-populations-evolve.md evidence checks</tspan><tspan x="112.0" dy="14">whether students can explain five mechanisms of</tspan><tspan x="112.0" dy="14">microevolution.; Retrieval questions reveal...</tspan></text>
  <rect x="616" y="538" width="500" height="94" rx="22" class="feedback-card" />
  <text x="644" y="570" class="card-kicker">Constraint</text>
  <text x="644.0" y="600.0" class="mini-text"><tspan x="644.0" dy="0">Random drift and nonrandom selection can both</tspan><tspan x="644.0" dy="14">change populations.; Hardy-Weinberg equilibrium is</tspan><tspan x="644.0" dy="14">a null model for detecting evolutionary change.</tspan></text>
  <text x="84" y="668" class="footer">Linked lab: lab-13_how-populations-evolve.md</text>
</svg>
