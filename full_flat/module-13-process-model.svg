<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Module 13: How Populations Evolve Reasoning Sequence">
  <title>Module 13: How Populations Evolve Reasoning Sequence</title>
  <desc>Process model for Module 13: How Populations Evolve.</desc>
  <style>
    .bg { fill: #f7efe2; }
