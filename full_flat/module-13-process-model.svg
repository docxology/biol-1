      <stop offset="1" stop-color="#245f73" stop-opacity="0.18" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#1f2a24" flood-opacity="0.16"/>
