# Publish Configuration for cr-bio
# ================================
# This configuration controls the full publish pipeline via `python publish.py`
# 
# Usage:
#   python publish.py              # Full pipeline with config settings
#   python publish.py --dry-run    # Preview what would be generated
#   python publish.py --override-formats pdf,html  # Override formats

[publish]
clean = true        # Clean output directories before generation
verbose = true     # Enable verbose logging

# Output Format Configuration
# --------------------------
# Toggle each format on/off as needed. MP3 is time-consuming (~30s per file)
# and requires internet access for Google TTS.
[publish.formats]
pdf  = true         # PDF files (via WeasyPrint)
docx = true         # Word documents (via Pandoc)
html = false         # HTML files (via Pandoc)
txt  = false         # Plain text (extracted from Markdown)
md   = true          # Markdown copy (source files with standardized names)
mp3  = false        # Audio narration (via Google TTS, slower)

# Course Configuration
# -------------------
# Each course can be enabled/disabled independently with specific options.

[publish.courses.biol-1]
enabled = true
modules = 17
max_module = 17      # Generate modules 1 through max_module (set lower to limit, e.g., 6)
max_lab = 17         # Generate labs 1 through max_lab (set lower to limit, e.g., 5)
path = "course_development/biol-1"
input_types = ["keys-to-success", "questions"]
include_syllabus = true
include_labs = true
include_dashboards = true
include_slides = true
include_practice_tests = true

[publish.courses.biol-8]
enabled = true
modules = 15
max_module = 6      # Generate modules 1 through max_module (set lower to limit, e.g., 6)
max_lab = 4         # Generate labs 1 through max_lab (set lower to limit, e.g., 5)
path = "course_development/biol-8"
input_types = ["keys-to-success", "questions"]
include_syllabus = true
include_labs = true
include_dashboards = true
include_exams = true
include_slides = true
include_practice_tests = true

# Pipeline Stage Configuration
# ---------------------------
# Toggle individual pipeline stages. Useful for debugging or partial runs.
[publish.pipeline]
generate  = true    # Generate outputs from source Markdown
publish   = true    # Copy outputs to PUBLISHED/ directory
copy_extras = true  # Copy labs and dashboards
flatten   = true    # Flatten module subdirectory structure
validate  = true    # Validate all outputs exist and are correct
git_push  = true    # Push to configured git repos after publish

# Git Repository Configuration
# ---------------------------
# Configure git remotes for automatic deployment. Requires remotes to be set up.
# Run `python publish.py --setup-git` to configure remotes if needed.
[publish.git]
enabled = true                      # Master toggle for git operations
auto_commit = true                  # Automatically commit PUBLISHED changes
commit_message = "Update published course materials"

# Private repository (source of truth)
[publish.git.repos.cr-bio]
remote = "origin"
url = "https://github.com/docxology/cr-bio.git"
branch = "main"
push = true

# Public course repositories (subtree push)
[publish.git.repos.biol-1]
remote = "biol-1"
url = "https://github.com/docxology/biol-1.git"
branch = "main"
prefix = "PUBLISHED/biol-1"         # Subtree prefix for push
push = true
force = true                        # Use force push for subtree

[publish.git.repos.biol-8]
remote = "biol-8"
url = "https://github.com/docxology/biol-8.git"
branch = "main"
prefix = "PUBLISHED/biol-8"         # Subtree prefix for push
push = true
force = true                        # Use force push for subtree
