<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Module 16: Capstone Systems Synthesis Retrieval and Lab Check">
  <title>Module 16: Capstone Systems Synthesis Retrieval and Lab Check</title>
  <desc>Retrieval card for Module 16: Capstone Systems Synthesis.</desc>
  <style>
    .bg { fill: #f4f1e6; }
    .halo { fill: url(#wash); opacity: 0.92; }
    .frame { fill: #fffdf5; stroke: #2c2517; stroke-width: 3; }
    .eyebrow { fill: #9b3f2f; font-weight: 800; font-size: 18px; font-family: Georgia, serif; letter-spacing: 1.5px; text-transform: uppercase; }
    .title-text { fill: #2c2517; font-weight: 800; font-size: 24px; font-family: Georgia, serif; }
    .footer { fill: #6a614d; font-weight: 400; font-size: 16px; font-family: Georgia, serif; }
    .claim-card, .side-card, .feedback-card, .prompt-card, .routine-card, .stage-card-bg { fill: #fffdf5; stroke: #2c2517; stroke-width: 2.5; filter: url(#shadow); }
    .claim-kicker, .card-kicker { fill: #9b3f2f; font-weight: 800; font-size: 17px; font-family: Georgia, serif; letter-spacing: 0.8px; text-transform: uppercase; }
    .claim-text { fill: #2c2517; font-weight: 700; font-size: 22px; font-family: Georgia, serif; }
    .node { fill: #fffdf5; stroke: #2f6f4e; stroke-width: 3; filter: url(#shadow); }
    .node-claim { stroke: #9b3f2f; }
    .node-mechanism { stroke: #2f6f4e; }
    .node-evidence { stroke: #567d46; }
    .node-vocabulary { stroke: #8067a9; }
    .node-application { stroke: #b26b2f; }
    .node-revision { stroke: #8a4351; }
    .cluster-pill { stroke: none; opacity: 0.92; }
    .cluster-claim { fill: #9b3f2f; }
    .cluster-mechanism { fill: #2f6f4e; }
    .cluster-evidence { fill: #6d9c57; }
    .cluster-vocabulary { fill: #9b83c6; }
    .cluster-application { fill: #d28942; }
    .cluster-revision { fill: #b85d70; }
    .cluster-label, .legend-text { fill: white; font-weight: 800; font-size: 11px; font-family: Georgia, serif; letter-spacing: 1px; text-transform: uppercase; }
    .node-label { fill: #2c2517; font-weight: 800; font-size: 16px; font-family: Georgia, serif; }
    .node-detail { fill: #6a614d; font-weight: 400; font-size: 12px; font-family: Georgia, serif; }
    .edge { stroke: #9b3f2f; stroke-width: 4; stroke-linecap: round; opacity: 0.72; marker-end: url(#arrowhead); }
    .edge-label { fill: #9b3f2f; font-weight: 700; font-size: 12px; font-family: Georgia, serif; text-anchor: middle; paint-order: stroke; stroke: #f4f1e6; stroke-width: 5; }
    .stage-dot { fill: #2f6f4e; }
    .stage-num { fill: white; font-weight: 900; font-size: 18px; font-family: Georgia, serif; }
    .stage-label { fill: #2c2517; font-weight: 800; font-size: 16px; font-family: Georgia, serif; }
    .stage-detail, .mini-text, .check-text { fill: #6a614d; font-weight: 400; font-size: 12px; font-family: Georgia, serif; }
    .arrow { fill: none; stroke: #2f6f4e; stroke-width: 5; stroke-linecap: round; marker-end: url(#arrowhead); }
    .prompt-text { fill: #2c2517; font-weight: 700; font-size: 17px; font-family: Georgia, serif; }
    .routine-text { fill: #2c2517; font-weight: 700; font-size: 16px; font-family: Georgia, serif; }
    .retrieval-step-strip { fill: #fffdf5; stroke: #2f6f4e; stroke-width: 2; opacity: 0.96; }
    .palette-high-design { fill: #9b3f2f; }
    @media print { .claim-card, .side-card, .feedback-card, .prompt-card, .routine-card, .node, .stage-card-bg { filter: none; } }
    </style>
  <defs>
    <linearGradient id="wash" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf5" />
      <stop offset="1" stop-color="#2f6f4e" stop-opacity="0.18" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#2c2517" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#2f6f4e" />
    </marker>
    </defs>
  <rect class="bg" width="1200" height="720" />
  <path class="halo" d="M44 72 H1156 V648 H44 Z" />
  <text x="82" y="92" class="eyebrow">Module 16 / Retrieval Card</text>
  <text x="82.0" y="132.0" class="title-text"><tspan x="82.0" dy="0">Module 16: Capstone Systems Synthesis</tspan><tspan x="82.0" dy="32">Retrieval and Lab Check</tspan></text>
  <rect x="82" y="172" width="1026" height="36" rx="18" class="retrieval-step-strip" />
  <text x="120" y="196" class="routine-text">1 Cover notes</text>
  <text x="354" y="196" class="routine-text">2 Answer aloud</text>
  <text x="604" y="196" class="routine-text">3 Cite evidence</text>
  <text x="844" y="196" class="routine-text">4 Revise</text>
  <rect x="860" y="78" width="284" height="82" rx="22" class="routine-card" />
  <text x="884" y="106" class="card-kicker">Routine</text>
  <text x="884.0" y="128.0" class="routine-text"><tspan x="884.0" dy="0">Cover notes -&gt; answer aloud</tspan><tspan x="884.0" dy="14">-&gt; cite evidence -&gt; revise</tspan></text>
  <rect x="92" y="222" width="462" height="124" rx="26" class="prompt-card" /><text x="120" y="260" class="card-kicker">Q1</text><text x="120.0" y="288.0" class="prompt-text"><tspan x="120.0" dy="0">How can a molecular change affect an</tspan><tspan x="120.0" dy="18">ecosystem?</tspan></text><text x="120.0" y="323.0" class="check-text"><tspan x="120.0" dy="0">Check: A variant can affect a protein, plant water use,</tspan><tspan x="120.0" dy="13">reproduction, and food available to other organisms.</tspan></text><rect x="604" y="222" width="462" height="124" rx="26" class="prompt-card" /><text x="632" y="260" class="card-kicker">Q2</text><text x="632.0" y="288.0" class="prompt-text"><tspan x="632.0" dy="0">Why does scale matter in biological</tspan><tspan x="632.0" dy="18">explanation?</tspan></text><text x="632.0" y="323.0" class="check-text"><tspan x="632.0" dy="0">Check: A claim at each scale needs evidence measured at that</tspan><tspan x="632.0" dy="13">scale.</tspan></text><rect x="92" y="374" width="462" height="124" rx="26" class="prompt-card" /><text x="120" y="412" class="card-kicker">Q3</text><text x="120.0" y="440.0" class="prompt-text"><tspan x="120.0" dy="0">What is a mechanism chain?</tspan></text><text x="120.0" y="475.0" class="check-text"><tspan x="120.0" dy="0">Check: A mechanism chain links a cause to successive effects</tspan><tspan x="120.0" dy="13">and explains how each link works.</tspan></text><rect x="604" y="374" width="462" height="124" rx="26" class="prompt-card" /><text x="632" y="412" class="card-kicker">Q4</text><text x="632.0" y="440.0" class="prompt-text"><tspan x="632.0" dy="0">How can feedback limit or amplify change?</tspan></text><text x="632.0" y="475.0" class="check-text"><tspan x="632.0" dy="0">Check: Balancing feedback counteracts a change; reinforcing</tspan><tspan x="632.0" dy="13">feedback amplifies it.</tspan></text>
  <rect x="92" y="548" width="462" height="86" rx="24" class="side-card" />
  <text x="120" y="582" class="card-kicker">Terms to use</text>
  <text x="120.0" y="612.0" class="mini-text"><tspan x="120.0" dy="0">System, Scale, Mechanism, Feedback loop, Constraint</tspan></text>
  <rect x="604" y="548" width="504" height="86" rx="24" class="side-card" />
  <text x="632" y="582" class="card-kicker">Lab connection</text>
  <text x="632.0" y="612.0" class="mini-text"><tspan x="632.0" dy="0">lab-17_capstone-systems-synthesis.md supplies evidence for</tspan><tspan x="632.0" dy="17">a capstone evidence chain across labs and course concepts.</tspan></text>
  <text x="82" y="672" class="footer">Intro biology routine: claim, evidence, reasoning, revision.</text>
</svg>
